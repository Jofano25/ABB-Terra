              private static Object parseJsonAny(String s) throws Exception {
                  String x=s.trim();
                  return x.startsWith("[")?new JSONArray(x):new JSONObject(x);
              }

              private static String findString(Object obj,String key) {
                  if (obj==null) return "";
                  try {
                      if (obj instanceof JSONObject) {
                          JSONObject j=(JSONObject)obj;
                          if (j.has(key) && !j.isNull(key)) return String.valueOf(j.get(key));
                          Iterator<String> it=j.keys();
                          while(it.hasNext()) {
                              String r=findString(j.opt(it.next()),key);
                              if (!r.isEmpty()) return r;
                          }
                      } else if (obj instanceof JSONArray) {
                          JSONArray a=(JSONArray)obj;
                          for(int i=0;i<a.length();i++) {
                              String r=findString(a.opt(i),key);
                              if (!r.isEmpty()) return r;
                          }
                      }
                  } catch(Exception ignored) {}
                  return "";
              }

              private static Integer findInt(Object obj,String key) {
                  String s=findString(obj,key);
                  try { return s.isEmpty()?null:Integer.parseInt(s); }
                  catch(Exception e) { return null; }
              }

              private static String readAll(InputStream in) throws Exception {
                  if (in==null) return "";
                  ByteArrayOutputStream b=new ByteArrayOutputStream();
                  byte[] buf=new byte[4096];
                  int n;
                  while((n=in.read(buf))!=-1) b.write(buf,0,n);
                  return b.toString("UTF-8");
              }

              private static String compact(String s) {
                  if (s==null) return "";
                  s=s.replace("\n"," ").replace("\r"," ");
                  return s.length()>240?s.substring(0,240):s;
              }

              private static String enc(String s) throws Exception { return URLEncoder.encode(s,"UTF-8"); }
              private static String safeError(Exception e) { return e==null?"Unknown error":(e.getMessage()==null?e.getClass().getSimpleName():e.getMessage()); }
              private String safeName(BluetoothDevice d) { try { return d==null?null:d.getName(); } catch(Exception e) { return null; } }
              private String safeAddress(BluetoothDevice d) { try { return d==null?null:d.getAddress(); } catch(Exception e) { return null; } }

              private static byte[] concat(byte[]... arrays) {
                  int total=0;
                  for(byte[] a:arrays) if (a!=null) total+=a.length;
                  byte[] out=new byte[total];
                  int p=0;
                  for(byte[] a:arrays) {
                      if (a==null) continue;
                      System.arraycopy(a,0,out,p,a.length);
                      p+=a.length;
                  }
                  return out;
              }

              private static byte[] lastBytes(byte[] b,int n) {
                  if (b==null || b.length<n) return new byte[0];
                  return Arrays.copyOfRange(b,b.length-n,b.length);
              }

              private static boolean isAllZero(byte[] b) {
                  if (b==null) return true;
                  for(byte x:b) if (x!=0) return false;
                  return true;
              }

              private static byte[] leShort(int v) {
                  return new byte[]{(byte)(v&0xff),(byte)((v>>8)&0xff)};
              }

              private static byte[] leInt(int v) {
                  return new byte[]{(byte)v,(byte)(v>>8),(byte)(v>>16),(byte)(v>>24)};
              }

              private static byte[] unhex(String s) {
                  if (s==null) return new byte[0];
                  s=s.replaceAll("[^0-9A-Fa-f]","");
                  if ((s.length()&1)==1) return new byte[0];
                  byte[] out=new byte[s.length()/2];
                  for(int i=0;i<out.length;i++)
                      out[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);
                  return out;
              }

              private static String hex(byte[] b) {
                  if (b==null) return "";
                  StringBuilder s=new StringBuilder();
                  for(byte x:b) s.append(String.format(Locale.US,"%02X",x));
                  return s.toString();
              }

              private static String hexByte(int b) {
                  return String.format(Locale.US,"%02X",b&0xff);
              }

              private int dp(int v) { return Math.round(v*getResources().getDisplayMetrics().density); }

              private void toast(String s) {
                  runOnUiThread(() -> Toast.makeText(this,s,Toast.LENGTH_LONG).show());
              }

