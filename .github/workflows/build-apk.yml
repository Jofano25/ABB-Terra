              private void copyLog() {
                  ClipboardManager cm=(ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("ABB Terra Direct debug",logText.getText()));
                  toast("Debug log copied.");
