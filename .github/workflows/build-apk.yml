name: Build ABB Terra PIN Direct Provisioner

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/elmecon/abbterra

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'ABBTerraDirect'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.elmecon.abbterra'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.elmecon.abbterra'
                  minSdk 23
                  targetSdk 35
                  versionCode 210
                  versionName '2.1-pin-direct'
              }

              buildTypes {
                  release { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:label="ABB Terra PIN Direct"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/elmecon/abbterra/MainActivity.java <<'EOF'
          package com.elmecon.abbterra;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.*;
          import android.bluetooth.le.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.*;
          import android.text.InputType;
          import android.text.InputFilter;
          import android.view.*;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.charset.StandardCharsets;
          import java.security.SecureRandom;
          import java.text.SimpleDateFormat;
          import java.util.*;
          import javax.crypto.Cipher;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.crypto.spec.SecretKeySpec;

          public class MainActivity extends Activity {
              // ABB Terra AC BLE service
              private static final UUID FFF0 = UUID.fromString("0000fff0-0000-1000-8000-00805f9b34fb");
              private static final UUID FFF3 = UUID.fromString("0000fff3-0000-1000-8000-00805f9b34fb");
              private static final UUID FFF4 = UUID.fromString("0000fff4-0000-1000-8000-00805f9b34fb");
              private static final UUID CCCD = UUID.fromString("00002902-0000-1000-8000-00805f9b34fb");

              private static final int REQ_PERMS = 7101;
              private static final int CMD_AUTH = 0xFE;
              private static final int CMD_SYSINFO = 0xB1;
              private static final int CMD_OCPP = 0xD6;
              private static final int CMD_OCPP_STATUS = 0xD8;

              private static final String API = "https://abb-installer.chargedot.com";
              // Public mobile-client credentials embedded in the official mobile application.
              private final Handler main = new Handler(Looper.getMainLooper());
              private final SecureRandom rng = new SecureRandom();

              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic tx, rx;
              private int mtu = 158;
              private boolean transportReady = false;
              private boolean authenticated = false;
              private String deviceNumber = "";
              private String firmwareVersion = "";

              private byte[] encryptionKey;
              private byte[] cipherInfo;
              private byte[] sessionToken = new byte[8];
              private byte[] clientNonce;
              private int userId = 0;

              private final ByteArrayOutputStream rxBuffer = new ByteArrayOutputStream();
              private final ArrayDeque<byte[]> txChunks = new ArrayDeque<>();
              private boolean txBusy = false;
              private int waitingCmd = -1;
              private PacketCallback waitingCallback;

              private TextView statusTitle, statusDetail, selectedDevice, logText;
              private LinearLayout deviceList, progressBox;
              private EditText chargerPin, fwInput;
              private EditText chargePointId, serverUrl, authKey;
              private CheckBox requiresPassword;
              private Button scanBtn, authBtn, saveBtn, verifyBtn, disconnectBtn;
              private final Set<String> seen = new HashSet<>();

              interface PacketCallback { void onPacket(Packet p); }

              static class Packet {
                  int cmd;
                  int code;
                  byte[] body;
                  byte[] payload;
                  byte[] token;
                  String error;
              }

              private final ScanCallback scanCallback = new ScanCallback() {
                  @Override public void onScanResult(int callbackType, ScanResult result) {
                      BluetoothDevice d = result.getDevice();
                      String addr = safeAddress(d);
                      if (addr == null || seen.contains(addr)) return;
                      String n = safeName(d);
                      if (n == null || !n.toUpperCase(Locale.US).startsWith("TACW")) return;
                      seen.add(addr);
                      String raw = result.getScanRecord() == null ? "" : hex(result.getScanRecord().getBytes());
                      final String name = n;
                      appendLog("SCAN " + name + " RSSI=" + result.getRssi() + " raw=" + raw);
                      runOnUiThread(() -> addDevice(d, name, addr, result.getRssi()));
                  }
                  @Override public void onScanFailed(int errorCode) {
                      failStatus("BLE scan failed", "Code " + errorCode);
                  }
              };

              private final BluetoothGattCallback gattCallback = new BluetoothGattCallback() {
                  @Override public void onConnectionStateChange(BluetoothGatt gg, int st, int ns) {
                      appendLog("GATT state status=" + st + " state=" + ns);
                      if (st == BluetoothGatt.GATT_SUCCESS && ns == BluetoothProfile.STATE_CONNECTED) {
                          gatt = gg;
                          progress("Bluetooth", true, "GATT connected");
                          setStatus("Bluetooth connected", "Opening Terra configuration channel...");
                          try { gg.requestConnectionPriority(BluetoothGatt.CONNECTION_PRIORITY_HIGH); } catch (Exception ignored) {}
                          try { gg.requestMtu(247); } catch (Exception ignored) {}
                          main.postDelayed(() -> {
                              try { gg.discoverServices(); } catch (Exception e) { failStatus("Service discovery failed", e.getMessage()); }
                          }, 250);
                      } else if (ns == BluetoothProfile.STATE_DISCONNECTED) {
                          transportReady = false;
                          authenticated = false;
                          progress("Bluetooth", false, "Disconnected");
                          progress("Secure session", false, "Not authenticated");
                          setStatus("Disconnected", "Scan and connect to charger.");
                          updateButtons();
                      }
                  }

                  @Override public void onMtuChanged(BluetoothGatt gg, int newMtu, int st) {
                      if (st == BluetoothGatt.GATT_SUCCESS) mtu = newMtu;
                      appendLog("MTU=" + newMtu + " status=" + st);
                  }

                  @Override public void onServicesDiscovered(BluetoothGatt gg, int st) {
                      BluetoothGattService s = gg.getService(FFF0);
                      if (s == null) { failStatus("Terra BLE service not found", "FFF0 missing"); return; }
                      tx = s.getCharacteristic(FFF3);
                      rx = s.getCharacteristic(FFF4);
                      if (tx == null || rx == null) { failStatus("Terra BLE channel incomplete", "FFF3/FFF4 missing"); return; }

                      try {
                          boolean local = gg.setCharacteristicNotification(rx, true);
                          appendLog("Enable FFF4 local notify=" + local);
                          BluetoothGattDescriptor d = rx.getDescriptor(CCCD);
                          if (d == null) { failStatus("Notification unavailable", "FFF4 CCCD missing"); return; }
                          if (Build.VERSION.SDK_INT >= 33) {
                              int r = gg.writeDescriptor(d, BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);
                              appendLog("CCCD write result=" + r);
                          } else {
                              d.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);
                              appendLog("CCCD write=" + gg.writeDescriptor(d));
                          }
                      } catch (Exception e) {
                          failStatus("FFF4 notification failed", e.getMessage());
                      }
                  }

                  @Override public void onDescriptorWrite(BluetoothGatt gg, BluetoothGattDescriptor d, int st) {
                      if (CCCD.equals(d.getUuid()) && st == BluetoothGatt.GATT_SUCCESS) {
                          transportReady = true;
                          progress("Bluetooth", true, "FFF3 / FFF4 ready");
                          setStatus("Bluetooth connected", deviceNumber.isEmpty() ? "Enter 8-char PIN to authenticate." : deviceNumber + " • waiting for PIN/auth");
                          updateButtons();
                          if (credentialsReady()) main.postDelayed(() -> authenticateCharger(), 250);
                      }
                  }

                  @Override public void onCharacteristicWrite(BluetoothGatt gg, BluetoothGattCharacteristic c, int st) {
                      txBusy = false;
                      if (st != BluetoothGatt.GATT_SUCCESS) {
                          failStatus("BLE write failed", "GATT status " + st);
                          txChunks.clear();
                          return;
                      }
                      sendNextChunk();
                  }

                  @Override public void onCharacteristicChanged(BluetoothGatt gg, BluetoothGattCharacteristic c) {
                      onRx(c.getValue());
                  }
              };

              @Override protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(Color.rgb(7,18,30));
                  buildUi();

                  BluetoothManager bm = (BluetoothManager)getSystemService(BLUETOOTH_SERVICE);
                  adapter = bm == null ? null : bm.getAdapter();
                  requestPerms();

                  appendLog("ABB Terra Direct Provisioner 2.0 started");
                  appendLog("Direct mode: PIN-only secure BLE + OCPP configuration. No ABB account required.");
              }

              private void buildUi() {
                  final int BG = Color.rgb(7,18,30);
                  final int CARD = Color.rgb(14,31,48);
                  final int ACCENT = Color.rgb(42,213,196);
                  final int MUTED = Color.rgb(151,171,188);
                  final int WHITE = Color.rgb(239,247,252);

                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(BG);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(18), dp(16), dp(30));
                  sv.addView(root, new ScrollView.LayoutParams(-1,-2));

                  TextView title = text("ABB TERRA", 26, true, WHITE);
                  root.addView(title);
                  TextView sub = text("DIRECT PROVISIONER", 13, true, ACCENT);
                  sub.setLetterSpacing(.18f);
                  sub.setPadding(0,0,0,dp(16));
                  root.addView(sub);

                  LinearLayout statusCard = card(CARD);
                  statusTitle = text("READY", 18, true, WHITE);
                  statusDetail = text("Scan a Terra AC charger to begin.", 13, false, MUTED);
                  selectedDevice = text("No charger selected", 13, true, ACCENT);
                  statusCard.addView(statusTitle);
                  statusCard.addView(statusDetail);
                  selectedDevice.setPadding(0,dp(10),0,0);
                  statusCard.addView(selectedDevice);
                  root.addView(statusCard, cardLp());

                  LinearLayout scanRow = new LinearLayout(this);
                  scanRow.setOrientation(LinearLayout.HORIZONTAL);
                  scanBtn = button("SCAN CHARGER", ACCENT, Color.rgb(5,33,38));
                  disconnectBtn = button("DISCONNECT", Color.rgb(72,91,108), WHITE);
                  scanRow.addView(scanBtn, new LinearLayout.LayoutParams(0,dp(52),1));
                  LinearLayout.LayoutParams dlp = new LinearLayout.LayoutParams(0,dp(52),1); dlp.setMargins(dp(8),0,0,0);
                  scanRow.addView(disconnectBtn, dlp);
                  root.addView(scanRow);
                  scanBtn.setOnClickListener(v -> startScan());
                  disconnectBtn.setOnClickListener(v -> disconnect());

                  deviceList = new LinearLayout(this);
                  deviceList.setOrientation(LinearLayout.VERTICAL);
                  root.addView(deviceList);

                  LinearLayout access = card(CARD);
                  access.addView(section("CHARGER ACCESS", ACCENT));
                  chargerPin = input("8-character charger PIN", WHITE, MUTED);
                  chargerPin.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD);
                  chargerPin.setFilters(new InputFilter[]{new InputFilter.LengthFilter(8)});
                  fwInput = input("Firmware version (auto; isi manual jika diperlukan)", WHITE, MUTED);
                  access.addView(labeled("Charger PIN (visible, max 8 chars)", chargerPin, MUTED));
                  access.addView(labeled("Firmware", fwInput, MUTED));
                  authBtn = button("CONNECT + AUTHENTICATE", ACCENT, Color.rgb(5,33,38));
                  LinearLayout.LayoutParams abp = new LinearLayout.LayoutParams(-1,dp(54)); abp.setMargins(0,dp(10),0,0);
                  access.addView(authBtn, abp);
                  root.addView(access, cardLp());
                  authBtn.setOnClickListener(v -> authenticateCharger());

                  LinearLayout ocpp = card(CARD);
                  ocpp.addView(section("CUSTOM OCPP SERVER", ACCENT));
                  chargePointId = input("e.g. ABB-V2-NEW", WHITE, MUTED);
                  serverUrl = input("e.g. ws://192.168.10.186:9220", WHITE, MUTED);
                  authKey = input("Authorization Key / Password", WHITE, MUTED);
                  authKey.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  requiresPassword = new CheckBox(this);
                  requiresPassword.setText("Server requires password / AuthKey");
                  requiresPassword.setTextColor(WHITE);
                  requiresPassword.setChecked(true);
                  ocpp.addView(labeled("Charger ID / Charge Point Identity", chargePointId, MUTED));
                  ocpp.addView(labeled("OCPP Server URL", serverUrl, MUTED));
                  ocpp.addView(labeled("AuthKey / Password", authKey, MUTED));
                  ocpp.addView(requiresPassword);
                  TextView proto = text("OCPP 1.6J  •  WS/WSS detected automatically",12,false,MUTED);
                  proto.setPadding(0,dp(5),0,dp(8));
                  ocpp.addView(proto);
                  saveBtn = button("CONFIGURE CHARGER", ACCENT, Color.rgb(5,33,38));
                  saveBtn.setEnabled(false);
                  ocpp.addView(saveBtn, new LinearLayout.LayoutParams(-1,dp(58)));
                  root.addView(ocpp, cardLp());
                  saveBtn.setOnClickListener(v -> configureCharger());

                  LinearLayout pcard = card(CARD);
                  pcard.addView(section("COMMISSIONING STATUS", ACCENT));
                  progressBox = new LinearLayout(this);
                  progressBox.setOrientation(LinearLayout.VERTICAL);
                  pcard.addView(progressBox);
                  progress("Bluetooth", false, "Waiting");
                  progress("Secure session", false, "Waiting");
                  progress("Charger authentication", false, "Waiting");
                  progress("OCPP configuration", false, "Waiting");
                  progress("Verification", false, "Waiting");
                  verifyBtn = button("VERIFY CONNECTION", Color.rgb(47,75,96), WHITE);
                  LinearLayout.LayoutParams vlp = new LinearLayout.LayoutParams(-1,dp(50)); vlp.setMargins(0,dp(10),0,0);
                  pcard.addView(verifyBtn, vlp);
                  root.addView(pcard, cardLp());
                  verifyBtn.setOnClickListener(v -> verify());

                  LinearLayout debug = card(CARD);
                  TextView dh = section("ADVANCED / DEBUG LOG", ACCENT);
                  debug.addView(dh);
                  logText = text("", 10, false, Color.rgb(178,203,219));
                  logText.setTypeface(Typeface.MONOSPACE);
                  logText.setTextIsSelectable(true);
                  debug.addView(logText, new LinearLayout.LayoutParams(-1,dp(340)));
                  Button copy = button("COPY DEBUG LOG", Color.rgb(47,75,96), WHITE);
                  debug.addView(copy, new LinearLayout.LayoutParams(-1,dp(48)));
                  copy.setOnClickListener(v -> copyLog());
                  root.addView(debug, cardLp());

                  setContentView(sv);
                  updateButtons();
              }

              private LinearLayout card(int color) {
                  LinearLayout x = new LinearLayout(this);
                  x.setOrientation(LinearLayout.VERTICAL);
                  x.setPadding(dp(16),dp(15),dp(16),dp(15));
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(color);
                  gd.setCornerRadius(dp(16));
                  gd.setStroke(dp(1), Color.rgb(33,59,78));
                  x.setBackground(gd);
                  return x;
              }

              private LinearLayout.LayoutParams cardLp() {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1,-2);
                  p.setMargins(0,dp(10),0,dp(4));
                  return p;
              }

              private TextView section(String s, int c) {
                  TextView t = text(s,14,true,c);
                  t.setLetterSpacing(.08f);
                  t.setPadding(0,0,0,dp(10));
                  return t;
              }

              private LinearLayout labeled(String label, View field, int muted) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  TextView l = text(label,12,true,muted);
                  l.setPadding(0,dp(5),0,0);
                  box.addView(l);
                  box.addView(field, new LinearLayout.LayoutParams(-1,dp(50)));
                  return box;
              }

              private EditText input(String hint, int fg, int hintColor) {
                  EditText e = new EditText(this);
                  e.setHint(hint);
                  e.setHintTextColor(hintColor);
                  e.setTextColor(fg);
                  e.setTextSize(15);
                  e.setSingleLine(true);
                  e.setPadding(dp(12),0,dp(12),0);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(Color.rgb(8,24,39));
                  gd.setCornerRadius(dp(10));
                  gd.setStroke(dp(1),Color.rgb(44,68,87));
                  e.setBackground(gd);
                  return e;
              }

              private Button button(String s, int bg, int fg) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setTextColor(fg);
                  b.setTextSize(13);
                  b.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  b.setAllCaps(false);
                  GradientDrawable gd = new GradientDrawable();
                  gd.setColor(bg);
                  gd.setCornerRadius(dp(12));
                  b.setBackground(gd);
                  return b;
              }

              private TextView text(String s,float sp,boolean bold,int color) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(sp);
                  t.setTextColor(color);
                  if (bold) t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);
                  return t;
              }

              private void addDevice(BluetoothDevice d, String name, String addr, int rssi) {
                  Button b = button(name + "\n" + addr + "   RSSI " + rssi + " dBm", Color.rgb(20,43,61), Color.WHITE);
                  b.setGravity(Gravity.START | Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1,dp(66));
                  lp.setMargins(0,dp(8),0,0);
                  deviceList.addView(b,lp);
                  b.setOnClickListener(v -> {
                      deviceNumber = name;
                      selectedDevice.setText(name + "   •   " + rssi + " dBm");
                      connect(d);
                  });
              }

              private void startScan() {
                  if (adapter == null) { failStatus("Bluetooth unavailable",""); return; }
                  if (!permOk()) { requestPerms(); return; }
                  if (!adapter.isEnabled()) { toast("Turn Bluetooth ON"); return; }
                  scanner = adapter.getBluetoothLeScanner();
                  if (scanner == null) { failStatus("BLE scanner unavailable",""); return; }
                  stopScan();
                  seen.clear();
                  deviceList.removeAllViews();
                  setStatus("Scanning chargers", "Looking for TACW devices...");
                  try {
                      scanner.startScan(scanCallback);
                      main.postDelayed(this::stopScan, 20000);
                  } catch(Exception e) { failStatus("Scan error",e.getMessage()); }
              }

              private void stopScan() {
                  if (scanner != null) try { scanner.stopScan(scanCallback); } catch(Exception ignored) {}
              }

              private void connect(BluetoothDevice d) {
                  stopScan();
                  disconnect();
                  deviceNumber = safeName(d) == null ? deviceNumber : safeName(d);
                  selectedDevice.setText(deviceNumber + " • connecting...");
                  setStatus("Connecting", deviceNumber);
                  try {
                      gatt = Build.VERSION.SDK_INT >= 23
                              ? d.connectGatt(this,false,gattCallback,BluetoothDevice.TRANSPORT_LE)
                              : d.connectGatt(this,false,gattCallback);
                  } catch(Exception e) { failStatus("BLE connect failed",e.getMessage()); }
              }

              private boolean credentialsReady() {
                  return chargerPin.getText().toString().trim().length() == 8
                          && !deviceNumber.isEmpty();
              }

              private void authenticateCharger() {
                  if (!transportReady) { toast("Connect charger first."); return; }
                  if (!credentialsReady()) { toast("Charger PIN harus tepat 8 karakter."); return; }

                  authenticated = false;
                  updateButtons();
                  progress("Secure session", false, "Getting authorized cipher...");
                  setStatus("Secure authentication", "Authorizing " + deviceNumber + "...");
                  authBtn.setEnabled(false);

                  new Thread(() -> {
                      try {
                          pinOnlyAuthorize();
                          runOnUiThread(() -> {
                              progress("Secure session", true, "Cipher authorized");
                              String fw = fwInput.getText().toString().trim();
                              if (!fw.isEmpty()) firmwareVersion = fw;
                              if (firmwareVersion.isEmpty()) {
                                  failStatus("Firmware version required",
                                          "Cloud did not return firmware. Enter exact firmware in Secure Access.");
                                  authBtn.setEnabled(true);
                                  return;
                              }
                              appendLog("Secure material ready. firmware=" + firmwareVersion + " userId=" + userId);
                              startHandshake1();
                          });
                      } catch(Exception e) {
                          appendLog("AUTH BACKEND ERROR: " + e);
                          failStatus("ABB authorization failed", safeError(e));
                          runOnUiThread(() -> authBtn.setEnabled(true));
                      }
                  }).start();
              }

              private void pinOnlyAuthorize() throws Exception {
                  String pin = chargerPin.getText().toString().trim();
                  if (pin.length() != 8) throw new Exception("PIN charger harus 8 karakter.");

                  JSONObject req = new JSONObject();
                  req.put("deviceNumber", deviceNumber);
                  req.put("pinCode", pin);

                  Object cipherResp = null;
                  Exception last = null;

                  // TerraConfig contains a dedicated PIN-check endpoint. Try it first without
                  // an ABB user login so the installer only needs the charger PIN.
                  String[] endpoints = new String[] {
                          API + "/api/v2/devices/check-pincode",
                          API + "/api/v2/devices/" + URLEncoder.encode(deviceNumber,"UTF-8") + "/cipher"
                  };

                  for (String ep : endpoints) {
                      try {
                          cipherResp = parseJsonAny(http("POST", ep, "application/json", req.toString(), null));
                          String k = findString(cipherResp,"secretKey");
                          String i = findString(cipherResp,"info");
                          if (!k.isEmpty() && !i.isEmpty()) break;
                      } catch(Exception e) {
                          last=e;
                          appendLog("PIN authorization endpoint failed: " + safeError(e));
                          cipherResp=null;
                      }
                  }

                  // Some backend revisions expose the cipher as GET on the deviceNumber route.
                  if (cipherResp == null) {
                      try {
                          String ep = API + "/api/v2/devices/" + URLEncoder.encode(deviceNumber,"UTF-8")
                                  + "/cipher?pinCode=" + URLEncoder.encode(pin,"UTF-8");
                          cipherResp = parseJsonAny(http("GET", ep, null, null, null));
                      } catch(Exception e) {
                          last=e;
                          appendLog("PIN cipher GET failed: " + safeError(e));
                      }
                  }

                  if (cipherResp == null)
                      throw new Exception(last == null ? "PIN authorization failed." : safeError(last));

                  String keyHex = findString(cipherResp,"secretKey");
                  String infoHex = findString(cipherResp,"info");
                  if (keyHex.isEmpty() || infoHex.isEmpty())
                      throw new Exception("PIN accepted response did not include cipher secretKey/info.");

                  encryptionKey = unhex(keyHex);
                  cipherInfo = unhex(infoHex);
                  if (encryptionKey.length != 16 || cipherInfo.length != 16)
                      throw new Exception("Invalid cipher length key=" + encryptionKey.length + " info=" + cipherInfo.length);

                  Integer uid = findInt(cipherResp,"userId");
                  // TerraConfig secure response may return a userId. If it does not, 0 is used
                  // as the installer/session identifier and the charger decides acceptance.
                  userId = uid == null ? 0 : uid;

                  String fw = findString(cipherResp,"softVersion");
                  if (fw.isEmpty()) fw = findString(cipherResp,"firmwareVersion");
                  if (!fw.isEmpty()) firmwareVersion = normalizeFw(fw);

                  String manualFw = fwInput.getText().toString().trim();
                  if (!manualFw.isEmpty()) firmwareVersion = normalizeFw(manualFw);

                  if (firmwareVersion.isEmpty())
                      throw new Exception("Firmware version belum diketahui. Isi firmware charger pada field Firmware.");

                  appendLog("PIN-only secure material ready. firmware=" + firmwareVersion);
              }

              private void startHandshake1() {
                  try {
                      sessionToken = new byte[8];
                      clientNonce = new byte[16];
                      rng.nextBytes(clientNonce);
                      progress("Charger authentication", false, "Handshake 1/3...");
                      byte[] payload = concat(new byte[]{1}, clientNonce);
                      sendEncrypted(CMD_AUTH,payload,p -> {
                          try {
                              if (p.code != 0) throw new Exception("Handshake 1 response code=" + p.code);
                              byte[] x = p.payload;
                              if (x == null || x.length < 34) throw new Exception("Handshake 1 payload too short");
                              int idx = x[0] & 0xff;
                              int result = x[1] & 0xff;
                              if (idx != 1) throw new Exception("Unexpected handshake index=" + idx);
                              byte[] echoed = Arrays.copyOfRange(x,2,18);
                              byte[] serverNonce = Arrays.copyOfRange(x,18,34);
                              if (!Arrays.equals(echoed,clientNonce)) throw new Exception("Client nonce mismatch");
                              if (isAllZero(serverNonce)) throw new Exception("Server nonce missing");
                              appendLog("Handshake 1 OK result=" + result);
                              startHandshake2(serverNonce);
                          } catch(Exception e) { authFailed("Handshake 1 failed",e); }
                      });
                  } catch(Exception e) { authFailed("Handshake 1 start failed",e); }
              }

              private void startHandshake2(byte[] serverNonce) {
                  progress("Charger authentication", false, "Handshake 2/3...");
                  sendEncrypted(CMD_AUTH,concat(new byte[]{2},serverNonce),p -> {
                      try {
                          if (p.code != 0) throw new Exception("Handshake 2 response code=" + p.code);
                          byte[] x = p.payload;
                          if (x == null || x.length < 10) throw new Exception("Handshake 2 payload too short");
                          int idx=x[0]&0xff, result=x[1]&0xff;
                          if (idx != 2 || result != 1) throw new Exception("Handshake 2 rejected idx="+idx+" result="+result);
                          sessionToken = Arrays.copyOfRange(x,2,10);
                          if (isAllZero(sessionToken)) throw new Exception("Session token missing");
                          appendLog("Handshake 2 OK; session token received.");
                          startHandshake3();
                      } catch(Exception e) { authFailed("Handshake 2 failed",e); }
                  });
              }

              private void startHandshake3() throws Exception {
                  progress("Charger authentication", false, "Handshake 3/3...");
                  byte[] block = new byte[48];
                  byte[] dn = deviceNumber.replace("-","").getBytes(StandardCharsets.UTF_8);
                  System.arraycopy(dn,0,block,0,Math.min(20,dn.length));
                  block[20]=2;
                  block[21]=1;
                  byte[] uid = String.valueOf(userId).getBytes(StandardCharsets.UTF_8);
                  System.arraycopy(uid,0,block,22,Math.min(15,uid.length));

                  sendEncrypted(CMD_AUTH,concat(new byte[]{3},block),p -> {
                      if (p.code != 0) { authFailed("Handshake 3 rejected",new Exception("code="+p.code)); return; }
                      appendLog("Handshake 3 response received.");
                      main.postDelayed(this::querySysInfoAfterAuth,150);
                  });
              }

              private void querySysInfoAfterAuth() {
                  sendEncrypted(CMD_SYSINFO,new byte[0],p -> {
                      if (p.code != 0) {
                          authFailed("Authentication verification failed",new Exception("B1 code="+p.code));
                          return;
                      }
                      authenticated = true;
                      progress("Charger authentication", true, "Authenticated / session ready");
                      progress("Secure session", true, "AES-GCM active");
                      setStatus("CHARGER AUTHENTICATED", deviceNumber + " • secure BLE ready");
                      appendLog("AUTH SUCCESS. Charger should acknowledge the application session (beep depends on firmware).");
                      updateButtons();
                  });
              }

              private void authFailed(String title, Exception e) {
                  authenticated=false;
                  progress("Charger authentication",false,safeError(e));
                  failStatus(title,safeError(e));
                  updateButtons();
                  runOnUiThread(() -> authBtn.setEnabled(true));
              }

              private void configureCharger() {
                  if (!authenticated) { toast("Authenticate charger first."); return; }

                  String cid = chargePointId.getText().toString().trim();
                  String surl = serverUrl.getText().toString().trim();
                  String key = authKey.getText().toString();
                  if (cid.isEmpty()) { toast("Charger ID is required."); return; }
                  if (cid.length() > 64) { toast("Charger ID too long."); return; }
                  if (!(surl.startsWith("ws://") || surl.startsWith("wss://"))) {
                      toast("OCPP URL must start with ws:// or wss://"); return;
                  }
                  if (requiresPassword.isChecked() && key.isEmpty()) {
                      toast("AuthKey/password is required."); return;
                  }

                  try {
                      byte[] payload = buildOcppPayload(surl,cid,requiresPassword.isChecked()?key:"");
                      progress("OCPP configuration",false,"Writing secure configuration...");
                      progress("Verification",false,"Waiting");
                      saveBtn.setEnabled(false);
                      appendLog("Writing OCPP: id=" + cid + " url=" + surl + " auth=" + (key.isEmpty()?"off":"on"));

                      sendEncrypted(CMD_OCPP,payload,p -> {
                          try {
                              if (p.code != 0) throw new Exception("OCPP command response code="+p.code);
                              int result = p.payload != null && p.payload.length > 0 ? (p.payload[0]&0xff) : 1;
                              if (result == 0) throw new Exception("Charger reported configuration failure");
                              if (result == 2) throw new Exception("Charger reported security identity failure");
                              progress("OCPP configuration",true,"Configuration accepted");
                              setStatus("CONFIGURATION SAVED","Verifying charger response...");
                              appendLog("OCPP D6 accepted result=" + result);
                              main.postDelayed(this::verifyOcppStatus,700);
                          } catch(Exception e) {
                              progress("OCPP configuration",false,safeError(e));
                              failStatus("Configuration failed",safeError(e));
                              updateButtons();
                          }
                      });
                  } catch(Exception e) { failStatus("Invalid OCPP configuration",safeError(e)); }
              }

              private byte[] buildOcppPayload(String fullUrl,String chargerId,String password) throws Exception {
                  Uri uri = Uri.parse(fullUrl);
                  String scheme = uri.getScheme();
                  if (scheme == null) throw new Exception("Invalid URL");
                  boolean tls = "wss".equalsIgnoreCase(scheme);
                  int port = uri.getPort();
                  if (port <= 0) port = tls ? 443 : 80;

                  // Terra protocol separates domain URL and port. Keep scheme, host and path; remove :port.
                  String host = uri.getHost();
                  if (host == null || host.isEmpty()) throw new Exception("URL host missing");
                  StringBuilder domain = new StringBuilder();
                  domain.append(scheme.toLowerCase(Locale.US)).append("://").append(host);
                  String path = uri.getEncodedPath();
                  if (path != null && !path.isEmpty()) domain.append(path);
                  if (uri.getEncodedQuery()!=null && !uri.getEncodedQuery().isEmpty())
                      domain.append("?").append(uri.getEncodedQuery());

                  byte[] d = domain.toString().getBytes(StandardCharsets.UTF_8);
                  byte[] sk = password.getBytes(StandardCharsets.UTF_8);
                  byte[] tag = chargerId.getBytes(StandardCharsets.UTF_8);
                  if (d.length > 255 || sk.length > 255 || tag.length > 255) throw new Exception("Field exceeds protocol length");

                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  o.write(1);                         // serverEnable
                  o.write(d.length);
                  o.write(d);
                  o.write(leShort(port));
                  o.write(1);                         // protocolType = OCPP
                  byte[] pv = new byte[10];
                  byte[] pvb = "ocpp1.6j".getBytes(StandardCharsets.UTF_8);
                  System.arraycopy(pvb,0,pv,0,Math.min(10,pvb.length));
                  o.write(pv);
                  o.write(sk.length);
                  if (sk.length>0) o.write(sk);
                  o.write(tls ? 1 : 0);
                  if (tls) {
                      o.write(0);                     // certificateNo
                      o.write(leInt(0));              // certificateSize
                      o.write(leShort(512));          // downloadBytes
                  }
                  o.write(tag.length);                // Charge Point Identity / tag
                  o.write(tag);
                  return o.toByteArray();
              }

              private void verifyOcppStatus() {
                  if (!authenticated) { progress("Verification",false,"Session disconnected"); updateButtons(); return; }
                  sendEncrypted(CMD_OCPP_STATUS,new byte[0],p -> {
                      if (p.code == 0) {
                          progress("Verification",true,"Charger responded after save");
                          setStatus("COMMISSIONING COMPLETE",
                                  "Configuration written. Watch OCPP server for ChargeBoxId: " + chargePointId.getText().toString().trim());
                          appendLog("VERIFY D8 OK payload=" + hex(p.payload));
                      } else {
                          progress("Verification",false,"D8 response code " + p.code);
                          setStatus("Saved; reconnect may be in progress",
                                  "Check OCPP server for new ChargeBoxId.");
                      }
                      updateButtons();
                  });
              }

              private void verify() {
                  if (!authenticated) { toast("Authenticate charger first."); return; }
                  querySysInfoAfterAuth();
              }

              private void sendEncrypted(int cmd, byte[] payload, PacketCallback cb) {
                  try {
                      if (!transportReady || tx == null) throw new Exception("BLE transport not ready");
                      if (encryptionKey == null || cipherInfo == null) throw new Exception("Secure cipher not loaded");
                      byte[] packet = encryptedWrap(cmd,payload);
                      waitingCmd = cmd;
                      waitingCallback = cb;
                      appendLog("TX cmd=0x" + Integer.toHexString(cmd).toUpperCase(Locale.US)
                              + " bytes=" + packet.length);
                      queuePacket(packet);
                  } catch(Exception e) {
                      Packet p = new Packet(); p.cmd=cmd; p.code=-1; p.error=safeError(e);
                      if (cb!=null) cb.onPacket(p);
                  }
              }

              private byte[] encryptedWrap(int cmd, byte[] payload) throws Exception {
                  byte[] token = sessionToken == null ? new byte[8] : sessionToken;
                  byte[] plain = concat(token,payload==null?new byte[0]:payload);
                  byte[] iv = new byte[12]; rng.nextBytes(iv);
                  byte[] aad = buildAad();

                  Cipher c = Cipher.getInstance("AES/GCM/NoPadding");
                  c.init(Cipher.ENCRYPT_MODE,new SecretKeySpec(encryptionKey,"AES"),new GCMParameterSpec(128,iv));
                  c.updateAAD(aad);
                  byte[] encrypted = c.doFinal(plain);
                  int clen = encrypted.length - 16;
                  byte[] ciphertext = Arrays.copyOfRange(encrypted,0,clen);
                  byte[] tag = Arrays.copyOfRange(encrypted,clen,encrypted.length);

                  ByteArrayOutputStream body = new ByteArrayOutputStream();
                  body.write(ciphertext);
                  if (cmd != CMD_AUTH) body.write(aad);
                  body.write(iv);
                  body.write(tag);
                  if (cmd != CMD_AUTH) body.write(cipherInfo);
                  byte[] b = body.toByteArray();

                  ByteArrayOutputStream h = new ByteArrayOutputStream();
                  h.write((cmd==0xBA || cmd==0xD9) ? 0xAA : 0xFE);
                  h.write(cmd);
                  h.write(0);
                  h.write(0);
                  h.write(leShort(b.length));
                  h.write(0xA5);
                  byte[] pre = h.toByteArray();
                  int chk=0;
                  for(byte x:pre) chk ^= x & 0xff;
                  for(byte x:b) chk ^= x & 0xff;
                  h.write(chk & 0xff);
                  h.write(b);
                  return h.toByteArray();
              }

              private byte[] buildAad() throws Exception {
                  byte[] aad = new byte[22];
                  byte[] dn = deviceNumber.getBytes(StandardCharsets.UTF_8);
                  System.arraycopy(dn,0,aad,0,Math.min(20,dn.length));
                  String clean = firmwareVersion.replace(".","");
                  int fw;
                  try { fw = Integer.parseInt(clean); }
                  catch(Exception e) { throw new Exception("Invalid firmware version: " + firmwareVersion); }
                  byte[] f = leShort(fw);
                  aad[20]=f[0]; aad[21]=f[1];
                  return aad;
              }

              private Packet parsePacket(byte[] raw) {
                  Packet p = new Packet();
                  try {
                      if (raw.length < 8) throw new Exception("packet too short");
                      p.cmd = raw[1]&0xff;
                      p.code = raw[2]&0xff;
                      int len = (raw[4]&0xff) | ((raw[5]&0xff)<<8);
                      if (raw.length < 8+len) throw new Exception("incomplete packet");
                      p.body = Arrays.copyOfRange(raw,8,8+len);

                      int chk=0;
                      for(int i=0;i<7;i++) chk ^= raw[i]&0xff;
                      for(byte x:p.body) chk ^= x&0xff;
                      if ((raw[7]&0xff)!=(chk&0xff)) throw new Exception("checksum mismatch");

                      if (p.code != 0) {
                          p.payload = p.body;
                          return p;
                      }

                      if (encryptionKey != null) {
                          byte[] aad = buildAad();
                          int extra = p.cmd==CMD_AUTH ? 28 : 66;
                          int clen = p.body.length-extra;
                          if (clen < 0) throw new Exception("encrypted body length invalid");

                          byte[] ciphertext = Arrays.copyOfRange(p.body,0,clen);
                          int pos=clen;
                          if (p.cmd!=CMD_AUTH) {
                              byte[] receivedAad=Arrays.copyOfRange(p.body,pos,pos+22);
                              pos+=22;
                              if (!Arrays.equals(receivedAad,aad)) appendLog("WARN response AAD differs.");
                          }
                          byte[] iv=Arrays.copyOfRange(p.body,pos,pos+12); pos+=12;
                          byte[] tag=Arrays.copyOfRange(p.body,pos,pos+16); pos+=16;
                          // trailing 16 bytes are cipher info for non-auth responses

                          Cipher c=Cipher.getInstance("AES/GCM/NoPadding");
                          c.init(Cipher.DECRYPT_MODE,new SecretKeySpec(encryptionKey,"AES"),new GCMParameterSpec(128,iv));
                          c.updateAAD(aad);
                          byte[] plain=c.doFinal(concat(ciphertext,tag));
                          if (plain.length<8) throw new Exception("decrypted packet shorter than token");
                          p.token=Arrays.copyOfRange(plain,0,8);
                          p.payload=Arrays.copyOfRange(plain,8,plain.length);
                      } else p.payload=p.body;
                  } catch(Exception e) { p.error=safeError(e); p.code=-1; }
                  return p;
              }

              private void onRx(byte[] part) {
                  if (part == null || part.length==0) return;
                  try {
                      rxBuffer.write(part);
                      byte[] all=rxBuffer.toByteArray();
                      while(all.length>=8) {
                          int start=0;
                          while(start<all.length && (all[start]&0xff)!=0xFE && (all[start]&0xff)!=0xAA) start++;
                          if(start>0) all=Arrays.copyOfRange(all,start,all.length);
                          if(all.length<8) break;
                          int len=(all[4]&0xff)|((all[5]&0xff)<<8);
                          int total=8+len;
                          if(all.length<total) break;
                          byte[] packet=Arrays.copyOfRange(all,0,total);
                          all=Arrays.copyOfRange(all,total,all.length);
                          Packet p=parsePacket(packet);
                          appendLog("RX cmd=0x"+Integer.toHexString(p.cmd).toUpperCase(Locale.US)
                                  +" code="+p.code+" payload="+hex(p.payload)
                                  +(p.error==null?"":" error="+p.error));
                          if(waitingCallback!=null && waitingCmd==p.cmd) {
                              PacketCallback cb=waitingCallback;
                              waitingCallback=null; waitingCmd=-1;
                              cb.onPacket(p);
                          }
                      }
                      rxBuffer.reset();
                      rxBuffer.write(all);
                  } catch(Exception e) { appendLog("RX error: "+safeError(e)); }
              }

              private void queuePacket(byte[] packet) {
                  txChunks.clear();
                  int chunk = Math.max(20,Math.min(180,mtu-3));
                  for(int i=0;i<packet.length;i+=chunk)
                      txChunks.add(Arrays.copyOfRange(packet,i,Math.min(packet.length,i+chunk)));
                  txBusy=false;
                  sendNextChunk();
              }

              private void sendNextChunk() {
                  if(txBusy || txChunks.isEmpty() || gatt==null || tx==null) return;
                  byte[] b=txChunks.poll();
                  txBusy=true;
                  try {
                      if(Build.VERSION.SDK_INT>=33) {
                          int r=gatt.writeCharacteristic(tx,b,BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT);
                          if(r!=BluetoothStatusCodes.SUCCESS) {
                              txBusy=false; failStatus("BLE write error","status="+r); return;
                          }
                      } else {
                          tx.setWriteType(BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT);
                          tx.setValue(b);
                          if(!gatt.writeCharacteristic(tx)) {
                              txBusy=false; failStatus("BLE write rejected",""); return;
                          }
                      }
                  } catch(Exception e) { txBusy=false; failStatus("BLE write exception",safeError(e)); }
              }

              private String http(String method,String endpoint,String contentType,String body,String bearer) throws Exception {
                  HttpURLConnection c=(HttpURLConnection)new URL(endpoint).openConnection();
                  c.setConnectTimeout(15000); c.setReadTimeout(20000);
                  c.setRequestMethod(method);
                  c.setRequestProperty("Accept","application/json");
                  c.setRequestProperty("X-APP-VERSION","3.5.0");
                  if(bearer!=null && !bearer.isEmpty()) c.setRequestProperty("Authorization","Bearer "+bearer);
                  if(body!=null) {
                      c.setDoOutput(true);
                      c.setRequestProperty("Content-Type",contentType==null?"application/json":contentType);
                      try(OutputStream os=c.getOutputStream()) { os.write(body.getBytes(StandardCharsets.UTF_8)); }
                  }
                  int code=c.getResponseCode();
                  InputStream in=code>=200&&code<300?c.getInputStream():c.getErrorStream();
                  String text=readAll(in);
                  if(code<200||code>=300) throw new Exception("HTTP "+code+" "+compact(text));
                  return text;
              }

              private static Object parseJsonAny(String s) throws Exception {
                  String x=s.trim();
                  if(x.startsWith("[")) return new JSONArray(x);
                  return new JSONObject(x);
              }

              private static String findString(Object obj,String key) {
                  if(obj==null) return "";
                  try {
                      if(obj instanceof JSONObject) {
                          JSONObject j=(JSONObject)obj;
                          if(j.has(key) && !j.isNull(key)) return String.valueOf(j.get(key));
                          Iterator<String> it=j.keys();
                          while(it.hasNext()) {
                              Object v=j.opt(it.next());
                              String r=findString(v,key); if(!r.isEmpty()) return r;
                          }
                      } else if(obj instanceof JSONArray) {
                          JSONArray a=(JSONArray)obj;
                          for(int i=0;i<a.length();i++){String r=findString(a.opt(i),key);if(!r.isEmpty())return r;}
                      }
                  } catch(Exception ignored){}
                  return "";
              }

              private static Integer findInt(Object obj,String key) {
                  String s=findString(obj,key);
                  try { return s.isEmpty()?null:Integer.parseInt(s); } catch(Exception e){ return null; }
              }

              private static JSONObject findObjectByDeviceNumber(Object obj,String dn) {
                  if(obj instanceof JSONObject) {
                      JSONObject j=(JSONObject)obj;
                      if(dn.equals(j.optString("deviceNumber",""))) return j;
                      Iterator<String> it=j.keys();
                      while(it.hasNext()) {
                          JSONObject r=findObjectByDeviceNumber(j.opt(it.next()),dn); if(r!=null)return r;
                      }
                  } else if(obj instanceof JSONArray) {
                      JSONArray a=(JSONArray)obj;
                      for(int i=0;i<a.length();i++){JSONObject r=findObjectByDeviceNumber(a.opt(i),dn);if(r!=null)return r;}
                  }
                  return null;
              }

              private static String readAll(InputStream in) throws Exception {
                  if(in==null)return "";
                  ByteArrayOutputStream b=new ByteArrayOutputStream();
                  byte[] buf=new byte[4096]; int n;
                  while((n=in.read(buf))!=-1)b.write(buf,0,n);
                  return b.toString("UTF-8");
              }

              private static String compact(String x) {
                  if(x==null)return "";
                  x=x.replace("\n"," ").replace("\r"," ");
                  return x.length()>220?x.substring(0,220):x;
              }

              private static String enc(String s) throws Exception { return URLEncoder.encode(s,"UTF-8"); }

              private void progress(String name,boolean ok,String detail) {
                  runOnUiThread(() -> {
                      TextView found=null;
                      for(int i=0;i<progressBox.getChildCount();i++) {
                          View v=progressBox.getChildAt(i);
                          if(v.getTag()!=null && v.getTag().equals(name)){found=(TextView)v;break;}
                      }
                      String mark=ok?"✓":"○";
                      String s=mark+"  "+name+"   "+detail;
                      if(found==null) {
                          found=text(s,13,true,ok?Color.rgb(42,213,196):Color.rgb(151,171,188));
                          found.setTag(name); found.setPadding(0,dp(4),0,dp(4)); progressBox.addView(found);
                      } else {
                          found.setText(s); found.setTextColor(ok?Color.rgb(42,213,196):Color.rgb(151,171,188));
                      }
                  });
              }

              private void setStatus(String a,String b) {
                  runOnUiThread(() -> { statusTitle.setText(a); statusDetail.setText(b==null?"":b); });
              }
              private void failStatus(String a,String b) {
                  appendLog("ERROR "+a+" :: "+b);
                  setStatus(a,b);
              }

              private void updateButtons() {
                  runOnUiThread(() -> {
                      disconnectBtn.setEnabled(gatt!=null);
                      authBtn.setEnabled(transportReady && !authenticated);
                      saveBtn.setEnabled(authenticated);
                      verifyBtn.setEnabled(authenticated);
                  });
              }

              private void disconnect() {
                  stopScan();
                  BluetoothGatt gg=gatt; gatt=null;
                  transportReady=false; authenticated=false;
                  tx=null;rx=null; waitingCmd=-1;waitingCallback=null;
                  txChunks.clear(); rxBuffer.reset();
                  if(gg!=null){try{gg.disconnect();}catch(Exception ignored){} try{gg.close();}catch(Exception ignored){}}
                  updateButtons();
              }

              private void requestPerms() {
                  if(Build.VERSION.SDK_INT>=31)
                      requestPermissions(new String[]{Manifest.permission.BLUETOOTH_SCAN,Manifest.permission.BLUETOOTH_CONNECT},REQ_PERMS);
                  else if(Build.VERSION.SDK_INT>=23)
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION},REQ_PERMS);
              }

              private boolean permOk() {
                  if(Build.VERSION.SDK_INT>=31)
                      return checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN)==PackageManager.PERMISSION_GRANTED
                              && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)==PackageManager.PERMISSION_GRANTED;
                  return Build.VERSION.SDK_INT<23 || checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)==PackageManager.PERMISSION_GRANTED;
              }

              private String safeName(BluetoothDevice d){try{return d==null?null:d.getName();}catch(Exception e){return null;}}
              private String safeAddress(BluetoothDevice d){try{return d==null?null:d.getAddress();}catch(Exception e){return null;}}

              private void copyLog() {
                  ClipboardManager cm=(ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("ABB Terra Direct debug",logText.getText()));
                  toast("Debug log copied.");
