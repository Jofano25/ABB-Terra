                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(20),dp(48),dp(20),dp(30));
                  sv.addView(root,new ScrollView.LayoutParams(-1,-1));

                  ImageView loginLogo = brandLogo(dp(112));
                  root.addView(loginLogo,new LinearLayout.LayoutParams(dp(112),dp(112)));

                  TextView title=text("EMOS",30,true,WHITE);
                  title.setPadding(0,dp(8),0,0);
                  root.addView(title);

                  TextView sub=text("CONNECT • CONFIGURE • CHARGE",12,true,ACCENT);
                  sub.setLetterSpacing(.08f);
                  sub.setPadding(0,0,0,dp(26));
                  root.addView(sub);

                  LinearLayout loginCard=card(CARD);
                  loginCard.addView(section("SECURE AUTHORIZATION",ACCENT));

                  TextView info=text(
                          "Login diperlukan untuk mendapatkan authorization/cipher resmi ABB. "
                          +"Password hanya dipakai saat login dan tidak disimpan. Session login berlaku hanya selama aplikasi ini terbuka. "
                          +"Setelah aplikasi ditutup, login diperlukan kembali.",
                          12,false,MUTED);
                  info.setPadding(0,0,0,dp(12));
                  loginCard.addView(info);

                  adminEmail=input("TerraConfig / ABB installer email",WHITE,MUTED);
                  adminPassword=input("Password",WHITE,MUTED);
                  adminPassword.setInputType(InputType.TYPE_CLASS_TEXT|InputType.TYPE_TEXT_VARIATION_PASSWORD);

                  loginCard.addView(labeled("Installer Email",adminEmail,MUTED));
                  loginCard.addView(labeled("Password",adminPassword,MUTED));

                  adminStatus=text("Not authorized",12,false,MUTED);
                  adminStatus.setPadding(0,dp(8),0,dp(8));
                  loginCard.addView(adminStatus);

                  adminLogin=button("LOGIN & AUTHORIZE",ACCENT,Color.rgb(4,35,38));
                  loginCard.addView(adminLogin,new LinearLayout.LayoutParams(-1,dp(56)));
                  adminLogin.setOnClickListener(v -> authorizeAdmin());

                  root.addView(loginCard,cardLp());

                  TextView footer=text(
