              private void authorizeAdmin() {
                  if (adminLoginInProgress) return;

                  String email = adminEmail.getText().toString().trim();
                  String password = adminPassword.getText().toString();
                  if (email.isEmpty() || password.isEmpty()) {
                      toast("Email and password are required for one-time authorization.");
                      return;
                  }

                  adminLoginInProgress=true;
                  adminLogin.setEnabled(false);
                  adminLogin.setText("LOGGING IN...");
                  adminEmail.setEnabled(false);
                  adminPassword.setEnabled(false);
                  if (adminLoginProgress!=null) adminLoginProgress.setVisibility(View.VISIBLE);
                  adminStatus.setText("Authorizing... please wait");

                  new Thread(() -> {
                      boolean success=false;
                      try {
                          JSONObject token = oauthPasswordLogin(email,password);
                          saveAuthorization(token,email);
                          ensureUserId();
                          success=true;
                          runOnUiThread(() -> {
                              adminPassword.setText("");
                              appSessionAuthorized=true;
                              buildUi();
                              appendLog("EMOS 5.4 started");
                              appendLog("LOGIN SUCCESS. Authorization is valid for this app session only; password not stored.");
                              progress("Authorization",true,"Saved authorization ready");
                              toast("Login berhasil. Lanjut scan charger dan masukkan PIN.");
                          });
                      } catch(Exception e) {
                          appendLog("ADMIN AUTH ERROR: " + safeError(e));
                          runOnUiThread(() -> adminStatus.setText("Authorization failed: " + safeError(e)));
                      } finally {
                          final boolean loginSuccess=success;
                          runOnUiThread(() -> {
                              adminLoginInProgress=false;
                              if (!loginSuccess) {
                                  if (adminLoginProgress!=null) adminLoginProgress.setVisibility(View.GONE);
                                  if (adminLogin!=null) {
                                      adminLogin.setEnabled(true);
                                      adminLogin.setText("LOGIN & AUTHORIZE");
                                  }
                                  if (adminEmail!=null) adminEmail.setEnabled(true);
                                  if (adminPassword!=null) adminPassword.setEnabled(true);
                              }
                          });
                      }
                  }).start();
              }

              private JSONObject oauthPasswordLogin(String email,String password) throws Exception {
                  String form = "grant_type=password"
                          + "&client_id=" + enc(CLIENT_ID)
                          + "&client_secret=" + enc(CLIENT_SECRET)
                          + "&username=" + enc(email)
                          + "&password=" + enc(password);
                  return new JSONObject(http("POST",API+"/api/oauth/token",
                          "application/x-www-form-urlencoded",form,null));
              }

              private void saveAuthorization(JSONObject token,String email) throws Exception {
                  String access = token.optString("access_token","");
                  String refresh = token.optString("refresh_token","");
                  long expires = token.optLong("expires_in",3600);
                  if (access.isEmpty()) throw new Exception("Server did not return access_token.");
                  if (refresh.isEmpty()) refresh = readSecure("refresh_token");

                  writeSecure("access_token",access);
                  writeSecure("refresh_token",refresh);
                  writeSecure("account_email",email);
                  prefs.edit().putLong("expires_at",System.currentTimeMillis()+Math.max(60,expires-60)*1000L).apply();
              }

              private String ensureAccessToken() throws Exception {
                  String token = readSecure("access_token");
                  long exp = prefs.getLong("expires_at",0);
                  if (!token.isEmpty() && System.currentTimeMillis() < exp) return token;
                  return refreshAccessToken();
              }

              private String refreshAccessToken() throws Exception {
                  String refresh = readSecure("refresh_token");
                  if (refresh.isEmpty()) throw new Exception("Admin authorization required.");

                  String form = "grant_type=refresh_token"
                          + "&client_id=" + enc(CLIENT_ID)
                          + "&client_secret=" + enc(CLIENT_SECRET)
                          + "&refresh_token=" + enc(refresh);
                  JSONObject token = new JSONObject(http("POST",API+"/api/oauth/token",
                          "application/x-www-form-urlencoded",form,null));
                  saveAuthorization(token,readSecure("account_email"));
                  return readSecure("access_token");
              }

              private String authorizedHttp(String method,String url,String contentType,String body) throws Exception {
                  String token = ensureAccessToken();
                  try {
                      return http(method,url,contentType,body,token);
                  } catch(HttpError e) {
                      if (e.code != 401) throw e;
                      token = refreshAccessToken();
                      return http(method,url,contentType,body,token);
                  }
              }

              private void ensureUserId() throws Exception {
                  int saved = prefs.getInt("user_id",0);
                  if (saved > 0) { userId=saved; return; }
                  Object me = parseJsonAny(authorizedHttp("GET",API+"/api/v2/users/me",null,null));
                  Integer id = findInt(me,"id");
                  if (id == null || id <= 0) throw new Exception("ABB user ID not found.");
                  userId=id;
                  prefs.edit().putInt("user_id",id).apply();
              }

              private boolean hasSavedAuthorization() {
                  return !readSecure("refresh_token").isEmpty() || !readSecure("access_token").isEmpty();
              }

              private void updateAdminState() {
                  boolean ok=hasSavedAuthorization();
                  String email=readSecure("account_email");
                  if (adminStatus!=null) {
                      adminStatus.setText(ok
                              ?"✓ Authorization saved"+(email.isEmpty()?"":" for "+email)+". Password is not stored."
                              :"Login is required.");
                  }
                  if (progressBox!=null)
                      progress("Authorization",ok,ok?"Saved token ready":"Login required");
              }

              private void clearAuthorizationTokensOnly() {
                  prefs.edit().remove("access_token").remove("refresh_token").remove("account_email")
                          .remove("expires_at").remove("user_id").apply();
                  userId=0;
              }

              private void clearAuthorization() {
                  clearAuthorizationTokensOnly();
                  appSessionAuthorized=false;
                  updateAdminState();
                  toast("EMOS login session cleared.");
              }

              private void authenticateCharger() {
                  if (authInProgress) {
                      appendLog("AUTH ignored: secure authentication already in progress.");
                      return;
                  }
                  if (authenticated) {
                      appendLog("AUTH ignored: secure session already authenticated.");
                      return;
                  }
                  if (!transportReady) { toast("Connect charger first."); return; }
                  String pin = chargerPin.getText().toString().trim();
                  if (pin.length() != 8) { toast("Charger PIN must be exactly 8 characters."); return; }
                  if (!hasSavedAuthorization()) {
                      toast("Installer login is required.");
                      showLoginScreen();
                      return;
                  }
                  if (firmwareVersion.isEmpty()) {
                      failStatus("Firmware not detected","Re-scan charger. Secure firmware version is read from BLE advertising data.");
                      return;
                  }

                  authInProgress=true;
                  authenticated=false;
                  encryptedMode=false;
                  sessionToken=new byte[8];
                  updateButtons();
                  progress("Secure session",false,"Requesting cipher with charger PIN...");
                  progress("Authentication",false,"Starting secure authentication...");
                  setStatus("Authenticating charger",deviceNumber+" • FW "+firmwareVersion);

                  new Thread(() -> {
                      try {
                          ensureUserId();
                          fetchCipherWithPin(pin);
                          runOnUiThread(() -> {
                              if (!authInProgress || authenticated) return;
                              progress("Authorization",true,"PIN authorized");
                              progress("Secure session",true,"Cipher loaded");
                              encryptedMode=true;
                              startHandshake1();
                          });
                      } catch(Exception e) {
                          authInProgress=false;
                          appendLog("PIN/CIPHER ERROR: " + safeError(e));
                          failStatus("PIN authorization failed",safeError(e));
                          updateButtons();
                      }
                  }).start();
              }

              private void fetchCipherWithPin(String pin) throws Exception {
                  JSONObject request = new JSONObject();
                  request.put("pinCode",pin);
                  request.put("deviceNumber",deviceNumber);

                  Object response = null;
                  Exception last = null;

                  try {
                      response = parseJsonAny(authorizedHttp("POST",API+"/api/v2/devices/refresh-ciphers",
                              "application/json",request.toString()));
                  } catch(Exception e) {
                      last=e;
                      appendLog("refresh-ciphers failed: "+safeError(e));
                  }

                  String keyHex = findString(response,"secretKey");
                  String infoHex = findString(response,"info");

                  if (keyHex.isEmpty() || infoHex.isEmpty()) {
                      try {
                          JSONObject body = new JSONObject();
                          body.put("pinCode",pin);
                          response = parseJsonAny(authorizedHttp("POST",
                                  API+"/api/v2/devices/"+URLEncoder.encode(deviceNumber,"UTF-8")+"/cipher",
                                  "application/json",body.toString()));
                          keyHex=findString(response,"secretKey");
                          infoHex=findString(response,"info");
                      } catch(Exception e) {
                          last=e;
                          appendLog("device cipher endpoint failed: "+safeError(e));
                      }
                  }

                  if (keyHex.isEmpty() || infoHex.isEmpty())
                      throw new Exception(last==null ? "Cipher not returned. Check charger PIN." : safeError(last));

                  encryptionKey=unhex(keyHex);
                  cipherInfo=unhex(infoHex);
                  if (encryptionKey.length!=16 || cipherInfo.length!=16)
                      throw new Exception("Invalid secure cipher size.");

                  Integer uid=findInt(response,"userId");
                  if (uid!=null && uid>0) {
                      userId=uid;
                      prefs.edit().putInt("user_id",uid).apply();
                  }
                  if (userId<=0) ensureUserId();

                  appendLog("PIN accepted; secure cipher received. Secret values are intentionally hidden.");
              }

              private void startHandshake1() {
                  try {
                      clientNonce=new byte[16];
                      rng.nextBytes(clientNonce);
                      sessionToken=new byte[8];

                      progress("Authentication",false,"Secure handshake 1/3");
                      appendLog("Handshake 1: encrypted 0xFE request");

                      sendEncrypted(CMD_AUTH,concat(new byte[]{1},clientNonce),p -> {
                          try {
                              requirePacketOk(p,"Handshake 1");
                              if (p.payload==null || p.payload.length<34)
                                  throw new Exception("Handshake 1 payload too short: "+(p.payload==null?0:p.payload.length));

                              int idx=p.payload[0]&0xff;
                              int result=p.payload[1]&0xff;
                              if (idx!=1) throw new Exception("Unexpected handshake index "+idx);
                              // Secure Terra firmware returns 0x00 for an accepted handshake step.
                              if (result!=0) throw new Exception("Handshake 1 rejected. result="+result);

                              byte[] echoed=Arrays.copyOfRange(p.payload,2,18);
                              byte[] serverNonce=Arrays.copyOfRange(p.payload,18,34);

                              if (!Arrays.equals(echoed,clientNonce))
                                  throw new Exception("Handshake 1 client nonce mismatch.");
                              if (isAllZero(serverNonce))
                                  throw new Exception("Handshake 1 server nonce missing.");

                              appendLog("Handshake 1 OK result="+result+"; client nonce verified; server nonce received.");
                              startHandshake2(serverNonce);
                          } catch(Exception e) { authFailed(e); }
                      });
                  } catch(Exception e) { authFailed(e); }
              }

              private void startHandshake2(byte[] serverNonce) {
                  progress("Authentication",false,"Secure handshake 2/3");
                  appendLog("Handshake 2: encrypted 0xFE request");

                  sendEncrypted(CMD_AUTH,concat(new byte[]{2},serverNonce),p -> {
                      try {
                          requirePacketOk(p,"Handshake 2");
                          if (p.payload==null || p.payload.length<2)
                              throw new Exception("Handshake 2 payload too short: "+(p.payload==null?0:p.payload.length));

                          int idx=p.payload[0]&0xff;
                          int result=p.payload[1]&0xff;
                          if (idx!=2 || result!=0)
                              throw new Exception("Handshake 2 rejected. idx="+idx+" result="+result);

                          if (p.token==null || p.token.length!=8 || isAllZero(p.token))
                              throw new Exception("Handshake 2 session token missing.");

                          sessionToken=Arrays.copyOf(p.token,8);
                          appendLog("Handshake 2 OK result="+result+"; session token received.");
                          startHandshake3();
                      } catch(Exception e) { authFailed(e); }
                  });
              }

              private void startHandshake3() throws Exception {
                  progress("Authentication",false,"Secure handshake 3/3");

                  byte[] block=new byte[48];
                  byte[] dn=deviceNumber.replace("-","").getBytes(StandardCharsets.UTF_8);
                  System.arraycopy(dn,0,block,0,Math.min(20,dn.length));
                  block[20]=2;
                  block[21]=1;

                  byte[] uid=String.valueOf(userId).getBytes(StandardCharsets.UTF_8);
                  System.arraycopy(uid,0,block,22,Math.min(15,uid.length));

                  appendLog("Handshake 3: encrypted 0xFE identity request");
                  sendEncrypted(CMD_AUTH,concat(new byte[]{3},block),p -> {
                      try {
                          requirePacketOk(p,"Handshake 3");
                          if (p.payload==null || p.payload.length<2)
                              throw new Exception("Handshake 3 payload too short.");

                          int idx=p.payload[0]&0xff;
                          int result=p.payload[1]&0xff;
                          if (idx!=3 || result!=0)
                              throw new Exception("Handshake 3 rejected. idx="+idx+" result="+result);

                          if (p.token!=null && p.token.length==8 && !isAllZero(p.token))
                              sessionToken=Arrays.copyOf(p.token,8);

                          appendLog("Handshake 3 OK result="+result+"; secure application session established.");
                          querySysInfo();
                      } catch(Exception e) { authFailed(e); }
                  });
              }

              private void querySysInfo() {
                  sendEncrypted(CMD_SYSINFO,new byte[0],p -> {
                      try {
                          requirePacketOk(p,"System info");
                          appendLog("Encrypted system-info query OK.");
                          syncTime();
                      } catch(Exception e) { authFailed(e); }
                  });
              }

              private void syncTime() {
                  long now=System.currentTimeMillis()/1000L;
                  int offsetHours=TimeZone.getDefault().getOffset(System.currentTimeMillis())/(60*60*1000);
                  byte[] payload=new byte[5];
                  payload[0]=(byte)(now&0xff);
                  payload[1]=(byte)((now>>8)&0xff);
                  payload[2]=(byte)((now>>16)&0xff);
                  payload[3]=(byte)((now>>24)&0xff);
                  payload[4]=(byte)(offsetHours+12);

                  sendEncrypted(CMD_SYNC_TIME,payload,p -> {
                      try {
                          requirePacketOk(p,"Sync time");
                          authenticated=true;
                          authInProgress=false;
                          internetReady=false;
                          progress("Authentication",true,"Secure charger session active");
                          progress("Secure session",true,"AES-GCM active");
                          progress("Internet connection",false,"Ready to edit / apply");
                          progress("OCPP configuration",false,"Ready to edit / apply");
                          setOcppUiEnabled(true);
                          loadLocalProfile();
                          setStatus("CHARGER AUTHENTICATED",
                                  deviceNumber+" • secure session ready");
                          appendLog("AUTH SUCCESS. Secure BLE handshake + SYNC_TIME complete.");
                          updateButtons();

                          // Exactly one automatic READ ALL after a complete authentication.
                          main.postDelayed(() -> {
                              if (authenticated && !authInProgress && !readInProgress)
                                  readCurrentConfig();
                          },650);
                      } catch(Exception e) { authFailed(e); }
                  });
              }

              private void authFailed(Exception e) {
                  authInProgress=false;
                  authenticated=false;
                  encryptedMode=false;
                  progress("Authentication",false,safeError(e));
                  failStatus("Charger authentication failed",safeError(e));
                  updateButtons();
              }

              private byte[] buildWifiPayload(String ssid,String password) {
                  // TerraConfig RequestBodyFactory.configurationWifiNetworkRequestBody():
                  // 02 + SSID UTF-8 + 0A + PASSWORD UTF-8 + 03
                  return concat(
                          new byte[]{0x02},
                          ssid.getBytes(StandardCharsets.UTF_8),
                          new byte[]{0x0A},
                          password.getBytes(StandardCharsets.UTF_8),
                          new byte[]{0x03}
                  );
              }

              private int parseConfigDetail(byte[] payload) {
                  // D2 and D4 response payload:
                  // byte 0 = sub-code
                  // byte 1..2 = little-endian detailDescCode
                  if (payload==null || payload.length<3) return 0;
                  return (payload[1]&0xff)|((payload[2]&0xff)<<8);
              }

              private byte[] buildDhcpPayload(int interfaceType) {
                  // Exact 18-byte layout returned by AA:
                  // [0] interface enum (DO NOT hardcode from assumptions)
                  // [1] IP mode 0=DHCP, 1=Static
                  // [2..17] IP/mask/gateway/DNS; zeros for DHCP.
                  // On TACW752826G1511 FW 2.1.0, AA while Wi-Fi is active returns 0x00,
                  // therefore Wi-Fi for AA/AB is interfaceType=0 on this firmware.
                  byte[] out=new byte[18];
                  out[0]=(byte)(interfaceType&0xff);
                  out[1]=0x00;
                  return out;
              }

              private void ensureDhcpBeforeNetworkWrite(int interfaceType,Runnable next) {
                  // AA is authoritative for the current TCP/IP mode. On the tested FW 2.1.0
                  // AA already returns mode=0 (DHCP). In that case do NOT rewrite AB; the old
                  // 4.1 parser incorrectly treated the short AB payload 00 01 as a rejection
                  // and stopped before D2, so the SSID was never sent at all.
                  if (lastAaIpMode==0) {
                      appendLog("AA already reports DHCP; AB write skipped. interface="+interfaceType);
                      progress("Internet connection",true,"DHCP already active");
                      if (next!=null) main.postDelayed(next,180);
                      return;
                  }

                  byte[] payload=buildDhcpPayload(interfaceType);
                  String name=(interfaceType==0?"Wi-Fi(FW2.1 enum=0)":"interface "+interfaceType);
                  appendLog("TX AB TCPIP interface="+name+" mode=DHCP payload="+hex(payload));
                  progress("Internet connection",false,"Requesting DHCP...");

                  sendEncrypted(CMD_CONFIGURE_TCPIP,payload,p -> {
                      try {
                          requirePacketOk(p,"Configure TCP/IP DHCP");
                          // IMPORTANT: the inner AB payload layout is not confirmed. A short
                          // response such as 00 01 is NOT interpreted as result=1. Transport
                          // response code 0 means the charger accepted the command frame.
                          appendLog("RX AB TCPIP payload="+hex(p.payload)
                                  +" (advisory; short inner payload is not treated as failure)");
                      } catch(Exception e) {
                          appendLog("AB DHCP warning: "+safeError(e)+"; continuing to network-mode/D2 write.");
                      }
                      if (next!=null) main.postDelayed(next,220);
                  });
              }

              private void changeNetworkModeForApply(int mode,Runnable next) {
                  // Kept only for diagnostics/other firmware. FW 2.1.0 on TACW752826G1511
                  // returned response code 20 (command does not exist), so normal apply does NOT call it.
                  // 0xD4 is catalogued as CHANGE_NET_MODE in other Chargedot/ABB variants.
                  // D3 on FW 2.1.0 reports mode=1 for Wi-Fi and mode=2 for Ethernet, so use
                  // that enum here. This is best-effort: the raw response is logged and a
                  // parser guess is never allowed to block D2.
                  byte[] payload=new byte[]{(byte)(mode&0xff)};
                  String name=mode==1?"Wi-Fi":mode==2?"Ethernet":"mode "+mode;
                  appendLog("TX D4 CHANGE_NET_MODE "+name+" payload="+hex(payload));
                  progress("Internet connection",false,"Selecting "+name+" network mode...");

                  sendEncrypted(CMD_CHANGE_NET_MODE,payload,p -> {
                      try {
                          requirePacketOk(p,"Change network mode");
                          appendLog("RX D4 CHANGE_NET_MODE payload="+hex(p.payload)
                                  +" (raw; continuing to credential write)");
                      } catch(Exception e) {
                          appendLog("D4 mode warning: "+safeError(e)+"; continuing to credential write.");
                      }
                      if (next!=null) main.postDelayed(next,300);
                  });
              }

              private void enableConnectionAuth(int mode,Runnable next) {
                  // CE_AUTH payload format is confirmed by this charger: [mode, 0x00].
                  // FW 2.1.0 accepted mode 6 for Wi-Fi in the 3.8 log.
                  byte[] payload=new byte[]{(byte)(mode&0xff),0x00};
                  String name=mode==NET_WIFI?"Wi-Fi":mode==NET_ETHERNET?"Ethernet":"mode "+mode;
                  appendLog("TX CE_AUTH "+name+" mode="+mode);
                  sendEncrypted(CMD_CE_AUTH,payload,p -> {
                      try {
                          requirePacketOk(p,"CE connection authorization");
                          int ceCode=(p.payload!=null && p.payload.length>0)?(p.payload[0]&0xff):0;
                          appendLog("RX CE_AUTH payload="+hex(p.payload)+" ceCode="+ceCode);
                          if (ceCode!=0)
                              appendLog("CE_AUTH warning code="+ceCode+"; continuing with network write.");
                      } catch(Exception e) {
                          appendLog("CE_AUTH warning: "+safeError(e)+"; continuing with network write.");
                      }
                      if (next!=null) main.postDelayed(next,250);
                  });
              }

              private void queryNetworkStatus(int attempt) {
                  sendEncrypted(CMD_NETWORK_STATUS,new byte[0],p -> {
                      try {
                          requirePacketOk(p,"Network status");

                          if (p.payload==null || p.payload.length<4)
                              throw new Exception("Network status payload too short: "+hex(p.payload));

                          int networkResult=p.payload[0]&0xff;
                          int mode=p.payload[1]&0xff;
                          int detail=(p.payload[2]&0xff)|((p.payload[3]&0xff)<<8);
                          String detailText=networkDetailText(detail);

                          appendLog("RX D3 networkResult="+networkResult
                                  +" mode="+mode
                                  +" detail=0x"+String.format(Locale.US,"%04X",detail)
                                  +" ("+detailText+")");

                          boolean success=detail==0x0200;
                          boolean modeMatches=expectedNetworkMode==0 || mode==expectedNetworkMode;

                          if (success && modeMatches) {
                              internetReady=true;
                              String modeName=mode==NET_WIFI?"Wi-Fi":mode==NET_ETHERNET?"Ethernet":"mode "+mode;
                              progress("Internet connection",true,modeName+" ready");
                              connectionStatus.setText("✓ INTERNET READY • "+modeName);
                              connectionStatus.setTextColor(Color.rgb(44,220,199));
                              progress("OCPP configuration",false,"Ready for custom OCPP");
                              setOcppUiEnabled(true);
                              setStatus("INTERNET READY","Now enter OCPP URL, Charger ID and AuthKey.");
                              updateButtons();
                              return;
                          }

                          if (!success && !isHardNetworkError(detail) && attempt<11) {
                              connectionStatus.setText("Waiting for network... "+(attempt+1)+"/12 • "+detailText);
                              main.postDelayed(() -> queryNetworkStatus(attempt+1),2000);
                              return;
                          }

                          internetReady=false;
                          setOcppUiEnabled(false);
                          progress("Internet connection",false,detailText);
                          connectionStatus.setText("✕ "+detailText+" • mode="+mode);
                          connectionStatus.setTextColor(Color.rgb(255,160,160));
                          failStatus("Internet connection not ready",detailText);
                          updateButtons();

                      } catch(Exception e) {
                          if (attempt<11) {
                              main.postDelayed(() -> queryNetworkStatus(attempt+1),1800);
                          } else {
                              internetReady=false;
                              setOcppUiEnabled(false);
                              progress("Internet connection",false,safeError(e));
                              failStatus("Network status check failed",safeError(e));
                              updateButtons();
                          }
                      }
                  });
              }

              private boolean isHardNetworkError(int detail) {
                  return detail==0x1001 || detail==0x1002 || detail==0x1003
                          || detail==0x1005 || detail==0x1006
                          || detail==0x1401
                          || detail==0x5023;
              }

              private String networkDetailText(int detail) {
                  switch(detail) {
                      case 0x0200: return "Success / internet ready";
                      case 0x0400: return "Client/network problem";
                      case 0x0500: return "Server/internet problem";
                      case 0x1001: return "Wi-Fi module not found";
                      case 0x1002: return "Wi-Fi module not supported";
                      case 0x1003: return "Wi-Fi hardware switch could not be enabled";
                      case 0x1005: return "Invalid Wi-Fi SSID";
                      case 0x1006: return "Invalid Wi-Fi password";
                      case 0x1401: return "DHCP failed";
                      case 0x1502: return "IP setup status 0x1502 (verify DHCP/static with AA)";
                      case 0x5023: return "Unknown Wi-Fi error";
                      default: return "Network detail 0x"+String.format(Locale.US,"%04X",detail);
                  }
              }

              private void setOcppUiEnabled(boolean enabled) {
                  if (chargePointId!=null) chargePointId.setEnabled(enabled);
                  if (serverUrl!=null) serverUrl.setEnabled(enabled);
                  if (serverUrlSpinner!=null) serverUrlSpinner.setEnabled(enabled);
                  if (authKey!=null) authKey.setEnabled(enabled);
                  if (requiresPassword!=null) requiresPassword.setEnabled(enabled);
                  if (saveBtn!=null) saveBtn.setEnabled(enabled && authenticated);
                  if (ocppCard!=null) ocppCard.setAlpha(enabled?1.0f:0.48f);
              }

              private void applyAllChanges() {
                  if (!authenticated) {
                      toast("Authenticate charger first.");
                      return;
                  }

                  final String cp=chargePointId.getText().toString().trim();
                  final String url=serverUrl.getText().toString().trim();
                  final String key=authKey.getText().toString();
                  final int connectionPosition=connectionType.getSelectedItemPosition();
                  final String ssid=wifiSsid.getText().toString();
                  final String wifiPass=wifiPassword.getText().toString();

                  if (cp.isEmpty()) { toast("Charger ID is required."); return; }
                  if (!(url.startsWith("ws://") || url.startsWith("wss://"))) {
                      toast("OCPP URL must start with ws:// or wss://");
                      return;
                  }
                  if (requiresPassword.isChecked() && key.isEmpty()) {
                      toast("AuthKey is required.");
                      return;
                  }
                  if (requiresPassword.isChecked()) {
                      int authBytes=key.getBytes(StandardCharsets.UTF_8).length;
                      if (authBytes<10 || authBytes>20) {
                          String m="AuthKey compatibility range in EMOS is 10-20 UTF-8 bytes. Current plain length="+authBytes;
                          appendLog("BASIC AUTH PREFLIGHT BLOCKED: "+m);
                          failStatus("AUTHKEY INVALID",m);
                          toast(m);
                          return;
                      }
                      if (authBytes<16) {
                          appendLog("BASIC AUTH NOTE: AuthKey is "+authBytes+" bytes. ICON compatibility mode allows it, although 16+ bytes is the safer interoperability target.");
                      }
                  }
                  if (connectionPosition==0 && ssid.trim().isEmpty()) {
                      toast("Wi-Fi SSID is required.");
                      return;
                  }

                  if (connectionPosition==0) {
                      int passLen=wifiPass.length();
                      appendLog("WIFI PREFLIGHT ssid="+ssid+" passwordLength="+passLen);

                      // A secured WPA/WPA2 PSK network normally requires 8..63 characters
                      // (or exactly 64 hexadecimal characters). A 1..7 character value
                      // causes many APs/clients to reject association; do not let the charger
                      // reboot and silently roll back to its old SSID in that case.
                      if (passLen>0 && passLen<8) {
                          String m="Wi-Fi password is only "+passLen
                                  +" characters. For WPA/WPA2 PSK use 8-63 characters. "
                                  +"If the SSID is open, clear the password field.";
                          appendLog("WIFI PREFLIGHT BLOCKED: "+m);
                          failStatus("WI-FI PASSWORD INVALID",m);
                          toast(m);
                          return;
                      }
                      if (passLen>63 && !(passLen==64 && wifiPass.matches("[0-9A-Fa-f]{64}"))) {
                          String m="Wi-Fi password is too long. Use 8-63 characters or a 64-digit hex PSK.";
                          appendLog("WIFI PREFLIGHT BLOCKED: "+m);
                          failStatus("WI-FI PASSWORD INVALID",m);
                          toast(m);
                          return;
                      }
                  }

                  saveBtn.setEnabled(false);
                  lastOcppApplyOk=false;
                  lastOcppApplyMessage="Not applied";

                  // EMOS 5.2: restore the earlier working ABB path.
                  // The AuthKey entered by the user is written directly into D6 as PLAIN UTF-8
                  // bytes. Do not send HEX here and do not clear it with keyLen=0.
                  pendingGatewayBasicAuth=false;
                  pendingGatewayAuthKey="";
                  pendingGatewayClientId="";
                  gatewayAuthGeneration++;

                  final String d6Key=requiresPassword.isChecked()?key:"";
                  final int d6KeyBytes=d6Key.getBytes(StandardCharsets.UTF_8).length;
                  setStatus("APPLYING FINAL CONFIGURATION",
                          requiresPassword.isChecked()
                                  ?"Writing OCPP endpoint + plain AuthKey directly to ABB"
                                  :"Applying OCPP endpoint without Basic Auth");
                  progress("OCPP configuration",false,"Applying fixed D6 variant 2 with keyLen="+d6KeyBytes+"...");
                  appendLog("APPLY ALL AUTH-DIRECT v5.2: D6 variant=2; AuthKey="
                          +(d6Key.isEmpty()?"OFF":"ON")+" keyLen="+d6KeyBytes
                          +"; value is plain UTF-8 and secret is not logged.");

                  tryOcppVariant(url,cp,d6Key,
                          connectionPosition,ssid,wifiPass,0);
              }

              private void tryOcppVariant(String url,String cp,String key,
                      int connectionPosition,String ssid,String wifiPass,int attempt) {
                  // FINAL FW 2.1.0: only variant 2 is allowed. Logs proved variants 0/1 can
                  // be accepted transiently and then make the charger fall back to ABB Cloud.
                  final int[] order=new int[]{2};
                  if (attempt>=order.length) {
                      lastOcppApplyOk=false;
                      lastOcppApplyMessage="Fixed D6 variant 2 rejected";
                      progress("OCPP configuration",false,lastOcppApplyMessage);
                      appendLog("OCPP D6 FINAL: variant 2 rejected. No fallback variants will be sent, so the existing endpoint is not overwritten by an unsafe layout. Network configuration will continue.");
                      continueWithNetwork(connectionPosition,ssid,wifiPass);
                      return;
                  }

                  final int variant=order[attempt];
                  try {
                      byte[] payload=buildOcppPayload(url,cp,key,variant);
                      appendLog("TX OCPP D6 variant="+variant+" attempt="+(attempt+1)+"/"+order.length
                              +" id="+cp+" url="+url+" auth="+(key.isEmpty()?"off":"on"));

                      sendEncrypted(CMD_OCPP,payload,p -> {
                          try {
                              requirePacketOk(p,"OCPP configure variant "+variant);
                              if (p.payload==null || p.payload.length<1)
                                  throw new Exception("D6 response payload is empty.");

                              int result=p.payload[0]&0xff;
                              int fault=p.payload.length>1?(p.payload[1]&0xff):-1;
                              appendLog("RX OCPP D6 variant="+variant+" result="+result
                                      +" faultCause="+(fault<0?"n/a":String.valueOf(fault))
                                      +" payload="+hex(p.payload));

                              if (result==1) {
                                  lastOcppApplyOk=true;
                                  boolean carriesTag=(variant==0 || variant==2);
                                  lastOcppApplyMessage="Accepted variant "+variant
                                          +(carriesTag?" (with Charger ID tag)":"");
                                  progress("OCPP configuration",true,lastOcppApplyMessage);
                                  appendLog("OCPP D6 accepted using variant="+variant+".");
                                  pendingDesiredOcppUrl=url;
                                  saveLocalProfile();
                                  configureHttpBasicAuthForApply(!key.isEmpty(),key,
                                          connectionPosition,ssid,wifiPass);
                                  return;
                              }

                              appendLog("OCPP variant "+variant+" rejected; trying next layout.");
                              main.postDelayed(() -> tryOcppVariant(url,cp,key,
                                      connectionPosition,ssid,wifiPass,attempt+1),250);

                          } catch(Exception e) {
                              appendLog("OCPP variant "+variant+" warning: "+safeError(e));
                              main.postDelayed(() -> tryOcppVariant(url,cp,key,
                                      connectionPosition,ssid,wifiPass,attempt+1),250);
                          }
                      });
                  } catch(Exception e) {
                      appendLog("OCPP variant "+variant+" build warning: "+safeError(e));
                      tryOcppVariant(url,cp,key,connectionPosition,ssid,wifiPass,attempt+1);
                  }
              }

              private void continueWithNetwork(int connectionPosition,String ssid,String wifiPass) {
                  if (connectionPosition==0)
                      applyWifiLast(ssid,wifiPass);
                  else
                      applyEthernetLast();
              }

              private void configureHttpBasicAuthForApply(boolean enable,String key,
                      int connectionPosition,String ssid,String wifiPass) {
                  progress("OCPP Basic Auth",false,enable
                          ?"AuthKey written in D6; enabling HTTP Basic Auth..."
                          :"Basic Auth / AuthKey disabled");
                  appendLog("BASIC AUTH APPLY enable="+enable
                          +" authKeyBytes="+(enable?key.getBytes(StandardCharsets.UTF_8).length:0)
                          +" username="+chargePointId.getText().toString().trim());

                  if (enable) {
                      int rawLen=key.getBytes(StandardCharsets.UTF_8).length;
                      appendLog("BASIC AUTH METHOD v5.2: D6 carries PLAIN AuthKey bytes="+rawLen
                              +"; then best-effort C5 HTTPBasicAuthEnable=1. No gateway :3000 required.");
                      tryBasicAuthC5Variant(true,key,connectionPosition,ssid,wifiPass,0);
                  } else {
                      progress("OCPP Basic Auth",true,"Disabled");
                      continueWithNetwork(connectionPosition,ssid,wifiPass);
                  }
              }

              private void tryBasicAuthC5Variant(boolean enable,String key,
                      int connectionPosition,String ssid,String wifiPass,int attempt) {
                  final String[] names=new String[]{
                          "http_basic_auth_enable",
                          "HTTPBasicAuthEnable"
                  };

                  if (attempt>=names.length) {
                      appendLog("BASIC AUTH C5 write attempts complete. Final verification is the SteVe WebSocket handshake.");
                      progress("OCPP Basic Auth",true,enable?"Enable command sent":"Disable command sent");
                      continueWithNetwork(connectionPosition,ssid,wifiPass);
                      return;
                  }

                  final String configKey=names[attempt];
                  try {
                      JSONObject root=new JSONObject();
                      JSONArray arr=new JSONArray();
                      arr.put(51);
                      arr.put(enable?1:0);
                      root.put(configKey,arr);

                      byte[] json=root.toString().getBytes(StandardCharsets.UTF_8);
                      byte[] payload=concat(new byte[]{0x02},json);
                      appendLog("TX C5 BASIC_AUTH variant="+(attempt+1)
                              +" key="+configKey+" value="+(enable?1:0)
                              +" payloadLen="+payload.length);

                      sendEncrypted(CMD_READ_CONFIGURATION,payload,p -> {
                          try {
                              requirePacketOk(p,"C5 Basic Auth write "+configKey);
                              String ascii=printableUtf8(p.payload);
                              appendLog("RX C5 BASIC_AUTH key="+configKey
                                      +" payload="+hex(p.payload)
                                      +(ascii.isEmpty()?"":" text="+compact(ascii)));
                          } catch(Exception e) {
                              appendLog("C5 BASIC_AUTH variant "+(attempt+1)+" warning: "+safeError(e));
                          }

                          main.postDelayed(() -> tryBasicAuthC5Variant(enable,key,
                                  connectionPosition,ssid,wifiPass,attempt+1),220);
                      });
                  } catch(Exception e) {
                      appendLog("C5 BASIC_AUTH build warning variant="+(attempt+1)+": "+safeError(e));
                      main.postDelayed(() -> tryBasicAuthC5Variant(enable,key,
                              connectionPosition,ssid,wifiPass,attempt+1),220);
                  }
              }

              private void applyWifiLast(String ssid,String password) {
                  expectedNetworkMode=1; // D3 enum: 1=Wi-Fi on FW 2.1.0
                  pendingDesiredSsid=ssid;
                  wifiWritePending=true;
                  appendLog("WIFI APPLY target ssid="+ssid+" password=<hidden>");
                  progress("Internet connection",false,"Preparing Wi-Fi DHCP...");

                  // FW 2.1.0 READ AA already reports DHCP, so normally AB is skipped.
                  // FW 2.1.0 explicitly returned response-code 20 for D4 CHANGE_NET_MODE,
                  // therefore DO NOT send D4. CE_AUTH mode=6 is confirmed accepted by this
                  // charger and is used only to select/authorize Wi-Fi before D2.
                  int wifiAaType=(lastAaInterfaceType>=0)?lastAaInterfaceType:0;
                  appendLog("WIFI FLOW interfaceEnum="+wifiAaType
                          +" aaIpMode="+lastAaIpMode+" d3Mode=1(Wi-Fi)");
                  appendLog("D4 skipped: FW 2.1.0 reports command does not exist. Using CE_AUTH mode=6 before D2.");
                  ensureDhcpBeforeNetworkWrite(wifiAaType,() ->
                      enableConnectionAuth(NET_WIFI,() -> sendWifiCredentialsForApply(ssid,password)));
              }

              private void sendWifiCredentialsForApply(String ssid,String password) {
                  byte[] payload=buildWifiPayload(ssid,password);
                  progress("Internet connection",false,"Writing Wi-Fi SSID/password...");
                  connectionStatus.setText("Writing Wi-Fi "+ssid+" • DHCP. Charger may restart BLE/network.");
                  appendLog("TX WIFI D2 ssid="+ssid+" password=<hidden> payloadLen="+payload.length);
                  appendLog("D2 response window=40s (FW 2.1.0 previously replied after ~21s). "+
                          "Disconnect before response is treated as expected restart.");

                  // Arm expected reboot BEFORE D2. FW 2.1.0 can restart/disconnect before
                  // sending the D2 response, which happened in 3.8 after about 7 seconds.
                  awaitingExpectedReboot=true;
                  autoReconnectDeviceNumber=deviceNumber;
                  saveLocalProfile();

                  sendEncrypted(CMD_WIFI_CONFIG,payload,p -> {
                      try {
                          requirePacketOk(p,"Wi-Fi configuration");
                          int detail=parseConfigDetail(p.payload);
                          appendLog("RX WIFI D2 payload="+hex(p.payload)+" detail=0x"
                                  +String.format(Locale.US,"%04X",detail));

                          if (p.payload!=null && p.payload.length>=3 && detail!=0)
                              throw new Exception("Wi-Fi configuration rejected, detail=0x"
                                      +String.format(Locale.US,"%04X",detail));

                          progress("Internet connection",true,"Wi-Fi write accepted; verifying after restart");
                          setStatus("WI-FI WRITE SENT",
                                  "Waiting for restart/reconnect, then READ ALL verifies SSID from E4.");
                          connectionStatus.setText("Wi-Fi write sent. Waiting for charger read-back verification...");

                          // Some firmware does not disconnect BLE. Once D2 finally replies,
                          // allow the network stack a few seconds and then read E4 back directly.
                          main.postDelayed(() -> {
                              if (authenticated && awaitingExpectedReboot && !readInProgress) {
                                  appendLog("No BLE disconnect after successful D2; starting in-place E4 verification.");
                                  awaitingExpectedReboot=false;
                                  readCurrentConfig();
                              }
                          },5000);

                      } catch(Exception e) {
                          // If the charger rebooted, clearSession cancels this callback and the
                          // auto-reconnect path verifies E4. If it stayed connected but D2 timed
                          // out, do one charger read-back before declaring failure because some
                          // FW applies the setting asynchronously.
                          String err=safeError(e);
                          if (gatt!=null && authenticated && err.toLowerCase(Locale.US).contains("timeout")) {
                              appendLog("D2 timeout while BLE is still connected; verifying actual E4 state before failing.");
                              main.postDelayed(() -> {
                                  if (authenticated && !readInProgress) {
                                      awaitingExpectedReboot=false;
                                      readCurrentConfig();
                                  }
                              },1500);
                              return;
                          }
                          if (gatt!=null && authenticated) {
                              awaitingExpectedReboot=false;
                              wifiWritePending=false;
                              progress("Internet connection",false,err);
                              failStatus("Wi-Fi write failed",err);
                              saveBtn.setEnabled(true);
                          }
                      }
                  });
              }

              private void applyEthernetLast() {
                  expectedNetworkMode=2;
                  progress("Internet connection",false,"Preparing Ethernet DHCP...");
                  connectionStatus.setText("Setting Ethernet DHCP / network mode...");

                  ensureDhcpBeforeNetworkWrite(2,() ->
                      enableConnectionAuth(NET_ETHERNET,() -> {
                          progress("Internet connection",true,"Ethernet DHCP/mode command sent");
                          saveLocalProfile();
                          awaitingExpectedReboot=true;
                          autoReconnectDeviceNumber=deviceNumber;
                          setStatus(lastOcppApplyOk?"CONFIGURATION SAVED":"NETWORK SAVED / OCPP NEEDS ATTENTION",
                                  "Waiting for charger network restart / read-back...");
                          main.postDelayed(() -> {
                              if (authenticated && awaitingExpectedReboot && !readInProgress) {
                                  awaitingExpectedReboot=false;
                                  readCurrentConfig();
                              }
                          },7000);
                      }));
              }

              private void readCurrentConfig() {
                  if (Looper.myLooper()!=Looper.getMainLooper()) {
                      main.post(this::readCurrentConfig);
                      return;
                  }

                  if (!authenticated) {
                      toast("Authenticate charger first.");
                      return;
                  }
                  if (authInProgress) {
                      appendLog("READ ALL delayed: authentication still in progress.");
                      main.postDelayed(this::readCurrentConfig,700);
                      return;
                  }
                  if (readInProgress) {
                      appendLog("READ ALL ignored: another READ ALL is already running.");
                      return;
                  }

                  readInProgress=true;
                  loadLocalProfile();
                  progress("Current configuration",false,"READ ALL in progress...");
                  setStatus("READING ALL CONFIGURATION",
                          "E4/C7/AA/D3/DB/C5 • Wi-Fi, DHCP/static and OCPP");
                  appendLog("READ ALL START: E4 -> C7 -> AA -> D3 -> DB -> C5");

                  queryWifiInfo(() ->
                          queryWifiNetworkConfigForRead(() ->
                              queryTcpIpConfig(() ->
                                  queryNetworkStatusForRead(() ->
                                      queryDeviceNetConfigForRead(() ->
                                          queryGenericConfigForRead())))));
              }

              private void queryWifiInfo(Runnable next) {
                  sendEncrypted(CMD_QUERY_WIFI_INFO,new byte[0],p -> {
                      try {
                          requirePacketOk(p,"Query Wi-Fi info");
                          String[] wifi=parseWifiInfo(p.payload);
                          String ssid=wifi[0];
                          String password=wifi[1];

                          appendLog("RX E4 WIFI_INFO payload="+hex(p.payload)
                                  +(ssid.isEmpty()?"":" ssid="+ssid)
                                  +" password=<hidden>");

                          if (!ssid.isEmpty()) wifiSsid.setText(ssid);

                          // Do NOT silently replace the editable password with the charger's
                          // previous Wi-Fi password during a failed post-write verification.
                          // That can make the next attempt combine a new SSID with an old key.
                          if (!wifiWritePending && !password.isEmpty()) wifiPassword.setText(password);

                          if (!ssid.isEmpty() && !wifiWritePending) {
                              writeSecure(profileKey("wifi_ssid"),ssid);
                              if (!password.isEmpty()) writeSecure(profileKey("wifi_password"),password);
                          }

                          if (wifiWritePending && !pendingDesiredSsid.isEmpty()) {
                              if (pendingDesiredSsid.equals(ssid)) {
                                  appendLog("WIFI VERIFY OK desired="+pendingDesiredSsid+" actual="+ssid);
                                  progress("Internet connection",true,"Wi-Fi saved: "+ssid+" • DHCP requested");
                                  connectionStatus.setText("✓ Wi-Fi verified from charger: "+ssid+" • DHCP");
                                  wifiWritePending=false;
                                  pendingDesiredSsid="";
                              } else {
                                  appendLog("WIFI VERIFY FAILED desired="+pendingDesiredSsid+" actual="+ssid);
                                  progress("Internet connection",false,"Wi-Fi NOT saved; charger still reports "+ssid);
                                  connectionStatus.setText("✕ Wi-Fi not changed. Charger actual SSID: "+ssid);
                                  int desiredPasswordLength=wifiPassword.getText().toString().length();
                                  setStatus("WI-FI ROLLED BACK",
                                          "Requested "+pendingDesiredSsid+" but charger returned to "+ssid+". "
                                          +"Check 2.4 GHz availability and Wi-Fi credentials. Password length sent="
                                          +desiredPasswordLength+".");
                                  appendLog("WIFI ROLLBACK CONFIRMED desired="+pendingDesiredSsid
                                          +" actual="+ssid+" sentPasswordLength="+desiredPasswordLength);
                                  // Keep the requested password in the input field for correction/retry;
                                  // do not overwrite it with the old charger's password.
                                  wifiWritePending=false;
                                  pendingDesiredSsid="";
                              }
                          }

                      } catch(Exception e) {
                          appendLog("E4 Wi-Fi info warning: "+safeError(e));
                      }

                      if (next!=null) next.run();
                  });
              }

              private void queryWifiNetworkConfigForRead(Runnable next) {
                  // Public reverse-engineering of the Terra AC protocol identifies 0xC7
                  // as NETWORK_OF_WIFI_CONFIGURATION. A payload of 0x01 is used as a
                  // read request. This is diagnostic/read-only here; E4 remains the
                  // authoritative SSID field until the C7 response layout is confirmed.
                  sendEncrypted(CMD_WIFI_NETWORK_CONFIG,new byte[]{0x01},p -> {
                      try {
                          requirePacketOk(p,"Query Wi-Fi network configuration (C7)");
                          String ascii=printableAscii(p.payload);
                          appendLog("READ C7 WIFI_NETWORK payload="+hex(p.payload)
                                  +(ascii.isEmpty()?"":" text="+ascii));
                      } catch(Exception e) {
                          appendLog("C7 Wi-Fi network read warning: "+safeError(e));
                      }
                      if (next!=null) next.run();
                  });
              }

              private String printableAscii(byte[] b) {
                  if (b==null || b.length==0) return "";
                  StringBuilder s=new StringBuilder();
                  for (byte x:b) {
                      int v=x&0xff;
                      if (v>=32 && v<=126) s.append((char)v);
                      else if (v==10 || v==13 || v==9) s.append(' ');
                      else if (s.length()>0) s.append(' ');
                  }
                  return s.toString().trim().replaceAll("\\s+"," ");
              }

              private String[] parseWifiInfo(byte[] payload) {
                  // TerraConfig QueryWifiInfoResponse format observed from charger:
                  // 0x02 + SSID UTF-8 + 0x0A + PASSWORD UTF-8 + 0x03
                  if (payload==null || payload.length==0)
                      return new String[]{"",""};

                  int start=0;
                  if ((payload[0]&0xff)==0x02) start=1;

                  int sep=-1;
                  int end=payload.length;

                  for (int i=start;i<payload.length;i++) {
                      int v=payload[i]&0xff;
                      if (v==0x0A && sep<0) sep=i;
                      if (v==0x03) {
                          end=i;
                          break;
                      }
                  }

                  if (sep<0) {
                      String ssid=new String(payload,start,Math.max(0,end-start),
                              StandardCharsets.UTF_8).trim();
                      return new String[]{ssid,""};
                  }

                  String ssid=new String(payload,start,Math.max(0,sep-start),
                          StandardCharsets.UTF_8).trim();
                  String password=new String(payload,sep+1,Math.max(0,end-(sep+1)),
                          StandardCharsets.UTF_8);

                  return new String[]{ssid,password};
              }

              private void queryTcpIpConfig(Runnable next) {
                  sendEncrypted(CMD_QUERY_TCPIP,new byte[0],p -> {
                      try {
                          requirePacketOk(p,"Query TCP/IP configuration");

                          if (p.payload==null || p.payload.length<2)
                              throw new Exception("TCP/IP payload too short: "+hex(p.payload));

                          int type=p.payload[0]&0xff; // firmware-specific interface enum
                          int mode=p.payload[1]&0xff; // 0 DHCP, 1 Static IP
                          lastAaInterfaceType=type;
                          lastAaIpMode=mode;

                          // On the tested FW 2.1.0, active Wi-Fi reads back as type=0.
                          // Do not reuse D3's enum here: D3 reports Wi-Fi as mode=1.
                          String typeName=type==0?"Wi-Fi":type==1?"Ethernet / interface 1":"type "+type;
                          String modeName=mode==0?"DHCP":mode==1?"STATIC IP":"mode "+mode;

                          String ip="";
                          String mask="";
                          String gateway="";
                          String dns="";

                          if (mode==1 && p.payload.length>=18) {
                              ip=ipv4(p.payload,2);
                              mask=ipv4(p.payload,6);
                              gateway=ipv4(p.payload,10);
                              dns=ipv4(p.payload,14);
                          }

                          appendLog("READ AA TCPIP type="+typeName
                                  +" mode="+modeName
                                  +(ip.isEmpty()?"":" ip="+ip+" mask="+mask
                                      +" gateway="+gateway+" dns="+dns));

                          // Keep connection selector aligned with charger.
                          if (type==0) {
                              connectionType.setSelection(0);
                              wifiFields.setVisibility(View.VISIBLE);
                          } else if (type==1) {
                              // FW-dependent; keep Ethernet interpretation only when UI is not
                              // already known to be Wi-Fi from D3/E4.
                              if (wifiSsid==null || wifiSsid.getText().toString().trim().isEmpty()) {
                                  connectionType.setSelection(1);
                                  wifiFields.setVisibility(View.GONE);
                              }
                          }

                          lastTcpIpSummary="TCP/IP: "+typeName+" • "+modeName
                                  +(ip.isEmpty()?"":" • "+ip);
                          connectionStatus.setText(lastTcpIpSummary);

                      } catch(Exception e) {
                          appendLog("AA TCP/IP read warning: "+safeError(e));
                      }

                      if (next!=null) next.run();
                  });
              }

              private String ipv4(byte[] b,int off) {
                  if (b==null || off<0 || off+4>b.length) return "";
                  return (b[off]&0xff)+"."+(b[off+1]&0xff)+"."
                          +(b[off+2]&0xff)+"."+(b[off+3]&0xff);
              }

              private void queryNetworkStatusForRead(Runnable next) {
                  sendEncrypted(CMD_NETWORK_STATUS,new byte[0],p -> {
                      try {
                          requirePacketOk(p,"Network status");

                          if (p.payload==null || p.payload.length<4)
                              throw new Exception(
                                      "Network status payload too short: "+hex(p.payload));

                          int networkResult=p.payload[0]&0xff;
                          int mode=p.payload[1]&0xff;
                          int detail=(p.payload[2]&0xff)|((p.payload[3]&0xff)<<8);
                          String detailText=networkDetailText(detail);
                          String modeText=mode==1?"Wi-Fi":mode==2?"Ethernet":"mode "+mode;

                          appendLog("READ D3 networkResult="+networkResult
                                  +" mode="+mode+" ("+modeText+")"
                                  +" detail=0x"+String.format(Locale.US,"%04X",detail)
                                  +" ("+detailText+")");

                          // IMPORTANT: DHCP/static comes from AA, not D3.
                          // D3 on FW 2.1.0 can report 0x1502 even while AA says DHCP.
                          internetReady=(detail==0x0200);
                          progress("Internet connection",internetReady,
                                  internetReady?"Internet ready":detailText);

                          String prefix=lastTcpIpSummary.isEmpty()?"TCP/IP: unknown":lastTcpIpSummary;
                          connectionStatus.setText(prefix+" • D3: "+detailText);

                      } catch(Exception e) {
                          appendLog("D3 read warning: "+safeError(e));
                      }

                      if (next!=null) next.run();
                  });
              }

              private void queryDeviceNetConfigForRead(Runnable next) {
                  sendEncrypted(CMD_QUERY_DEVICE_NET_CONFIG,new byte[0],p -> {
                      try {
                          requirePacketOk(p,"Query OCPP/network configuration");

                          if (p.payload==null || p.payload.length<8)
                              throw new Exception("DB payload too short: "+hex(p.payload));

                          int pos=0;
                          int protocolType=p.payload[pos++]&0xff;
                          int protocolVersion=p.payload[pos++]&0xff;

                          int domainLen=p.payload[pos++]&0xff;
                          if (pos+domainLen+5>p.payload.length)
                              throw new Exception("DB domain length invalid.");

                          String domain=new String(p.payload,pos,domainLen,
                                  StandardCharsets.UTF_8);
                          pos+=domainLen;

                          int port=(p.payload[pos]&0xff)|((p.payload[pos+1]&0xff)<<8);
                          pos+=2;

                          int originalOrExternal=p.payload[pos++]&0xff;
                          int enableTls=p.payload[pos++]&0xff;
                          int expand=p.payload[pos++]&0xff;

                          String tag="";
                          if (pos<p.payload.length) {
                              int tagLen=p.payload[pos++]&0xff;
                              if (tagLen>0 && pos+tagLen<=p.payload.length)
                                  tag=new String(p.payload,pos,tagLen,
                                          StandardCharsets.UTF_8);
                          }

                          String fullUrl=buildOcppUrlFromRead(domain,port,enableTls);

                          appendLog("READ DB OCPP protocolType="+protocolType
                                  +" protocolVersion="+protocolVersion
                                  +" domain="+domain
                                  +" port="+port
                                  +" tls="+enableTls
                                  +" source="+originalOrExternal
                                  +" expand="+expand
                                  +" tag="+tag);

                          if (!fullUrl.isEmpty()) setServerUrlValue(fullUrl);
                          if (!tag.isEmpty()) {
                              lastReadOcppChargerId=tag;
                              chargePointId.setText(tag);
                          }

                          // DB does not expose securityKey/AuthKey. Keep encrypted
                          // local profile value if our app has one.
                          String cachedAuth=readProfile("auth_key");
                          if (!cachedAuth.isEmpty()) authKey.setText(cachedAuth);

                          progress("OCPP configuration",true,
                                  "URL + Charger ID read from charger");


                      } catch(Exception e) {
                          progress("OCPP configuration",false,"DB read failed");
                          appendLog("DB OCPP read warning: "+safeError(e));
                      }

                      if (next!=null) next.run();
                  });
              }

              private void queryGenericConfigForRead() {
                  sendEncrypted(CMD_READ_CONFIGURATION,new byte[]{0x01},p -> {
                      try {
                          requirePacketOk(p,"C5 configuration read");
                          String ascii=printableUtf8(p.payload);
                          appendLog("READ C5 CONFIG payload="+hex(p.payload)
                                  +(ascii.isEmpty()?"":" text="+compact(ascii)));

                          if (!ascii.isEmpty() && ascii.trim().startsWith("{")) {
                              try {
                                  JSONObject j=new JSONObject(ascii.trim());
                                  String id=findConfigValue(j,"charger_identity");
                                  if (id.isEmpty()) id=findConfigValue(j,"charge_point_id");
                                  String url=findConfigValue(j,"server_a_ip_address");
                                  String basicAuth=findConfigValue(j,"HTTPBasicAuthEnable");
                                  if (basicAuth.isEmpty()) basicAuth=findConfigValue(j,"http_basic_auth_enable");
                                  if (!basicAuth.isEmpty()) {
                                      boolean on="1".equals(basicAuth) || "true".equalsIgnoreCase(basicAuth);
                                      requiresPassword.setChecked(on);
                                      appendLog("READ C5 HTTPBasicAuthEnable="+basicAuth);
                                  }
                                  if (!id.isEmpty()) {
                                      lastReadOcppChargerId=id;
                                      chargePointId.setText(id);
                                      appendLog("READ C5 charger identity="+id);
                                  }
                                  if (!url.isEmpty() && serverUrl.getText().toString().trim().isEmpty())
                                      setServerUrlValue(url);
                              } catch(Exception parse) {
                                  appendLog("C5 text is not recognized JSON configuration: "+safeError(parse));
                              }
                          }
                      } catch(Exception e) {
                          appendLog("C5 read warning (optional/fallback): "+safeError(e));
                      }

                      String cachedAuth=readProfile("auth_key");
                      if (!cachedAuth.isEmpty()) authKey.setText(cachedAuth);

                      progress("Current configuration",true,"READ ALL complete");
                      if (!statusTitle.getText().toString().equals("WI-FI NOT SAVED")) {
                          setStatus("CONFIGURATION LOADED",
                                  "Wi-Fi + DHCP/static + D3 status + OCPP read complete. Values shown are read from charger.");
                      }
                      appendLog("READ ALL COMPLETE");
                      readInProgress=false;
                      saveBtn.setEnabled(authenticated);

                      // After the post-APPLY reboot/read-back, provision Basic Auth via the
                      // user's existing Node OCPP gateway. This reproduces the exact OCPP
                      // ChangeConfiguration path that the charger has already accepted.
                      if (pendingGatewayBasicAuth
                              && pendingGatewayAuthKey!=null && !pendingGatewayAuthKey.isEmpty()
                              && pendingGatewayClientId!=null && !pendingGatewayClientId.isEmpty()) {
                          final int generation=gatewayAuthGeneration;
                          main.postDelayed(() -> {
                              if (generation==gatewayAuthGeneration && pendingGatewayBasicAuth)
                                  startGatewayBasicAuthProvision(generation);
                          },1500);
                      }
                  });
              }

              private void startGatewayBasicAuthProvision(int generation) {
                  if (!pendingGatewayBasicAuth || generation!=gatewayAuthGeneration) return;

                  final String cp=pendingGatewayClientId==null?"":pendingGatewayClientId.trim();
                  final String plain=pendingGatewayAuthKey==null?"":pendingGatewayAuthKey;
                  final String ocpp=pendingDesiredOcppUrl==null || pendingDesiredOcppUrl.trim().isEmpty()
                          ?serverUrl.getText().toString().trim():pendingDesiredOcppUrl.trim();

                  if (cp.isEmpty() || plain.isEmpty()) {
                      appendLog("BASIC AUTH GATEWAY aborted: missing Charger ID/AuthKey.");
                      progress("OCPP Basic Auth",false,"Missing Charger ID/AuthKey");
                      return;
                  }

                  final String api;
                  try {
                      java.net.URI uri=new java.net.URI(ocpp);
                      String host=uri.getHost();
                      if (host==null || host.isEmpty()) throw new Exception("OCPP host missing");
                      api="http://"+host+":3000/changeconfiguration";
                  } catch(Exception e) {
                      appendLog("BASIC AUTH GATEWAY URL ERROR: "+safeError(e));
                      progress("OCPP Basic Auth",false,"Cannot derive gateway API from OCPP URL");
                      return;
                  }

                  byte[] raw=plain.getBytes(StandardCharsets.UTF_8);
                  final String hexKey=bytesToHexAscii(raw);
                  setStatus("PROVISIONING OCPP BASIC AUTH",
                          "Sending AuthorizationKey through local gateway for "+cp+"...");
                  progress("OCPP Basic Auth",false,"Waiting for "+cp+" on gateway :3000");
                  appendLog("BASIC AUTH GATEWAY start clientId="+cp
                          +" api="+api
                          +" plainBytes="+raw.length
                          +" hexChars="+hexKey.length()
                          +" (secret hidden)");

                  gatewayChangeConfigWithRetry(generation,api,cp,
                          "AuthorizationKey",hexKey,0,24,() -> {
                              appendLog("BASIC AUTH GATEWAY AuthorizationKey send accepted by gateway. Charger may reconnect before the next command.");
                              progress("OCPP Basic Auth",false,"AuthorizationKey sent; waiting to enable HTTP Basic Auth...");
                              main.postDelayed(() -> gatewayChangeConfigWithRetry(generation,api,cp,
                                      "HTTPBasicAuthEnable","true",0,30,() -> {
                                          if (generation!=gatewayAuthGeneration) return;
                                          pendingGatewayBasicAuth=false;
                                          progress("OCPP Basic Auth",true,"AuthorizationKey + HTTPBasicAuthEnable commands sent");
                                          setStatus("BASIC AUTH COMMANDS SENT",
                                                  "Now use SteVe Security Profile 1 with the SAME plain password. Charger ID must exactly match "+cp+".");
                                          appendLog("BASIC AUTH GATEWAY COMPLETE: AuthorizationKey=<HEX> and HTTPBasicAuthEnable=true were sent through OCPP. SteVe password remains the original plain password; do NOT enter the HEX string in SteVe.");
                                      }),2500);
                          });
              }

              private void gatewayChangeConfigWithRetry(int generation,String endpoint,String clientId,
                      String key,String value,int attempt,int maxAttempts,Runnable onSent) {
                  if (generation!=gatewayAuthGeneration || !pendingGatewayBasicAuth) return;
                  if (attempt>=maxAttempts) {
                      appendLog("BASIC AUTH GATEWAY FAILED: "+key+" could not be sent after "+maxAttempts+" attempts. Keep SteVe on Security Profile 0 and confirm Node HTTP API port 3000 is reachable from the phone.");
                      progress("OCPP Basic Auth",false,key+" not sent; gateway/client unavailable");
                      setStatus("BASIC AUTH NOT PROVISIONED",
                              "Could not reach connected charger through http://<server>:3000/changeconfiguration");
                      return;
                  }

                  final int next=attempt+1;
                  new Thread(() -> {
                      try {
                          JSONObject j=new JSONObject();
                          j.put("clientId",clientId);
                          j.put("key",key);
                          j.put("value",value);
                          String resp=http("POST",endpoint,"application/json",j.toString(),null);
                          appendLog("BASIC AUTH GATEWAY "+key+" HTTP 200 attempt="+next
                                  +" response="+compact(resp));
                          runOnUiThread(() -> {
                              if (generation==gatewayAuthGeneration && pendingGatewayBasicAuth && onSent!=null)
                                  onSent.run();
                          });
                      } catch(HttpError e) {
                          // The user's gateway returns 404 'Client not connected' while the
                          // charger is rebooting/reconnecting. Retry automatically.
                          appendLog("BASIC AUTH GATEWAY "+key+" retry="+next
                                  +" HTTP "+e.code+" "+safeError(e));
                          runOnUiThread(() -> main.postDelayed(() ->
                                  gatewayChangeConfigWithRetry(generation,endpoint,clientId,key,value,
                                          next,maxAttempts,onSent),5000));
                      } catch(Exception e) {
                          appendLog("BASIC AUTH GATEWAY "+key+" retry="+next
                                  +" error="+safeError(e));
                          runOnUiThread(() -> main.postDelayed(() ->
                                  gatewayChangeConfigWithRetry(generation,endpoint,clientId,key,value,
                                          next,maxAttempts,onSent),5000));
                      }
                  }).start();
              }

              private void runBasicAuthInternalVerify() {
                  if (!authenticated) {
                      toast("Authenticate charger first.");
                      return;
                  }
                  if (basicAuthVerifyBtn!=null) basicAuthVerifyBtn.setEnabled(false);
                  if (basicAuthVerifyStatus!=null)
                      basicAuthVerifyStatus.setText("Reading charger internal configuration...");

                  final String expectedPlain=authKey==null?"":authKey.getText().toString();
                  final int expectedBytes=expectedPlain.getBytes(StandardCharsets.UTF_8).length;
                  appendLog("BASIC AUTH VERIFY START expectedPlainBytes="+expectedBytes
                          +" (secret hidden; read-only diagnostic)");

                  sendEncrypted(CMD_READ_CONFIGURATION,new byte[]{0x01},p -> {
                      final StringBuilder report=new StringBuilder();
                      try {
                          requirePacketOk(p,"Basic Auth generic configuration read");
                          String ascii=printableUtf8(p.payload);
                          appendLog("BASIC AUTH VERIFY C5 raw="+hex(p.payload)
                                  +(ascii.isEmpty()?"":" text="+compactLong(ascii,1200)));

                          JSONObject j=null;
                          if (!ascii.isEmpty()) {
                              int brace=ascii.indexOf('{');
                              if (brace>=0) {
                                  try { j=new JSONObject(ascii.substring(brace)); }
                                  catch(Exception parse) {
                                      appendLog("BASIC AUTH VERIFY C5 JSON parse warning: "+safeError(parse));
                                  }
                              }
                          }

                          String httpBasic=findConfigValueAnyCase(j,
                                  "HTTPBasicAuthEnable","http_basic_auth_enable","httpBasicAuthEnable");
                          String secProfile=findConfigValueAnyCase(j,
                                  "SecurityProfile","security_profile","securityProfile","ocpp_security_profile");
                          String authReadable=findConfigValueAnyCase(j,
                                  "AuthorizationKey","authorization_key","authorizationKey","ocpp_authorization_key");
                          String socketEnable=findConfigValueAnyCase(j,"socket_a_enable","socketAEnable");
                          String encrypted=findConfigValueAnyCase(j,"encrypted_a","encryptedA");

                          report.append("C5 HTTPBasicAuthEnable : ")
                                  .append(httpBasic.isEmpty()?"NOT EXPOSED":httpBasic).append("\n");
                          report.append("C5 SecurityProfile     : ")
                                  .append(secProfile.isEmpty()?"NOT EXPOSED":secProfile).append("\n");
                          report.append("C5 socket_a_enable     : ")
                                  .append(socketEnable.isEmpty()?"NOT EXPOSED":socketEnable).append("\n");
                          report.append("C5 encrypted_a         : ")
                                  .append(encrypted.isEmpty()?"NOT EXPOSED":encrypted).append("\n");
                          report.append("AuthorizationKey read : ")
                                  .append(authReadable.isEmpty()?"NOT EXPOSED / LIKELY WRITE-ONLY":"EXPOSED (value hidden)")
                                  .append("\n");
                          report.append("Expected plain length  : ").append(expectedBytes).append(" bytes\n");

                          if (!httpBasic.isEmpty()) {
                              boolean on="1".equals(httpBasic)
                                      || "true".equalsIgnoreCase(httpBasic)
                                      || "on".equalsIgnoreCase(httpBasic)
                                      || "enabled".equalsIgnoreCase(httpBasic);
                              report.append("HTTP Basic Auth flag   : ")
                                      .append(on?"ON":"OFF / UNKNOWN VALUE").append("\n");
                          } else {
                              report.append("HTTP Basic Auth flag   : cannot prove from generic C5 read\n");
                          }

                      } catch(Exception e) {
                          appendLog("BASIC AUTH VERIFY C5 warning: "+safeError(e));
                          report.append("C5 read                : ERROR ").append(safeError(e)).append("\n");
                      }

                      sendEncrypted(CMD_QUERY_DEVICE_NET_CONFIG,new byte[0],db -> {
                          try {
                              requirePacketOk(db,"Basic Auth DB read");
                              String[] info=parseDbForVerify(db.payload);
                              String domain=info[0];
                              String port=info[1];
                              String tls=info[2];
                              String tag=info[3];
                              report.append("DB OCPP endpoint        : ").append(domain)
                                      .append(port.isEmpty()?"":":"+port).append("\n");
                              report.append("DB TLS flag             : ").append(tls.isEmpty()?"?":tls).append("\n");
                              report.append("DB Charger ID           : ").append(tag.isEmpty()?"NOT EXPOSED":tag).append("\n");
                              report.append("DB AuthKey field        : NOT PRESENT IN READ-BACK\n");
                              appendLog("BASIC AUTH VERIFY DB domain="+domain+" port="+port
                                      +" tls="+tls+" tag="+tag);
                          } catch(Exception e) {
                              appendLog("BASIC AUTH VERIFY DB warning: "+safeError(e));
                              report.append("DB read                 : ERROR ").append(safeError(e)).append("\n");
                          }

                          report.append("\nInterpretation:\n")
                                  .append("• If HTTPBasicAuthEnable reads ON but server/local capture still sees NO Authorization header, the problem is after configuration storage: charger HTTP/WebSocket auth generation or firmware behavior.\n")
                                  .append("• AuthorizationKey NOT EXPOSED is expected for a write-only secret and does not prove that the password is empty.\n")
                                  .append("• Final proof remains the actual WebSocket Authorization header capture.");

                          final String textReport=report.toString();
                          if (basicAuthVerifyStatus!=null) basicAuthVerifyStatus.setText(textReport);
                          appendLog("BASIC AUTH VERIFY COMPLETE");
                          if (basicAuthVerifyBtn!=null) basicAuthVerifyBtn.setEnabled(true);
                      });
                  });
              }

              private String[] parseDbForVerify(byte[] payload) throws Exception {
                  if (payload==null || payload.length<8) throw new Exception("DB payload too short: "+hex(payload));
                  int pos=0;
                  pos++; // protocol type
                  pos++; // protocol version
                  int domainLen=payload[pos++]&0xff;
                  if (pos+domainLen+5>payload.length) throw new Exception("DB domain length invalid");
                  String domain=new String(payload,pos,domainLen,StandardCharsets.UTF_8);
                  pos+=domainLen;
                  int port=(payload[pos]&0xff)|((payload[pos+1]&0xff)<<8); pos+=2;
                  pos++; // original/external
                  int tls=payload[pos++]&0xff;
                  pos++; // expand
                  String tag="";
                  if (pos<payload.length) {
                      int tagLen=payload[pos++]&0xff;
                      if (tagLen>0 && pos+tagLen<=payload.length)
                          tag=new String(payload,pos,tagLen,StandardCharsets.UTF_8);
                  }
                  return new String[]{domain,String.valueOf(port),String.valueOf(tls),tag};
              }

              private String findConfigValueAnyCase(JSONObject j,String... keys) {
                  if (j==null || keys==null) return "";
                  try {
                      Set<String> wanted=new HashSet<>();
                      for(String k:keys) if (k!=null) wanted.add(k.toLowerCase(Locale.US));
                      Iterator<String> it=j.keys();
                      while(it.hasNext()) {
                          String actual=it.next();
                          Object value=j.opt(actual);
                          if (wanted.contains(actual.toLowerCase(Locale.US))) {
                              if (value instanceof JSONArray) {
                                  JSONArray a=(JSONArray)value;
                                  if (a.length()>0) return String.valueOf(a.get(a.length()-1));
                              }
                              if (value!=null && value!=JSONObject.NULL) return String.valueOf(value);
                          }
                          if (value instanceof JSONObject) {
                              String nested=findConfigValueAnyCase((JSONObject)value,keys);
                              if (!nested.isEmpty()) return nested;
                          }
                      }
                  } catch(Exception ignored) {}
                  return "";
              }

              private String compactLong(String s,int max) {
                  if (s==null) return "";
                  String x=s.replace("\n"," ").replace("\r"," ");
                  return x.length()>max?x.substring(0,max):x;
              }

              private void startLocalAuthDiagnostic() {
                  if (!authenticated) {
                      toast("Authenticate charger first.");
                      return;
                  }

                  final String cp=!lastReadOcppChargerId.isEmpty()
                          ?lastReadOcppChargerId
                          :chargePointId.getText().toString().trim();
                  if (cp.isEmpty()) {
                      toast("Charger ID is required.");
                      return;
                  }
                  if (!cp.equals(chargePointId.getText().toString().trim())) {
                      appendLog("AUTH PROVISION Charger ID corrected from UI="+chargePointId.getText().toString().trim()
                              +" to charger read-back="+cp);
                      chargePointId.setText(cp);
                  }

                  final String original=serverUrl.getText().toString().trim();
                  if (!(original.startsWith("ws://") || original.startsWith("wss://"))) {
                      toast("READ ALL / select the original OCPP URL first.");
                      return;
                  }

                  try {
                      String ip=getActiveWifiIpv4();
                      authDiagOriginalUrl=original;
                      authDiagExpectedPlain=authKey.getText().toString();
                      int plainBytes=authDiagExpectedPlain.getBytes(StandardCharsets.UTF_8).length;
                      if (authDiagExpectedPlain.isEmpty())
                          throw new Exception("Enter the plain AuthKey/password first.");
                      if (plainBytes<10 || plainBytes>20)
                          throw new Exception("AuthKey must be 10-20 UTF-8 bytes for this ABB compatibility test. Current="+plainBytes);

                      authDiagBaselinePassword=null;
                      authDiagConnectionCount=0;
                      authDiagChallengeCount=0;
                      authProvisionStage=0;
                      authProvisionRequestId="";
                      authProvisionUnauthReconnects=0;
                      writeSecure(profileKey("auth_diag_original_url"),original);
                      startAuthDiagServer();

                      final String tempUrl="ws://"+ip+":"+AUTH_DIAG_PORT;
                      appendLog("AUTH PROVISION START localEndpoint="+tempUrl
                              +" original="+original
                              +" expectedPlainBytes="+plainBytes
                              +" expectedHexChars="+(plainBytes*2)
                              +" (secret hidden)");
                      authDiagStatus.setText("LOCAL MINI-CSMS STARTING: "+tempUrl
                              +"\nStep 1/4: writing temporary endpoint with keyLen=0 so ABB can connect without authentication."
                              +"\nOriginal URL saved: "+authDiagOriginalUrl);

                      // IMPORTANT: keyLen=0 here is intentional only for the local provisioning
                      // test. The mini-CSMS must first accept the charger unauthenticated, then
                      // provision AuthorizationKey through real OCPP ChangeConfiguration.
                      writeOcppEndpointOnly(tempUrl,cp,"",() -> {
                          authDiagStatus.setText("LOCAL MINI-CSMS ACTIVE: "+tempUrl
                                  +"\nWaiting for ABB BootNotification WITHOUT Basic Auth."
                                  +"\nThen EMOS will send:"
                                  +"\n1) ChangeConfiguration AuthorizationKey=<HEX>"
                                  +"\n2) ChangeConfiguration HTTPBasicAuthEnable=true"
                                  +"\n3) force WebSocket reconnect"
                                  +"\n4) capture Authorization header"
                                  +"\n\nDo not reset AuthKey or change SteVe during this test.");
                          setStatus("OCPP AUTH PROVISION TEST ACTIVE",
                                  "Waiting for ABB BootNotification at "+tempUrl);
                      });

                  } catch(Exception e) {
                      stopLocalAuthDiagnostic(false);
                      appendLog("AUTH PROVISION START ERROR: "+safeError(e));
                      if (authDiagStatus!=null) authDiagStatus.setText("Start failed: "+safeError(e));
                      toast("OCPP Auth Provision Test failed: "+safeError(e));
                  }
              }

              private String getActiveWifiIpv4() throws Exception {
                  ConnectivityManager cm=(ConnectivityManager)getSystemService(CONNECTIVITY_SERVICE);
                  if (cm==null) throw new Exception("ConnectivityManager unavailable");
                  Network network=cm.getActiveNetwork();
                  if (network==null) throw new Exception("Phone has no active network. Connect phone to the same Wi-Fi as charger.");
                  NetworkCapabilities caps=cm.getNetworkCapabilities(network);
                  if (caps==null || !caps.hasTransport(NetworkCapabilities.TRANSPORT_WIFI))
                      throw new Exception("Phone must be connected to the same Wi-Fi/LAN as the charger (not mobile data only).");
                  LinkProperties lp=cm.getLinkProperties(network);
                  if (lp==null) throw new Exception("Wi-Fi link properties unavailable");
                  for (LinkAddress la:lp.getLinkAddresses()) {
                      if (la.getAddress() instanceof Inet4Address && !la.getAddress().isLoopbackAddress())
                          return la.getAddress().getHostAddress();
                  }
                  throw new Exception("Wi-Fi IPv4 address not found");
              }

              private void startAuthDiagServer() throws Exception {
                  stopLocalAuthDiagnostic(false);
                  authDiagServer=new ServerSocket(AUTH_DIAG_PORT);
                  authDiagServer.setReuseAddress(true);
                  authDiagRunning=true;
                  authDiagThread=new Thread(() -> {
                      appendLog("AUTH DIAG listener started on TCP "+AUTH_DIAG_PORT);
                      while(authDiagRunning) {
                          try {
                              Socket socket=authDiagServer.accept();
                              socket.setSoTimeout(120000);
                              handleAuthDiagClient(socket);
                          } catch(Exception e) {
                              if (authDiagRunning) appendLog("AUTH DIAG socket: "+safeError(e));
                          }
                      }
                  },"emos-auth-diag");
                  authDiagThread.start();
              }

              private void handleAuthDiagClient(Socket socket) {
                  int stageAtOpen=authProvisionStage;
                  try(Socket s=socket) {
                      InputStream in=new BufferedInputStream(s.getInputStream());
                      OutputStream out=new BufferedOutputStream(s.getOutputStream());
                      String header=readHttpHeader(in,16384);
                      if (header.isEmpty()) return;

                      String[] lines=header.split("\\r?\\n");
                      final String requestLine=lines.length>0 ? lines[0] : "";
                      String authorization="";
                      String wsKey="";
                      String wsProtocol="";
                      for(String line:lines) {
                          int c=line.indexOf(':');
                          if (c<=0) continue;
                          String n=line.substring(0,c).trim();
                          String v=line.substring(c+1).trim();
                          if ("Authorization".equalsIgnoreCase(n)) authorization=v;
                          else if ("Sec-WebSocket-Key".equalsIgnoreCase(n)) wsKey=v;
                          else if ("Sec-WebSocket-Protocol".equalsIgnoreCase(n)) wsProtocol=v;
                      }

                      AuthDiagDecoded auth=decodeBasicAuth(authorization);
                      final String remote=String.valueOf(s.getRemoteSocketAddress());

                      // Before both ChangeConfiguration commands are Accepted, EMOS intentionally
                      // accepts an unauthenticated WebSocket. This is the provisioning channel.
                      // AFTER stage 4, the next connection is the actual proof and must contain
                      // Authorization. If it does not, challenge exactly like Security Profile 1.
                      if (authProvisionStage>=4) {
                          if (!auth.present) {
                              final int challenge=++authDiagChallengeCount;
                              final int capturesBefore=authDiagConnectionCount;
                              final int unauth=++authProvisionUnauthReconnects;
                              appendLog("AUTH PROVISION RECONNECT NO_HEADER #"+unauth
                                      +" challenge="+challenge
                                      +" remote="+remote
                                      +" request="+requestLine
                                      +" -> HTTP 401 Basic");

                              String unauthorized="HTTP/1.1 401 Unauthorized\r\n"
                                      +"WWW-Authenticate: Basic realm=\"OCPP\"\r\n"
                                      +"Content-Length: 0\r\n"
                                      +"Connection: close\r\n"
                                      +"Cache-Control: no-store\r\n\r\n";
                              out.write(unauthorized.getBytes(StandardCharsets.US_ASCII));
                              out.flush();

                              runOnUiThread(() -> {
                                  if (authDiagStatus!=null) authDiagStatus.setText(
                                          "PROVISION COMMANDS: ACCEPTED\n"
                                          +"RECONNECT #"+unauth+" HAS NO AUTHORIZATION HEADER\n"
                                          +"Remote: "+remote+"\n"
                                          +"Request: "+requestLine+"\n\n"
                                          +"EMOS replied HTTP 401 + WWW-Authenticate: Basic. Waiting for ABB retry with credentials...\n\n"
                                          +"If ABB keeps reconnecting with NO HEADER, this is strong firmware/charger-side evidence: AuthorizationKey and HTTPBasicAuthEnable were both Accepted over OCPP, but the HTTP/WebSocket layer still does not emit Basic Auth.");
                              });

                              main.postDelayed(() -> {
                                  if (authDiagRunning && authDiagConnectionCount==capturesBefore && authDiagStatus!=null
                                          && authProvisionStage>=4) {
                                      String cur=authDiagStatus.getText().toString();
                                      if (cur.contains("RECONNECT #"+unauth+" HAS NO AUTHORIZATION HEADER")) {
                                          authDiagStatus.setText(cur
                                                  +"\n\nNo authenticated retry received after 12 seconds. Capture the debug log; this result is directly comparable to the SteVe warning 'Failed to find username and password in Basic Authorization header'.");
                                      }
                                  }
                              },12000);
                              return;
                          }

                          final int capture=++authDiagConnectionCount;
                          final String expectedHex=bytesToHexAscii(authDiagExpectedPlain.getBytes(StandardCharsets.UTF_8));
                          String verdict;
                          if (!authDiagExpectedPlain.isEmpty() && auth.password.equals(authDiagExpectedPlain))
                              verdict="MATCH_EXPECTED_PLAIN";
                          else if (!expectedHex.isEmpty() && auth.password.equalsIgnoreCase(expectedHex))
                              verdict="PASSWORD_IS_HEX_OF_EXPECTED";
                          else verdict="PASSWORD_DIFFERENT_FROM_EXPECTED";

                          if (authDiagBaselinePassword==null) authDiagBaselinePassword=auth.password;
                          final String finalVerdict=verdict;
                          final String display="CAPTURE #"+capture+" • "+finalVerdict
                                  +"\nPROVISION RESULT: AuthorizationKey=Accepted, HTTPBasicAuthEnable=Accepted"
                                  +"\nRemote: "+remote
                                  +"\nRequest: "+requestLine
                                  +"\nUsername: "+(auth.username.isEmpty()?"<empty>":auth.username)
                                  +"\nPassword ASCII: "+auth.password
                                  +"\nPassword HEX: "+auth.passwordHex
                                  +"\nLength: "+auth.passwordBytes+" byte / "+auth.password.length()+" char"
                                  +"\n\nExpected plain: "+authDiagExpectedPlain
                                  +"\nOriginal OCPP: "+authDiagOriginalUrl;

                          appendLog("AUTH PROVISION CAPTURE #"+capture
                                  +" remote="+remote
                                  +" user="+auth.username
                                  +" passwordBytes="+auth.passwordBytes
                                  +" verdict="+finalVerdict);
                          runOnUiThread(() -> {
                              if (authDiagStatus!=null) authDiagStatus.setText(display
                                      +"\n\nThis is the credential ABB actually placed in the HTTP WebSocket Authorization header after OCPP provisioning.");
                          });
                      } else {
                          appendLog("AUTH PROVISION initial WS remote="+remote
                                  +" stage="+authProvisionStage
                                  +" authHeader="+(auth.present?"present":"absent")
                                  +" request="+requestLine);
                      }

                      if (wsKey.isEmpty()) {
                          String resp="HTTP/1.1 400 Bad Request\r\nConnection: close\r\n\r\n";
                          out.write(resp.getBytes(StandardCharsets.US_ASCII));
                          out.flush();
                          return;
                      }

                      String accept=Base64.encodeToString(
                              MessageDigest.getInstance("SHA-1")
                                      .digest((wsKey+WS_GUID).getBytes(StandardCharsets.US_ASCII)),
                              Base64.NO_WRAP);
                      String protocol=wsProtocol.toLowerCase(Locale.US).contains("ocpp1.6")
                              ?"Sec-WebSocket-Protocol: ocpp1.6\r\n":"";
                      String resp="HTTP/1.1 101 Switching Protocols\r\n"
                              +"Upgrade: websocket\r\n"
                              +"Connection: Upgrade\r\n"
                              +"Sec-WebSocket-Accept: "+accept+"\r\n"
                              +protocol+"\r\n";
                      out.write(resp.getBytes(StandardCharsets.US_ASCII));
                      out.flush();

                      while(authDiagRunning && !s.isClosed()) {
                          WsFrame f=readWsFrame(in);
                          if (f==null) break;
                          if (f.opcode==0x8) break;
                          if (f.opcode==0x9) {
                              writeWsFrame(out,0xA,f.payload);
                              continue;
                          }
                          if (f.opcode!=0x1) continue;

                          String text=new String(f.payload,StandardCharsets.UTF_8);
                          appendLog("AUTH PROVISION OCPP RX "+compactLong(text,500));

                          JSONArray msg;
                          try {
                              msg=new JSONArray(text);
                          } catch(Exception parse) {
                              appendLog("AUTH PROVISION invalid OCPP JSON: "+safeError(parse));
                              continue;
                          }
                          if (msg.length()<2) continue;
                          int type=msg.optInt(0,-1);

                          if (type==2 && msg.length()>=3) { // CALL from charger
                              String id=msg.optString(1,"");
                              String action=msg.optString(2,"");
                              String reply=buildDiagOcppReply(text);
                              if (reply!=null && !reply.isEmpty()) {
                                  writeWsFrame(out,0x1,reply.getBytes(StandardCharsets.UTF_8));
                                  appendLog("AUTH PROVISION OCPP TX "+compactLong(reply,500));
                              }

                              if ("BootNotification".equals(action)) {
                                  if (authProvisionStage==0) {
                                      sendAuthProvisionChangeConfiguration(out,"AuthorizationKey",
                                              bytesToHexAscii(authDiagExpectedPlain.getBytes(StandardCharsets.UTF_8)),1);
                                      runOnUiThread(() -> {
                                          if (authDiagStatus!=null) authDiagStatus.setText(
                                                  "BOOTNOTIFICATION: ACCEPTED\n"
                                                  +"Step 2/4: ChangeConfiguration AuthorizationKey=<HEX> sent.\n"
                                                  +"Waiting for charger CALLRESULT status...");
                                      });
                                  } else if (authProvisionStage==2) {
                                      sendAuthProvisionChangeConfiguration(out,"HTTPBasicAuthEnable","true",3);
                                  }
                              }
                              continue;
                          }

                          if (type==3 && msg.length()>=3) { // CALLRESULT to EMOS request
                              String id=msg.optString(1,"");
                              JSONObject payload=msg.optJSONObject(2);
                              String status=payload==null?"":payload.optString("status","");
                              if (!id.equals(authProvisionRequestId)) continue;

                              if (authProvisionStage==1) {
                                  appendLog("AUTH PROVISION AuthorizationKey CALLRESULT status="+status);
                                  if (!"Accepted".equalsIgnoreCase(status)) {
                                      authProvisionStage=90;
                                      runOnUiThread(() -> {
                                          if (authDiagStatus!=null) authDiagStatus.setText(
                                                  "AuthorizationKey ChangeConfiguration result: "+status
                                                  +"\nProvisioning stopped. ABB did not accept the key.");
                                      });
                                      continue;
                                  }
                                  authProvisionStage=2;
                                  runOnUiThread(() -> {
                                      if (authDiagStatus!=null) authDiagStatus.setText(
                                              "AuthorizationKey: ACCEPTED\n"
                                              +"Step 3/4: sending HTTPBasicAuthEnable=true...");
                                  });
                                  sendAuthProvisionChangeConfiguration(out,"HTTPBasicAuthEnable","true",3);
                                  continue;
                              }

                              if (authProvisionStage==3) {
                                  appendLog("AUTH PROVISION HTTPBasicAuthEnable CALLRESULT status="+status);
                                  if (!"Accepted".equalsIgnoreCase(status)) {
                                      authProvisionStage=90;
                                      runOnUiThread(() -> {
                                          if (authDiagStatus!=null) authDiagStatus.setText(
                                                  "AuthorizationKey: ACCEPTED\n"
                                                  +"HTTPBasicAuthEnable result: "+status
                                                  +"\nProvisioning stopped because Basic Auth enable was not Accepted.");
                                      });
                                      continue;
                                  }

                                  authProvisionStage=4;
                                  authProvisionRequestId="";
                                  appendLog("AUTH PROVISION BOTH ACCEPTED. Closing WebSocket to force authenticated reconnect.");
                                  runOnUiThread(() -> {
                                      if (authDiagStatus!=null) authDiagStatus.setText(
                                              "AuthorizationKey: ACCEPTED\n"
                                              +"HTTPBasicAuthEnable: ACCEPTED\n"
                                              +"Step 4/4: forcing WebSocket reconnect...\n\n"
                                              +"The NEXT HTTP WebSocket handshake must carry Authorization: Basic. If it does not, EMOS will record NO_HEADER and issue a 401 challenge.");
                                  });
                                  Thread.sleep(450);
                                  writeWsFrame(out,0x8,new byte[]{0x03,(byte)0xE8});
                                  return;
                              }
                              continue;
                          }

                          if (type==4 && msg.length()>=4) { // CALLERROR
                              String id=msg.optString(1,"");
                              if (id.equals(authProvisionRequestId)) {
                                  String code=msg.optString(2,"");
                                  String desc=msg.optString(3,"");
                                  appendLog("AUTH PROVISION CALLERROR stage="+authProvisionStage
                                          +" code="+code+" desc="+desc);
                                  authProvisionStage=90;
                                  runOnUiThread(() -> {
                                      if (authDiagStatus!=null) authDiagStatus.setText(
                                              "OCPP provisioning CALLERROR: "+code+" • "+desc);
                                  });
                              }
                          }
                      }
                  } catch(Exception e) {
                      if (authDiagRunning) appendLog("AUTH PROVISION client closed: "+safeError(e));
                  } finally {
                      // If ABB restarts the socket while applying a setting before EMOS receives
                      // the CALLRESULT, resend the same idempotent ChangeConfiguration on the next
                      // BootNotification rather than becoming stuck in a waiting stage.
                      if (authDiagRunning) {
                          if (authProvisionStage==1) {
                              authProvisionStage=0;
                              authProvisionRequestId="";
                              appendLog("AUTH PROVISION connection ended while waiting AuthorizationKey result; will resend on next BootNotification.");
                          } else if (authProvisionStage==3) {
                              authProvisionStage=2;
                              authProvisionRequestId="";
                              appendLog("AUTH PROVISION connection ended while waiting HTTPBasicAuthEnable result; will resend on next BootNotification.");
                          }
                      }
                  }
              }

              private void sendAuthProvisionChangeConfiguration(OutputStream out,String key,String value,int waitingStage) throws Exception {
                  String id="emos54-"+waitingStage+"-"+Long.toHexString(System.currentTimeMillis());
                  JSONObject payload=new JSONObject();
                  payload.put("key",key);
                  payload.put("value",value);
                  JSONArray call=new JSONArray();
                  call.put(2);
                  call.put(id);
                  call.put("ChangeConfiguration");
                  call.put(payload);

                  authProvisionRequestId=id;
                  authProvisionStage=waitingStage;
                  writeWsFrame(out,0x1,call.toString().getBytes(StandardCharsets.UTF_8));

                  if ("AuthorizationKey".equals(key)) {
                      appendLog("AUTH PROVISION OCPP TX ChangeConfiguration AuthorizationKey=<hidden HEX> hexChars="+value.length()+" id="+id);
                  } else {
                      appendLog("AUTH PROVISION OCPP TX ChangeConfiguration "+key+"="+value+" id="+id);
                  }
              }

              static class AuthDiagDecoded {
                  boolean present;
                  String username="";
                  String password="";
                  String passwordHex="";
                  int passwordBytes=0;
              }

              static class WsFrame {
                  int opcode;
                  byte[] payload;
              }

              private AuthDiagDecoded decodeBasicAuth(String header) {
                  AuthDiagDecoded r=new AuthDiagDecoded();
                  if (header==null || header.trim().isEmpty()) return r;
                  String h=header.trim();
                  if (!h.regionMatches(true,0,"Basic ",0,6)) return r;
                  try {
                      byte[] raw=Base64.decode(h.substring(6).trim(),Base64.DEFAULT);
                      String decoded=new String(raw,StandardCharsets.UTF_8);
                      int p=decoded.indexOf(':');
                      r.present=true;
                      r.username=p>=0?decoded.substring(0,p):decoded;
                      r.password=p>=0?decoded.substring(p+1):"";
                      byte[] pass=r.password.getBytes(StandardCharsets.UTF_8);
                      r.passwordBytes=pass.length;
                      r.passwordHex=bytesToHexAscii(pass);
                  } catch(Exception ignored) {}
                  return r;
              }

              private String readHttpHeader(InputStream in,int max) throws Exception {
                  ByteArrayOutputStream b=new ByteArrayOutputStream();
                  int state=0;
                  while(b.size()<max) {
                      int x=in.read();
                      if (x<0) break;
                      b.write(x);
                      if (state==0 && x=='\r') state=1;
                      else if (state==1 && x=='\n') state=2;
                      else if (state==2 && x=='\r') state=3;
                      else if (state==3 && x=='\n') break;
                      else state=(x=='\r')?1:0;
                  }
                  return b.toString("ISO-8859-1");
              }

              private WsFrame readWsFrame(InputStream in) throws Exception {
                  int b0=in.read();
                  if (b0<0) return null;
                  int b1=in.read();
                  if (b1<0) return null;
                  int opcode=b0&0x0f;
                  boolean masked=(b1&0x80)!=0;
                  long len=b1&0x7f;
                  if (len==126) len=((long)readRequired(in)<<8)|readRequired(in);
                  else if (len==127) {
                      len=0;
                      for(int i=0;i<8;i++) len=(len<<8)|readRequired(in);
                  }
                  if (len<0 || len>1024*1024) throw new Exception("WebSocket frame too large: "+len);
                  byte[] mask=masked?readExact(in,4):null;
                  byte[] payload=readExact(in,(int)len);
                  if (masked) for(int i=0;i<payload.length;i++) payload[i]=(byte)(payload[i]^mask[i%4]);
                  WsFrame f=new WsFrame();
                  f.opcode=opcode;
                  f.payload=payload;
                  return f;
              }

              private int readRequired(InputStream in) throws Exception {
                  int x=in.read();
                  if (x<0) throw new EOFException("Unexpected end of WebSocket stream");
                  return x&0xff;
              }

              private byte[] readExact(InputStream in,int len) throws Exception {
                  byte[] b=new byte[len];
                  int p=0;
                  while(p<len) {
                      int n=in.read(b,p,len-p);
                      if (n<0) throw new EOFException("Unexpected end of stream");
                      p+=n;
                  }
                  return b;
              }

              private void writeWsFrame(OutputStream out,int opcode,byte[] payload) throws Exception {
                  if (payload==null) payload=new byte[0];
                  ByteArrayOutputStream b=new ByteArrayOutputStream();
                  b.write(0x80|(opcode&0x0f));
                  int len=payload.length;
                  if (len<126) b.write(len);
                  else if (len<=65535) {
                      b.write(126); b.write((len>>8)&0xff); b.write(len&0xff);
                  } else {
                      b.write(127);
                      long l=len;
                      for(int i=7;i>=0;i--) b.write((int)((l>>(8*i))&0xff));
                  }
                  b.write(payload);
                  out.write(b.toByteArray());
                  out.flush();
              }

              private String utcIsoNow() {
                  SimpleDateFormat f=new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'",Locale.US);
                  f.setTimeZone(TimeZone.getTimeZone("UTC"));
                  return f.format(new Date());
              }

              private String buildDiagOcppReply(String text) {
                  try {
                      JSONArray a=new JSONArray(text);
                      if (a.length()<3 || a.optInt(0,-1)!=2) return null;
                      String id=a.optString(1,"");
                      String action=a.optString(2,"");
                      JSONObject payload=new JSONObject();
                      if ("BootNotification".equals(action)) {
                          payload.put("status","Accepted");
                          payload.put("currentTime",utcIsoNow());
                          payload.put("interval",300);
                      } else if ("Heartbeat".equals(action)) {
                          payload.put("currentTime",utcIsoNow());
                      }
                      JSONArray r=new JSONArray();
                      r.put(3); r.put(id); r.put(payload);
                      return r.toString();
                  } catch(Exception e) {
                      appendLog("AUTH DIAG OCPP parse warning: "+safeError(e));
                      return null;
                  }
              }

              private void writeOcppEndpointOnly(String url,String cp,String plainKey,Runnable onOk) throws Exception {
                  final String k=plainKey==null?"":plainKey;
                  byte[] payload=buildOcppPayload(url,cp,k,2);
                  appendLog("AUTH PROVISION TX D6 temporary endpoint="+url+" id="+cp
                          +" keyLen="+k.getBytes(StandardCharsets.UTF_8).length
                          +" auth="+(k.isEmpty()?"off":"on")+" value=<hidden plain>");
                  sendEncrypted(CMD_OCPP,payload,p -> {
                      try {
                          requirePacketOk(p,"Auth diagnostic OCPP endpoint");
                          if (p.payload==null || p.payload.length<1 || (p.payload[0]&0xff)!=1)
                              throw new Exception("D6 endpoint rejected payload="+hex(p.payload));
                          appendLog("AUTH PROVISION D6 endpoint accepted: "+url+" with keyLen="
                                  +k.getBytes(StandardCharsets.UTF_8).length);
                          if (!k.isEmpty()) {
                              setHttpBasicAuthEnableForDiagnostic(true,0,onOk);
                          } else if (onOk!=null) onOk.run();
                      } catch(Exception e) {
                          appendLog("AUTH PROVISION D6 ERROR: "+safeError(e));
                          if (authDiagStatus!=null) authDiagStatus.setText("Temporary endpoint failed: "+safeError(e));
                      }
                  });
              }

              private void setHttpBasicAuthEnableForDiagnostic(boolean enable,int attempt,Runnable onDone) {
                  final String[] names=new String[]{"http_basic_auth_enable","HTTPBasicAuthEnable"};
                  if (attempt>=names.length) {
                      appendLog("AUTH DIAG HTTPBasicAuthEnable write attempts complete.");
                      if (onDone!=null) onDone.run();
                      return;
                  }
                  final String configKey=names[attempt];
                  try {
                      JSONObject root=new JSONObject();
                      JSONArray arr=new JSONArray();
                      arr.put(51);
                      arr.put(enable?1:0);
                      root.put(configKey,arr);
                      byte[] json=root.toString().getBytes(StandardCharsets.UTF_8);
                      byte[] payload=concat(new byte[]{0x02},json);
                      appendLog("AUTH DIAG TX C5 "+configKey+"="+(enable?1:0));
                      sendEncrypted(CMD_READ_CONFIGURATION,payload,p -> {
                          try {
                              requirePacketOk(p,"Auth diagnostic C5 "+configKey);
                              appendLog("AUTH DIAG RX C5 "+configKey+" payload="+hex(p.payload));
                          } catch(Exception e) {
                              appendLog("AUTH DIAG C5 "+configKey+" warning: "+safeError(e));
                          }
                          main.postDelayed(() -> setHttpBasicAuthEnableForDiagnostic(enable,attempt+1,onDone),220);
                      });
                  } catch(Exception e) {
                      appendLog("AUTH DIAG C5 build warning: "+safeError(e));
                      main.postDelayed(() -> setHttpBasicAuthEnableForDiagnostic(enable,attempt+1,onDone),220);
                  }
              }

              private void restoreOcppAfterAuthDiagnostic() {
                  if (!authenticated) {
                      toast("Reconnect/authenticate charger first, then press RESTORE ORIGINAL OCPP URL.");
                      return;
                  }
                  String original=authDiagOriginalUrl;
                  if (original==null || original.trim().isEmpty()) original=readSecure(profileKey("auth_diag_original_url"));
                  if (original==null || original.trim().isEmpty()) original=serverUrl.getText().toString().trim();
                  final String target=original;
                  final String cp=!lastReadOcppChargerId.isEmpty()
                          ?lastReadOcppChargerId
                          :chargePointId.getText().toString().trim();
                  if (target.isEmpty() || cp.isEmpty()) {
                      toast("Original OCPP URL / Charger ID unavailable.");
                      return;
                  }
                  try {
                      String restoreKey=authDiagExpectedPlain;
                      if (restoreKey==null || restoreKey.isEmpty()) restoreKey=authKey==null?"":authKey.getText().toString();
                      if ((restoreKey==null || restoreKey.isEmpty()) && deviceNumber!=null && !deviceNumber.isEmpty())
                          restoreKey=readProfile("auth_key");
                      final String finalRestoreKey=restoreKey==null?"":restoreKey;
                      writeOcppEndpointOnly(target,cp,finalRestoreKey,() -> {
                          appendLog("AUTH DIAG RESTORE OK target="+target+" keyLen="
                                  +finalRestoreKey.getBytes(StandardCharsets.UTF_8).length);
                          if (authDiagStatus!=null) authDiagStatus.setText("Original OCPP URL restored: "+target
                                  +"\nAuthKey was preserved/re-written with the same plain value; local listener stopped.");
                          stopLocalAuthDiagnostic(false);
                          setStatus("OCPP URL RESTORED",target);
                      });
                  } catch(Exception e) {
                      appendLog("AUTH DIAG RESTORE ERROR: "+safeError(e));
                      toast("Restore failed: "+safeError(e));
                  }
              }

              private void stopLocalAuthDiagnostic(boolean clearSavedOriginal) {
                  authDiagRunning=false;
                  ServerSocket ss=authDiagServer;
                  authDiagServer=null;
                  if (ss!=null) try { ss.close(); } catch(Exception ignored) {}
                  if (clearSavedOriginal && deviceNumber!=null && !deviceNumber.isEmpty())
                      try { writeSecure(profileKey("auth_diag_original_url"),""); } catch(Exception ignored) {}
                  authProvisionStage=0;
                  authProvisionRequestId="";
                  authProvisionUnauthReconnects=0;
                  appendLog("AUTH PROVISION listener stopped");
              }

              private String printableUtf8(byte[] payload) {
                  if (payload==null || payload.length==0) return "";
                  String x=new String(payload,StandardCharsets.UTF_8).trim();
                  int printable=0;
                  for(int i=0;i<x.length();i++) {
                      char c=x.charAt(i);
                      if (c=='\n' || c=='\r' || c=='\t' || (c>=32 && c<127)) printable++;
                  }
                  return x.length()>0 && printable*100/x.length()>=80 ? x : "";
              }

              private String findConfigValue(JSONObject j,String key) {
                  try {
                      if (j.has(key) && !j.isNull(key)) {
                          Object v=j.get(key);
                          if (v instanceof JSONArray) {
                              JSONArray a=(JSONArray)v;
                              if (a.length()>0) return String.valueOf(a.get(a.length()-1));
                          }
                          return String.valueOf(v);
                      }
                      Iterator<String> it=j.keys();
                      while(it.hasNext()) {
                          Object child=j.opt(it.next());
                          if (child instanceof JSONObject) {
                              String x=findConfigValue((JSONObject)child,key);
                              if (!x.isEmpty()) return x;
                          }
                      }
                  } catch(Exception ignored) {}
                  return "";
              }

              private String buildOcppUrlFromRead(String domain,int port,int tls) {
                  if (domain==null) domain="";
                  domain=domain.trim();
                  if (domain.isEmpty()) return "";

                  String url=domain;
                  if (!(url.startsWith("ws://") || url.startsWith("wss://"))) {
                      url=(tls==1?"wss://":"ws://")+url;
                  }

                  try {
                      java.net.URI uri=new java.net.URI(url);
                      if (uri.getPort()>=0 || port<=0) return url;

                      String scheme=uri.getScheme()==null?(tls==1?"wss":"ws"):uri.getScheme();
                      String host=uri.getHost();

                      if (host==null || host.isEmpty()) return url;

                      StringBuilder x=new StringBuilder();
                      x.append(scheme).append("://").append(host).append(":").append(port);

                      if (uri.getRawPath()!=null) x.append(uri.getRawPath());
                      if (uri.getRawQuery()!=null) x.append("?").append(uri.getRawQuery());
                      return x.toString();

                  } catch(Exception ignored) {
                      if (port>0 && !url.matches(".*:\\\\d+(/.*)?$"))
                          return url+":"+port;
                      return url;
                  }
              }

              private String profileKey(String suffix) {
                  return "charger_profile_"+deviceNumber+"_"+suffix;
              }

              private void saveLocalProfile() {
                  try {
                      writeSecure(profileKey("conn_type"),
                              String.valueOf(connectionType.getSelectedItemPosition()));
                      writeSecure(profileKey("wifi_ssid"),
                              wifiSsid.getText().toString());
                      writeSecure(profileKey("wifi_password"),
                              wifiPassword.getText().toString());
                      writeSecure(profileKey("charger_id"),
                              chargePointId.getText().toString().trim());
                      writeSecure(profileKey("ocpp_url"),
                              serverUrl.getText().toString().trim());
                      writeSecure(profileKey("auth_key"),
                              authKey.getText().toString());
                      writeSecure(profileKey("requires_password"),
                              requiresPassword.isChecked()?"1":"0");

                      appendLog("Encrypted local profile saved for "+deviceNumber
                              +" (secrets not logged).");
                  } catch(Exception e) {
                      appendLog("Local profile save warning: "+safeError(e));
                  }
              }

              private String readProfile(String suffix) {
                  if (deviceNumber==null || deviceNumber.isEmpty()) return "";
                  return readSecure(profileKey(suffix));
              }

              private void loadLocalProfile() {
                  if (Looper.myLooper()!=Looper.getMainLooper()) {
                      main.post(this::loadLocalProfile);
                      return;
                  }

                  if (deviceNumber==null || deviceNumber.isEmpty()) return;

                  String conn=readProfile("conn_type");
                  String ssid=readProfile("wifi_ssid");
                  String wifiPass=readProfile("wifi_password");
                  String cp=readProfile("charger_id");
                  String url=readProfile("ocpp_url");
                  String key=readProfile("auth_key");
                  String req=readProfile("requires_password");

                  try {
                      if (!conn.isEmpty()) {
                          int pos=Integer.parseInt(conn);
                          if (pos==0 || pos==1) connectionType.setSelection(pos);
                      }
                  } catch(Exception ignored) {}

                  if (!ssid.isEmpty()) wifiSsid.setText(ssid);
                  if (!wifiPass.isEmpty()) wifiPassword.setText(wifiPass);
                  if (!cp.isEmpty()) chargePointId.setText(cp);
                  if (!url.isEmpty()) setServerUrlValue(url);
                  if (!key.isEmpty()) authKey.setText(key);
                  if (!req.isEmpty()) requiresPassword.setChecked("1".equals(req));

                  appendLog("Encrypted local profile loaded for "+deviceNumber
                          +" (password/AuthKey hidden from log).");
              }

              private byte[] buildOcppPayload(String fullUrl,String chargerId,
                      String securityKeyText,int variant) throws Exception {
                  java.net.URI uri=new java.net.URI(fullUrl);
                  String scheme=uri.getScheme();
                  String host=uri.getHost();
                  if (scheme==null || host==null) throw new Exception("Invalid OCPP URL.");

                  boolean tls="wss".equalsIgnoreCase(scheme);
                  int port=uri.getPort();
                  if (port<=0) port=tls?443:80;

                  // The builder still understands the historical layouts for diagnostics,
                  // but FINAL FW 2.1.0 apply logic sends variant 2 only because it is the
                  // only layout repeatedly verified to persist ws://local-CSMS + Charger ID.
                  int serverEnable=(variant==2 || variant==3)?0:1;
                  String protocolVersion=(variant==2 || variant==3)?"ocpp1.6j":"ocpp16j";
                  boolean includeTag=(variant==0 || variant==2);

                  byte[] domainBytes=fullUrl.getBytes(StandardCharsets.UTF_8);

                  // D6 is only responsible for endpoint/identity in the final flow.
                  // AuthorizationKey is provisioned later through OCPP ChangeConfiguration.
                  byte[] keyBytes=securityKeyText.isEmpty()
                          ?new byte[0]
                          :securityKeyText.getBytes(StandardCharsets.UTF_8);
                  byte[] tag=chargerId.getBytes(StandardCharsets.UTF_8);

                  appendLog("D6 STRUCT variant="+variant
                          +" serverEnable="+serverEnable
                          +" domainLen="+domainBytes.length
                          +" port="+port
                          +" protocolType=1"
                          +" protocolVersion="+protocolVersion
                          +" keyLen="+keyBytes.length
                          +" tls="+(tls?1:0)
                          +" includeTag="+includeTag
                          +(includeTag?" tagLen="+tag.length+" tag="+chargerId:""));

                  if (domainBytes.length>255 || keyBytes.length>255 || tag.length>255)
                      throw new Exception("OCPP field too long.");

                  ByteArrayOutputStream out=new ByteArrayOutputStream();
                  out.write(serverEnable);
                  out.write(domainBytes.length);
                  out.write(domainBytes);
                  out.write(leShort(port));
                  out.write(1); // protocolType OCPP in observed Terra AC D6 implementation

                  byte[] protocol=new byte[10];
                  byte[] pv=protocolVersion.getBytes(StandardCharsets.UTF_8);
                  System.arraycopy(pv,0,protocol,0,Math.min(protocol.length,pv.length));
                  out.write(protocol);

                  out.write(keyBytes.length);
                  if (keyBytes.length>0) out.write(keyBytes);

                  out.write(tls?1:0);
                  if (tls) {
                      out.write(0);
                      out.write(leInt(0));
                      out.write(leShort(512));
                  }

                  if (includeTag) {
                      out.write(tag.length);
                      out.write(tag);
                  }
                  return out.toByteArray();
              }

              private String bytesToHexAscii(byte[] data) {
                  if (data==null || data.length==0) return "";
                  final char[] HEX="0123456789ABCDEF".toCharArray();
                  char[] out=new char[data.length*2];
                  for (int i=0;i<data.length;i++) {
                      int v=data[i]&0xff;
                      out[i*2]=HEX[v>>>4];
                      out[i*2+1]=HEX[v&0x0f];
                  }
                  return new String(out);
              }

              private void verifySession() {
                  if (!authenticated) { toast("Authenticate charger first."); return; }
                  querySysInfo();
              }

              private void sendPlain(int cmd,byte[] payload,PacketCallback cb) {
                  try {
                      byte[] packet=plainWrap(cmd,payload);
                      armResponse(cmd,cb);
                      appendLog("TX PLAIN cmd=0x"+hexByte(cmd)+" bytes="+packet.length);
                      queuePacket(packet);
                  } catch(Exception e) { dispatchError(cmd,cb,e); }
              }

              private void sendEncrypted(int cmd,byte[] payload,PacketCallback cb) {
                  try {
                      if (!encryptedMode) throw new Exception("Encrypted session is not active.");
                      byte[] packet=encryptedWrap(cmd,payload);
                      armResponse(cmd,cb);
                      appendLog("TX SECURE cmd=0x"+hexByte(cmd)+" bytes="+packet.length);
                      queuePacket(packet);
                  } catch(Exception e) { dispatchError(cmd,cb,e); }
              }

              private long responseTimeoutMs(int cmd) {
                  // FW 2.1.0 can take ~21 seconds to answer D2 while applying Wi-Fi.
                  // All normal BLE commands keep the original 10 second timeout.
                  if (cmd==CMD_WIFI_CONFIG) return 40000L;
                  return 10000L;
              }

              private void armResponse(int cmd,PacketCallback cb) {
                  waitingCmd=cmd;
                  waitingCallback=cb;
                  if (responseTimeout!=null) main.removeCallbacks(responseTimeout);
                  final long timeoutMs=responseTimeoutMs(cmd);
                  responseTimeout=() -> {
                      if (waitingCallback!=null && waitingCmd==cmd) {
                          PacketCallback x=waitingCallback;
                          waitingCallback=null;
                          waitingCmd=-1;
                          Packet p=new Packet();
                          p.cmd=cmd;p.code=-1;p.error="Response timeout after "+(timeoutMs/1000)+"s";
                          x.onPacket(p);
                      }
                  };
                  main.postDelayed(responseTimeout,timeoutMs);
              }

              private void dispatchError(int cmd,PacketCallback cb,Exception e) {
                  Packet p=new Packet();
                  p.cmd=cmd;
                  p.code=-1;
                  p.error=safeError(e);

                  if (cb!=null) {
                      main.post(() -> {
                          try {
                              cb.onPacket(p);
                          } catch(Exception callbackError) {
                              appendLog("CALLBACK ERROR: "+safeError(callbackError));
                              failStatus("Protocol callback failed",safeError(callbackError));
                          }
                      });
                  }
              }

              private byte[] plainWrap(int cmd,byte[] payload) {
                  if (payload==null) payload=new byte[0];
                  byte[] token=sessionToken==null?new byte[8]:sessionToken;
                  byte[] frame=new byte[16+payload.length];
                  frame[0]=(byte)((cmd==0xBA || cmd==0xD9)?0xAA:0xFE);
                  frame[1]=(byte)cmd;
                  frame[2]=0;frame[3]=0;
                  frame[4]=(byte)(payload.length&0xff);
                  frame[5]=(byte)((payload.length>>8)&0xff);
                  frame[6]=0;
                  System.arraycopy(token,0,frame,8,Math.min(8,token.length));
                  System.arraycopy(payload,0,frame,16,payload.length);

                  int xor=0;
                  for(int i=0;i<7;i++) xor^=frame[i]&0xff;for(int i=8;i<frame.length;i++) xor^=frame[i]&0xff;
                  frame[7]=(byte)xor;
                  return frame;
              }

              private byte[] encryptedWrap(int cmd,byte[] payload) throws Exception {
                  if (encryptionKey==null || encryptionKey.length!=16) throw new Exception("Encryption key unavailable.");
                  if (cipherInfo==null || cipherInfo.length!=16) throw new Exception("Cipher info unavailable.");
                  if (payload==null) payload=new byte[0];

                  byte[] plain=concat(sessionToken,payload);
                  byte[] aad=buildAad();
                  byte[] iv=new byte[12];
                  rng.nextBytes(iv);

                  Cipher cipher=Cipher.getInstance("AES/GCM/NoPadding");
                  cipher.init(Cipher.ENCRYPT_MODE,new SecretKeySpec(encryptionKey,"AES"),new GCMParameterSpec(128,iv));
                  cipher.updateAAD(aad);
                  byte[] encrypted=cipher.doFinal(plain);
                  int cipherLen=encrypted.length-16;
                  byte[] cipherText=Arrays.copyOfRange(encrypted,0,cipherLen);
                  byte[] tag=Arrays.copyOfRange(encrypted,cipherLen,encrypted.length);

                  // Captured TerraConfig 3.5.0 framing:
                  // 0xFE authentication request = ciphertext + AAD(22) + IV(12) + TAG(16) + cipherInfo(16)
                  // normal secure request        = ciphertext + IV(12) + TAG(16)
                  byte[] body=(cmd==CMD_AUTH)
                          ? concat(cipherText,aad,iv,tag,cipherInfo)
                          : concat(cipherText,iv,tag);
                  byte[] frame=new byte[8+body.length];
                  frame[0]=(byte)((cmd==0xBA || cmd==0xD9)?0xAA:0xFE);
                  frame[1]=(byte)cmd;
                  frame[2]=0;frame[3]=0;
                  frame[4]=(byte)(body.length&0xff);
                  frame[5]=(byte)((body.length>>8)&0xff);
                  frame[6]=(byte)0xA5;
                  System.arraycopy(body,0,frame,8,body.length);

                  int xor=0;
                  for(int i=0;i<7;i++) xor^=frame[i]&0xff;
                  for(byte b:body) xor^=b&0xff;
                  frame[7]=(byte)xor;
                  appendLog("SECURE FRAME cmd=0x"+hexByte(cmd)+" body="+body.length
                          +(cmd==CMD_AUTH?" auth-layout":" normal-layout"));
                  return frame;
              }

              private void onRx(byte[] part) {
                  if (part==null || part.length==0) return;
                  try {
                      rxBuffer.write(part);
                      byte[] all=rxBuffer.toByteArray();

                      while(all.length>=8) {
                          int start=0;
                          while(start<all.length && (all[start]&0xff)!=0xFE && (all[start]&0xff)!=0xAA) start++;
                          if (start>0) all=Arrays.copyOfRange(all,start,all.length);
                          if (all.length<8) break;

                          int len=(all[4]&0xff)|((all[5]&0xff)<<8);
                          boolean enc=(all[6]&0xff)==0xA5;
                          int total=enc?8+len:16+len;
                          if (all.length<total) break;

                          byte[] frame=Arrays.copyOfRange(all,0,total);
                          all=Arrays.copyOfRange(all,total,all.length);
                          Packet p=parseFrame(frame,enc);
                          appendLog("RX "+(enc?"SECURE":"PLAIN")+" cmd=0x"+hexByte(p.cmd)
                                  +" code="+p.code+" payload="+hex(p.payload)
                                  +(p.error==null?"":" error="+p.error));

                          if (waitingCallback!=null && waitingCmd==p.cmd) {
                              if (responseTimeout!=null) main.removeCallbacks(responseTimeout);

                              final PacketCallback cb=waitingCallback;
                              final Packet response=p;
                              waitingCallback=null;
                              waitingCmd=-1;

                              // BluetoothGattCallback is normally delivered on a Binder thread.
                              // Every higher-level protocol callback is moved to the main thread
                              // so UI read/write and the automatic read-back flow are safe.
                              main.post(() -> {
                                  try {
                                      cb.onPacket(response);
                                  } catch(Exception callbackError) {
                                      appendLog("CALLBACK ERROR: "+safeError(callbackError));
                                      failStatus("Protocol callback failed",safeError(callbackError));
                                  }
                              });
                          }
                      }

                      rxBuffer.reset();
                      rxBuffer.write(all);
                  } catch(Exception e) { appendLog("RX parse error: "+safeError(e)); }
              }

              private Packet parseFrame(byte[] frame,boolean encrypted) {
                  Packet p=new Packet();
                  p.encrypted=encrypted;
                  try {
                      p.cmd=frame[1]&0xff;
                      p.code=frame[2]&0xff;
                      int len=(frame[4]&0xff)|((frame[5]&0xff)<<8);

                      int xor=0;
                      for(int i=0;i<7;i++) xor^=frame[i]&0xff;
                      for(int i=8;i<frame.length;i++) xor^=frame[i]&0xff;
                      if ((frame[7]&0xff)!=(xor&0xff))
                          throw new Exception("Checksum mismatch.");

                      if (!encrypted) {
                          if (frame.length<16+len) throw new Exception("Plain frame incomplete.");
                          p.token=Arrays.copyOfRange(frame,8,16);
                          p.payload=Arrays.copyOfRange(frame,16,16+len);
                          return p;
                      }

                      // Even an error response can have no decryptable body.
                      if (p.code!=0) {
                          p.payload=Arrays.copyOfRange(frame,8,Math.min(frame.length,8+len));
                          return p;
                      }

                      byte[] body=Arrays.copyOfRange(frame,8,8+len);
                      byte[] aad=buildAad();
                      byte[] cipherText;
                      byte[] iv;
                      byte[] tag;

                      if (p.cmd==CMD_AUTH) {
                          // TerraConfig secure-auth response:
                          // ciphertext + AAD(22) + IV(12) + TAG(16)
                          final int overhead=50;
                          if (body.length<overhead)
                              throw new Exception("Secure auth response too short: "+body.length);

                          int cipherLen=body.length-overhead;
                          cipherText=Arrays.copyOfRange(body,0,cipherLen);
                          byte[] receivedAad=Arrays.copyOfRange(body,cipherLen,cipherLen+22);
                          iv=Arrays.copyOfRange(body,cipherLen+22,cipherLen+34);
                          tag=Arrays.copyOfRange(body,cipherLen+34,cipherLen+50);

                          if (!Arrays.equals(receivedAad,aad))
                              throw new Exception("Secure auth AAD mismatch.");
                      } else {
                          // Normal secure response:
                          // ciphertext + IV(12) + TAG(16)
                          final int overhead=28;
                          if (body.length<overhead)
                              throw new Exception("Secure response too short: "+body.length);

                          int cipherLen=body.length-overhead;
                          cipherText=Arrays.copyOfRange(body,0,cipherLen);
                          iv=Arrays.copyOfRange(body,cipherLen,cipherLen+12);
                          tag=Arrays.copyOfRange(body,cipherLen+12,cipherLen+28);
                      }

                      Cipher c=Cipher.getInstance("AES/GCM/NoPadding");
                      c.init(Cipher.DECRYPT_MODE,new SecretKeySpec(encryptionKey,"AES"),
                              new GCMParameterSpec(128,iv));
                      c.updateAAD(aad);

                      byte[] plain=c.doFinal(concat(cipherText,tag));
                      if (plain.length<8)
                          throw new Exception("Decrypted payload shorter than session token.");

                      p.token=Arrays.copyOfRange(plain,0,8);
                      p.payload=Arrays.copyOfRange(plain,8,plain.length);
                  } catch(Exception e) {
                      p.code=-1;
                      p.error=safeError(e);
                  }
                  return p;
              }

              private byte[] buildAad() throws Exception {
                  if (deviceNumber.isEmpty()) throw new Exception("Device number unavailable.");
                  if (firmwareVersion.isEmpty()) throw new Exception("Firmware version unavailable.");

                  byte[] aad=new byte[22];
                  byte[] dn=deviceNumber.getBytes(StandardCharsets.UTF_8);
                  System.arraycopy(dn,0,aad,0,Math.min(20,dn.length));

                  String digits=firmwareVersion.replace(".","");
                  short fw;
                  try { fw=Short.parseShort(digits); }
                  catch(Exception e) { throw new Exception("Invalid firmware version: "+firmwareVersion); }

                  aad[20]=(byte)(fw&0xff);
                  aad[21]=(byte)((fw>>8)&0xff);
                  return aad;
              }

              private void requirePacketOk(Packet p,String step) throws Exception {
                  if (p==null) throw new Exception(step+": no response.");
                  if (p.error!=null) throw new Exception(step+": "+p.error);
                  if (p.code!=0) {
                      String meaning=p.code==17?"parse error":
                              p.code==18?"no permission":
                              p.code==19?"service refused":
                              p.code==20?"command does not exist":
                              p.code==21?"command not supported":
                              p.code==22?"token timeout":
                              p.code==80?"device internal error":
                              p.code==81?"command execution failed":"unknown";
                      throw new Exception(step+": response code "+p.code+" ("+meaning+")");
                  }
              }

              private void queuePacket(byte[] packet) {
                  txChunks.clear();
                  int chunk=Math.max(20,Math.min(180,mtu-3));
                  for(int i=0;i<packet.length;i+=chunk)
                      txChunks.add(Arrays.copyOfRange(packet,i,Math.min(packet.length,i+chunk)));
                  txBusy=false;
                  sendNextChunk();
              }

              private void sendNextChunk() {
                  if (txBusy || txChunks.isEmpty() || gatt==null || tx==null) return;
                  byte[] bytes=txChunks.poll();
                  txBusy=true;
                  try {
                      if (Build.VERSION.SDK_INT>=33) {
                          int r=gatt.writeCharacteristic(tx,bytes,BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT);
                          if (r!=BluetoothStatusCodes.SUCCESS) {
                              txBusy=false;
                              failStatus("BLE write error","status="+r);
                          }
                      } else {
                          tx.setWriteType(BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT);
                          tx.setValue(bytes);
                          if (!gatt.writeCharacteristic(tx)) {
                              txBusy=false;
                              failStatus("BLE write rejected","");
                          }
                      }
                  } catch(Exception e) {
                      txBusy=false;
                      failStatus("BLE write exception",safeError(e));
                  }
              }

              private void startScan() {
                  if (adapter==null) { failStatus("Bluetooth unavailable",""); return; }
                  if (!permOk()) { requestPerms(); return; }
                  if (!adapter.isEnabled()) { toast("Turn Bluetooth ON."); return; }

                  scanner=adapter.getBluetoothLeScanner();
                  if (scanner==null) { failStatus("BLE scanner unavailable",""); return; }

                  stopScan();
                  seen.clear();
                  firmwareByAddress.clear();
                  deviceList.removeAllViews();
                  deviceList.setVisibility(View.VISIBLE);
                  setStatus("Scanning","Looking for TACW chargers...");
                  try {
                      scanner.startScan(scanCallback);
                      main.postDelayed(this::stopScan,20000);
                  } catch(Exception e) { failStatus("Scan error",safeError(e)); }
              }

              private void stopScan() {
                  if (scanner!=null) try { scanner.stopScan(scanCallback); } catch(Exception ignored) {}
              }

              private void addDevice(BluetoothDevice d,String name,String address,int rssi,String fw) {
                  String extra=fw.isEmpty()?"":" • FW "+fw;
                  Button b=button(name+"\n"+address+" • RSSI "+rssi+" dBm"+extra,
                          Color.rgb(20,43,61),Color.WHITE);
                  b.setGravity(Gravity.START|Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(-1,dp(70));
                  lp.setMargins(0,dp(8),0,0);
                  deviceList.addView(b,lp);
                  b.setOnClickListener(v -> {
                      deviceNumber=name;
                      deviceAddress=address;
                      firmwareVersion=fw;
                      selectedDevice.setText(name+" • "+rssi+" dBm"+extra);
                      collapseDeviceList();
                      connect(d);
                  });
              }

              private void connect(BluetoothDevice d) {
                  stopScan();
                  collapseDeviceList();
                  disconnectGattOnly();
                  clearSession();
                  setStatus("Connecting",deviceNumber);
                  try {
                      gatt=Build.VERSION.SDK_INT>=23
                              ? d.connectGatt(this,false,gattCallback,BluetoothDevice.TRANSPORT_LE)
                              : d.connectGatt(this,false,gattCallback);
                  } catch(Exception e) { failStatus("BLE connect failed",safeError(e)); }
              }

              private void disconnect() {
                  stopScan();
                  disconnectGattOnly();
                  clearSession();
                  setStatus("Disconnected","Scan and select charger.");
                  updateButtons();
              }

              private void disconnectGattOnly() {
                  BluetoothGatt gg=gatt;
                  gatt=null;
                  if (gg!=null) {
                      try { gg.disconnect(); } catch(Exception ignored) {}
                      try { gg.close(); } catch(Exception ignored) {}
                  }
              }

              private void clearSession() {
                  transportReady=false;
                  authenticated=false;
                  authInProgress=false;
                  readInProgress=false;
                  encryptedMode=false;
                  internetReady=false;
                  expectedNetworkMode=0;
                  lastTcpIpSummary="";
                  tx=null;rx=null;
                  encryptionKey=null;
                  cipherInfo=null;
                  sessionToken=new byte[8];
                  clientNonce=null;
                  waitingCmd=-1;
                  waitingCallback=null;
                  if (responseTimeout!=null) main.removeCallbacks(responseTimeout);
                  txChunks.clear();
                  rxBuffer.reset();
              }

              private String http(String method,String endpoint,String contentType,String body,String bearer) throws Exception {
                  HttpURLConnection c=(HttpURLConnection)new URL(endpoint).openConnection();
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(20000);
                  c.setRequestMethod(method);
                  c.setRequestProperty("Accept","application/json");
                  c.setRequestProperty("X-APP-VERSION","3.5.0");
                  if (bearer!=null && !bearer.isEmpty()) c.setRequestProperty("Authorization","Bearer "+bearer);

                  if (body!=null) {
                      c.setDoOutput(true);
                      c.setRequestProperty("Content-Type",contentType==null?"application/json":contentType);
                      try(OutputStream os=c.getOutputStream()) {
                          os.write(body.getBytes(StandardCharsets.UTF_8));
                      }
                  }

                  int code=c.getResponseCode();
                  InputStream in=code>=200&&code<300?c.getInputStream():c.getErrorStream();
                  String text=readAll(in);
                  if (code<200 || code>=300) throw new HttpError(code,"HTTP "+code+" "+compact(text));
                  return text;
              }

              private SecretKey getOrCreateKey() throws Exception {
                  KeyStore ks=KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (ks.containsAlias(KEY_ALIAS)) {
                      return ((KeyStore.SecretKeyEntry)ks.getEntry(KEY_ALIAS,null)).getSecretKey();
                  }

                  KeyGenerator kg=KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES,"AndroidKeyStore");
                  kg.init(new KeyGenParameterSpec.Builder(KEY_ALIAS,
                          KeyProperties.PURPOSE_ENCRYPT|KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .build());
                  return kg.generateKey();
              }

              private void writeSecure(String name,String plain) throws Exception {
                  if (plain==null) plain="";
                  SecretKey key=getOrCreateKey();
                  Cipher c=Cipher.getInstance("AES/GCM/NoPadding");
                  c.init(Cipher.ENCRYPT_MODE,key);
                  byte[] iv=c.getIV();
                  byte[] encrypted=c.doFinal(plain.getBytes(StandardCharsets.UTF_8));
                  prefs.edit().putString(name,Base64.encodeToString(concat(iv,encrypted),Base64.NO_WRAP)).apply();
              }

              private String readSecure(String name) {
                  try {
                      String saved=prefs.getString(name,"");
                      if (saved==null || saved.isEmpty()) return "";
                      byte[] all=Base64.decode(saved,Base64.NO_WRAP);
                      if (all.length<13) return "";

                      byte[] iv=Arrays.copyOfRange(all,0,12);
                      byte[] encrypted=Arrays.copyOfRange(all,12,all.length);
                      Cipher c=Cipher.getInstance("AES/GCM/NoPadding");
                      c.init(Cipher.DECRYPT_MODE,getOrCreateKey(),new GCMParameterSpec(128,iv));
                      return new String(c.doFinal(encrypted),StandardCharsets.UTF_8);
                  } catch(Exception e) { return ""; }
              }

              private void deleteKey() throws Exception {
                  KeyStore ks=KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (ks.containsAlias(KEY_ALIAS)) ks.deleteEntry(KEY_ALIAS);
              }

              private static String firmwareFromScanRecord(byte[] record) {
                  try {
                      if (record==null) return "";
                      int pos=0;
                      while(pos<record.length) {
                          int len=record[pos]&0xff;
                          if (len==0) break;
                          if (pos+len>=record.length) break;
                          int type=record[pos+1]&0xff;
                          if (type==0xFF) {
                              int dataLen=len-1;
                              int start=pos+2;
                              if (dataLen>=5 && (record[start]&0xff)==0xFE) {
                                  int b3=record[start+3]&0xff;
                                  int b4=record[start+4]&0xff;
                                  if (b3==0x56) b3=0;
                                  if (b4==0x56) b4=0;
                                  int fw=b3|(b4<<8);
                                  String s=String.valueOf(fw);
                                  while(s.length()<3) s=s+"0";
                                  return s.substring(0,1)+"."+s.substring(1,2)+"."+s.substring(2);
                              }
                          }
                          pos+=len+1;
                      }
                  } catch(Exception ignored) {}
                  return "";
              }

              private void requestPerms() {
                  if (Build.VERSION.SDK_INT>=31)
                      requestPermissions(new String[]{Manifest.permission.BLUETOOTH_SCAN,Manifest.permission.BLUETOOTH_CONNECT},REQ_PERMS);
                  else if (Build.VERSION.SDK_INT>=23)
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION},REQ_PERMS);
              }

              private boolean permOk() {
                  if (Build.VERSION.SDK_INT>=31)
                      return checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN)==PackageManager.PERMISSION_GRANTED
                              && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)==PackageManager.PERMISSION_GRANTED;
                  return Build.VERSION.SDK_INT<23
                          || checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)==PackageManager.PERMISSION_GRANTED;
              }

