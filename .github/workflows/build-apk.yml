name: Build ABB Terra Direct Secure 3.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/elmecon/abbterra

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'ABBTerraDirectSecure'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.elmecon.abbterra'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.elmecon.abbterra'
                  minSdk 23
                  targetSdk 35
                  versionCode 320
                  versionName '3.2-direct-secure'
              }

              buildTypes {
                  release { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false"
                  android:label="ABB Terra Direct"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/elmecon/abbterra/MainActivity.java <<'EOF'
          package com.elmecon.abbterra;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.*;
          import android.bluetooth.le.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.*;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.text.InputFilter;
          import android.text.InputType;
          import android.util.Base64;
          import android.view.*;
          import android.widget.*;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.URLEncoder;
          import java.nio.charset.StandardCharsets;
          import java.security.KeyStore;
          import java.security.SecureRandom;
          import java.text.SimpleDateFormat;
          import java.util.*;

          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          import javax.crypto.spec.GCMParameterSpec;
          import javax.crypto.spec.SecretKeySpec;

          public class MainActivity extends Activity {
              private static final UUID FFF0 = UUID.fromString("0000fff0-0000-1000-8000-00805f9b34fb");
              private static final UUID FFF3 = UUID.fromString("0000fff3-0000-1000-8000-00805f9b34fb");
              private static final UUID FFF4 = UUID.fromString("0000fff4-0000-1000-8000-00805f9b34fb");
              private static final UUID CCCD = UUID.fromString("00002902-0000-1000-8000-00805f9b34fb");

              private static final int REQ_PERMS = 7201;
              private static final int CMD_AUTH = 0xFE;
              private static final int CMD_SYNC_TIME = 0xB0;
              private static final int CMD_SYSINFO = 0xB1;
              private static final int CMD_OCPP = 0xD6;
              private static final int CMD_OCPP_STATUS = 0xD8;

              private static final String API = "https://abb-installer.chargedot.com";
              // Official TerraConfig 3.5.0 mobile OAuth client constants.
              private static final String CLIENT_ID = "3710400e-1c02-4175-84ea-40a227c0dcf6";
              private static final String CLIENT_SECRET = "f1a6d022-8a8e-453c-862e-ba0d3c5b4521";
              private static final String KEY_ALIAS = "abb_terra_direct_token_v1";
              private static final String PREFS = "abb_terra_direct_secure";

              private final Handler main = new Handler(Looper.getMainLooper());
              private final SecureRandom rng = new SecureRandom();
              private final Set<String> seen = new HashSet<>();
              private final Map<String,String> firmwareByAddress = new HashMap<>();

              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic tx, rx;
              private int mtu = 158;
              private boolean transportReady = false;
              private boolean authenticated = false;
              private boolean encryptedMode = false;
              private String deviceNumber = "";
              private String deviceAddress = "";
              private String firmwareVersion = "";
              private int userId = 0;

              private byte[] encryptionKey;
              private byte[] cipherInfo;
              private byte[] sessionToken = new byte[8];
              private byte[] clientNonce;

              private final ByteArrayOutputStream rxBuffer = new ByteArrayOutputStream();
              private final ArrayDeque<byte[]> txChunks = new ArrayDeque<>();
              private boolean txBusy = false;
              private int waitingCmd = -1;
              private PacketCallback waitingCallback;
              private Runnable responseTimeout;

              private SharedPreferences prefs;

              private TextView statusTitle, statusDetail, selectedDevice, logText, adminStatus;
              private LinearLayout deviceList, progressBox, adminFields;
              private EditText chargerPin, chargePointId, serverUrl, authKey, adminEmail, adminPassword;
              private CheckBox requiresPassword;
              private Button scanBtn, authBtn, saveBtn, verifyBtn, disconnectBtn, adminToggle, adminLogin, adminClear;

              interface PacketCallback { void onPacket(Packet p); }

              static class Packet {
                  int cmd;
                  int code;
                  byte[] payload;
                  byte[] token;
                  boolean encrypted;
                  String error;
              }

              static class HttpError extends Exception {
                  final int code;
                  HttpError(int code, String msg) { super(msg); this.code = code; }
              }

              private final ScanCallback scanCallback = new ScanCallback() {
                  @Override public void onScanResult(int callbackType, ScanResult result) {
                      BluetoothDevice d = result.getDevice();
                      String addr = safeAddress(d);
                      if (addr == null || seen.contains(addr)) return;
                      String name = safeName(d);
                      if (name == null || !name.toUpperCase(Locale.US).startsWith("TACW")) return;

                      seen.add(addr);
                      byte[] raw = result.getScanRecord() == null ? null : result.getScanRecord().getBytes();
                      String fw = firmwareFromScanRecord(raw);
                      firmwareByAddress.put(addr, fw);
                      appendLog("SCAN " + name + " RSSI=" + result.getRssi()
                              + (fw.isEmpty() ? "" : " fw=" + fw));
                      runOnUiThread(() -> addDevice(d, name, addr, result.getRssi(), fw));
                  }

                  @Override public void onScanFailed(int errorCode) {
                      failStatus("BLE scan failed", "Code " + errorCode);
                  }
              };

              private final BluetoothGattCallback gattCallback = new BluetoothGattCallback() {
                  @Override public void onConnectionStateChange(BluetoothGatt gg, int status, int newState) {
                      appendLog("GATT state status=" + status + " state=" + newState);
                      if (status == BluetoothGatt.GATT_SUCCESS && newState == BluetoothProfile.STATE_CONNECTED) {
                          gatt = gg;
                          progress("Bluetooth", true, "GATT connected");
                          setStatus("Bluetooth connected", "Opening Terra configuration channel...");
                          try { gg.requestConnectionPriority(BluetoothGatt.CONNECTION_PRIORITY_HIGH); } catch(Exception ignored) {}
                          try { gg.requestMtu(247); } catch(Exception ignored) {}
                          main.postDelayed(() -> {
                              try { gg.discoverServices(); }
                              catch(Exception e) { failStatus("Service discovery failed", safeError(e)); }
                          }, 250);
                      } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                          clearSession();
                          progress("Bluetooth", false, "Disconnected");
                          progress("Secure session", false, "Not authenticated");
                          setStatus("Disconnected", "Scan and select charger.");
                          updateButtons();
                      }
                  }

                  @Override public void onMtuChanged(BluetoothGatt gg, int newMtu, int status) {
                      if (status == BluetoothGatt.GATT_SUCCESS) mtu = newMtu;
                      appendLog("MTU=" + newMtu + " status=" + status);
                  }

                  @Override public void onServicesDiscovered(BluetoothGatt gg, int status) {
                      BluetoothGattService service = gg.getService(FFF0);
                      if (service == null) { failStatus("Terra BLE service not found", "FFF0 missing"); return; }
                      tx = service.getCharacteristic(FFF3);
                      rx = service.getCharacteristic(FFF4);
                      if (tx == null || rx == null) { failStatus("Terra BLE channel incomplete", "FFF3/FFF4 missing"); return; }

                      try {
                          boolean ok = gg.setCharacteristicNotification(rx, true);
                          appendLog("FFF4 local notify=" + ok);
                          BluetoothGattDescriptor d = rx.getDescriptor(CCCD);
                          if (d == null) { failStatus("Notification unavailable", "FFF4 CCCD missing"); return; }

                          if (Build.VERSION.SDK_INT >= 33) {
                              int r = gg.writeDescriptor(d, BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);
                              appendLog("CCCD write result=" + r);
                          } else {
                              d.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);
                              appendLog("CCCD write=" + gg.writeDescriptor(d));
                          }
                      } catch(Exception e) {
                          failStatus("FFF4 notification failed", safeError(e));
                      }
                  }

                  @Override public void onDescriptorWrite(BluetoothGatt gg, BluetoothGattDescriptor descriptor, int status) {
                      if (CCCD.equals(descriptor.getUuid()) && status == BluetoothGatt.GATT_SUCCESS) {
                          transportReady = true;
                          progress("Bluetooth", true, "FFF3 / FFF4 ready");
                          setStatus("Charger connected", deviceNumber
                                  + (firmwareVersion.isEmpty() ? "" : " • FW " + firmwareVersion)
                                  + " • enter PIN");
                          updateButtons();

                          if (chargerPin.getText().toString().trim().length() == 8 && hasSavedAuthorization()) {
                              main.postDelayed(this::autoAuthenticate, 250);
                          }
                      }
                  }

                  private void autoAuthenticate() { authenticateCharger(); }

                  @Override public void onCharacteristicWrite(BluetoothGatt gg, BluetoothGattCharacteristic characteristic, int status) {
                      txBusy = false;
                      if (status != BluetoothGatt.GATT_SUCCESS) {
                          txChunks.clear();
                          failStatus("BLE write failed", "GATT status " + status);
                          return;
                      }
                      sendNextChunk();
                  }

                  @Override public void onCharacteristicChanged(BluetoothGatt gg, BluetoothGattCharacteristic characteristic) {
                      onRx(characteristic.getValue());
                  }
              };

              @Override protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                  getWindow().setStatusBarColor(Color.rgb(6,16,28));
                  buildUi();

                  BluetoothManager bm = (BluetoothManager)getSystemService(BLUETOOTH_SERVICE);
                  adapter = bm == null ? null : bm.getAdapter();
                  requestPerms();

                  updateAdminState();
                  appendLog("ABB Terra Direct Secure 3.2 started");
                  appendLog("Daily operation: PIN + direct secure BLE. Secure 0xFE authentication is AES-GCM from handshake step 1. Handshake result byte 0x00 = accepted.");
              }

              private void buildUi() {
