name: Build ABB Terra Provisioner FINAL

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/elmecon/abbterra
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'ABBTerraProvisioner'
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.elmecon.abbterra'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.elmecon.abbterra'
                  minSdk 23
                  targetSdk 35
                  versionCode 100
                  versionName '1.0-final'
              }

              buildTypes {
                  release { minifyEnabled false }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
          </paths>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="true" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <queries>
                  <package android:name="com.abbemobility.terraconfig" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="ABB Terra Provisioner"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.provider"
                      android:exported="false"
                      android:grantUriPermissions="true" />
              </application>
          </manifest>
          EOF

          # Remove FileProvider dependency requirement: we use ACTION_CREATE_DOCUMENT for saving
          python3 - <<'PY'
          p='app/src/main/AndroidManifest.xml'
          s=open(p).read()
          a=s.index('                  <provider')
          b=s.index('                  </provider>',a)+len('                  </provider>\n')
          s=s[:a]+s[b:]
          open(p,'w').write(s)
          PY

          cat > app/src/main/java/com/elmecon/abbterra/MainActivity.java <<'EOF'
          package com.elmecon.abbterra;

          import android.Manifest;
          import android.app.Activity;
          import android.bluetooth.*;
          import android.bluetooth.le.*;
          import android.content.*;
          import android.content.pm.PackageManager;
          import android.graphics.Typeface;
          import android.net.Uri;
          import android.os.*;
          import android.text.InputType;
          import android.view.*;
          import android.widget.*;

          import org.json.JSONObject;

          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class MainActivity extends Activity {
              private static final int REQ_PERMISSIONS=7001, REQ_SAVE_JSON=8001;
              private static final UUID FFF0=UUID.fromString("0000fff0-0000-1000-8000-00805f9b34fb");
              private static final UUID FFF3=UUID.fromString("0000fff3-0000-1000-8000-00805f9b34fb");
              private static final UUID FFF4=UUID.fromString("0000fff4-0000-1000-8000-00805f9b34fb");
              private static final UUID CCCD=UUID.fromString("00002902-0000-1000-8000-00805f9b34fb");
              private static final UUID GAP=UUID.fromString("00001800-0000-1000-8000-00805f9b34fb");
              private static final UUID DEVICE_NAME=UUID.fromString("00002a00-0000-1000-8000-00805f9b34fb");

              private BluetoothAdapter adapter;
              private BluetoothLeScanner scanner;
              private BluetoothGatt gatt;
              private BluetoothGattCharacteristic tx, rx, deviceNameChar;
              private boolean notifyReady=false;
              private final Set<String> seen=new HashSet<>();
              private final Handler handler=new Handler(Looper.getMainLooper());

              private TextView status, link, log;
              private LinearLayout deviceList;
              private EditText url, chargerId, authKey, wifiName, maxCurrent;
              private CheckBox requirePassword;
              private Spinner schemeSpinner;
              private Button scanBtn, verifyBtn, disconnectBtn, saveBtn, copyBtn, openTerraBtn;
              private String pendingJson="";

              private final ScanCallback scanCb=new ScanCallback() {
                  @Override public void onScanResult(int callbackType, ScanResult result) {
                      BluetoothDevice d=result.getDevice();
                      String addr=safeAddr(d);
                      if(addr==null || seen.contains(addr)) return;
                      seen.add(addr);
                      String n=safeName(d);
                      if(n==null) n="Unnamed BLE";
                      final String name=n;
                      runOnUiThread(() -> addDevice(d,name,addr,result.getRssi()));
                  }
                  @Override public void onScanFailed(int errorCode) {
                      append("SCAN FAILED code="+errorCode);
                      setStatus("BLE scan failed: "+errorCode);
                  }
              };

              private final BluetoothGattCallback cb=new BluetoothGattCallback() {
                  @Override public void onConnectionStateChange(BluetoothGatt gg,int st,int ns) {
                      append("GATT state status="+st+" newState="+state(ns)+" device="+safeAddr(gg.getDevice()));
                      if(st==BluetoothGatt.GATT_SUCCESS && ns==BluetoothProfile.STATE_CONNECTED) {
                          gatt=gg;
                          setStatus("BLE connected");
                          setLink("GATT CONNECTED • preparing FFF3/FFF4");
                          try { append("requestConnectionPriority(HIGH)="+gg.requestConnectionPriority(BluetoothGatt.CONNECTION_PRIORITY_HIGH)); } catch(Exception ignored){}
                          try { append("requestMtu(247)="+gg.requestMtu(247)); } catch(Exception ignored){}
                          handler.postDelayed(() -> {
                              try { append("discoverServices()="+gg.discoverServices()); }
                              catch(Exception e){ append("discoverServices error="+e.getMessage()); }
                          },250);
                      } else if(ns==BluetoothProfile.STATE_DISCONNECTED) {
                          clearGattState();
                          setStatus("Disconnected");
                          setLink("NOT CONNECTED");
                      }
                  }

                  @Override public void onMtuChanged(BluetoothGatt gg,int mtu,int st) {
                      append("MTU changed mtu="+mtu+" status="+st);
                  }

                  @Override public void onServicesDiscovered(BluetoothGatt gg,int st) {
                      append("SERVICES DISCOVERED status="+st);
                      BluetoothGattService s=gg.getService(FFF0);
                      if(s==null){ setLink("CONNECTED • FFF0 NOT FOUND"); append("ERROR FFF0 not found"); return; }
                      tx=s.getCharacteristic(FFF3);
                      rx=s.getCharacteristic(FFF4);
                      BluetoothGattService gap=gg.getService(GAP);
                      if(gap!=null) deviceNameChar=gap.getCharacteristic(DEVICE_NAME);
                      append("FFF0 found; FFF3="+(tx!=null)+" FFF4="+(rx!=null));
                      if(tx==null || rx==null){ setLink("CONNECTED • FFF3/FFF4 MISSING"); return; }
                      enableNotify(gg);
                  }

                  @Override public void onDescriptorWrite(BluetoothGatt gg,BluetoothGattDescriptor d,int st) {
                      append("DESC WRITE "+d.getUuid()+" status="+st);
                      if(CCCD.equals(d.getUuid()) && st==BluetoothGatt.GATT_SUCCESS) {
                          notifyReady=true;
                          setStatus("Terra BLE transport ready");
                          setLink("CONNECTED • FFF3 TX + FFF4 NOTIFY READY");
                          handler.postDelayed(() -> readName(gg),200);
                      }
                  }

                  @Override public void onCharacteristicRead(BluetoothGatt gg,BluetoothGattCharacteristic c,int st) {
                      byte[] v=c.getValue();
                      append("READ "+c.getUuid()+" status="+st+" value="+hex(v));
                      if(DEVICE_NAME.equals(c.getUuid()) && st==0 && v!=null) {
                          String n=new String(v,StandardCharsets.UTF_8).replace("\u0000","").trim();
                          setLink("CONNECTED • "+n+" • FFF4 READY");
                      }
                  }

                  @Override public void onCharacteristicChanged(BluetoothGatt gg,BluetoothGattCharacteristic c) {
                      append("NOTIFY "+c.getUuid()+" "+hex(c.getValue()));
                  }

                  @Override public void onReadRemoteRssi(BluetoothGatt gg,int rssi,int st) {
                      append("RSSI status="+st+" rssi="+rssi+" dBm");
                      if(st==0) setStatus("BLE link verified • "+rssi+" dBm");
                  }
              };

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  buildUi();
                  BluetoothManager bm=(BluetoothManager)getSystemService(BLUETOOTH_SERVICE);
                  adapter=bm==null?null:bm.getAdapter();
                  requestPerms();
                  append("ABB Terra Provisioner FINAL started");
                  append("Mode: TACW BLE verification + ABB pre-configuration builder.");
                  append("Direct encrypted BLE commissioning is intentionally not guessed.");
              }

              private void buildUi() {
                  ScrollView sv=new ScrollView(this);
                  LinearLayout root=new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16),dp(14),dp(16),dp(28));
                  sv.addView(root,new ScrollView.LayoutParams(-1,-2));

                  root.addView(txt("ABB TERRA PROVISIONER",23,true));
                  TextView sub=txt("FINAL • Custom OCPP + Charger ID + AuthKey helper",14,false);
                  sub.setPadding(0,0,0,dp(12)); root.addView(sub);

                  status=txt("Ready",15,true); status.setPadding(dp(10),dp(10),dp(10),dp(8)); root.addView(status);
                  link=txt("NOT CONNECTED",14,true); link.setPadding(dp(10),0,dp(10),dp(12)); root.addView(link);

                  LinearLayout row=new LinearLayout(this);
                  scanBtn=btn("SCAN BLE"); Button stop=btn("STOP");
                  row.addView(scanBtn,new LinearLayout.LayoutParams(0,dp(52),1));
                  LinearLayout.LayoutParams lp=new LinearLayout.LayoutParams(0,dp(52),1); lp.setMargins(dp(8),0,0,0);
                  row.addView(stop,lp); root.addView(row);
                  scanBtn.setOnClickListener(v->startScan());
                  stop.setOnClickListener(v->stopScan());

                  LinearLayout row2=new LinearLayout(this);
                  verifyBtn=btn("VERIFY LINK"); disconnectBtn=btn("DISCONNECT");
                  verifyBtn.setEnabled(false); disconnectBtn.setEnabled(false);
                  row2.addView(verifyBtn,new LinearLayout.LayoutParams(0,dp(52),1));
                  LinearLayout.LayoutParams lp2=new LinearLayout.LayoutParams(0,dp(52),1); lp2.setMargins(dp(8),0,0,0);
                  row2.addView(disconnectBtn,lp2); root.addView(row2);
                  verifyBtn.setOnClickListener(v->verifyLink());
                  disconnectBtn.setOnClickListener(v->disconnectGatt());

                  TextView dtitle=txt("Nearby TACW / BLE devices",16,true); dtitle.setPadding(0,dp(16),0,dp(6)); root.addView(dtitle);
                  deviceList=new LinearLayout(this); deviceList.setOrientation(LinearLayout.VERTICAL); root.addView(deviceList);

                  TextView ct=txt("CUSTOM OCPP CONFIGURATION",18,true); ct.setPadding(0,dp(20),0,dp(6)); root.addView(ct);

                  chargerId=input("Charger ID / Charge Point Identity");
                  url=input("Server host/path, contoh: homecharging.pln.co.id/ocpp");
                  authKey=input("Authorization Key / Password");
                  authKey.setInputType(InputType.TYPE_CLASS_TEXT|InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  wifiName=input("WiFi SSID (opsional)");
                  maxCurrent=input("Maximum current A (default 32)");
                  maxCurrent.setInputType(InputType.TYPE_CLASS_NUMBER);
                  maxCurrent.setText("32");

                  schemeSpinner=new Spinner(this);
                  ArrayAdapter<String> sp=new ArrayAdapter<>(this,android.R.layout.simple_spinner_dropdown_item,new String[]{"wss://","ws://"});
                  schemeSpinner.setAdapter(sp);

                  requirePassword=new CheckBox(this);
                  requirePassword.setText("Server requires password / AuthKey");
                  requirePassword.setChecked(true);

                  root.addView(label("Protocol / transport"));
                  root.addView(schemeSpinner);
                  root.addView(chargerId);
                  root.addView(url);
                  root.addView(authKey);
                  root.addView(requirePassword);
                  root.addView(wifiName);
                  root.addView(maxCurrent);

                  Button preview=btn("PREVIEW ABB JSON");
                  saveBtn=btn("SAVE PRE-CONFIG JSON");
                  copyBtn=btn("COPY AUTHKEY");
                  openTerraBtn=btn("OPEN TERRACONFIG");
                  root.addView(preview,new LinearLayout.LayoutParams(-1,dp(54)));
                  root.addView(saveBtn,new LinearLayout.LayoutParams(-1,dp(54)));
                  root.addView(copyBtn,new LinearLayout.LayoutParams(-1,dp(54)));
                  root.addView(openTerraBtn,new LinearLayout.LayoutParams(-1,dp(54)));

                  preview.setOnClickListener(v->{
                      try { pendingJson=makeJson(); append("PROFILE JSON:\n"+pendingJson); toast("JSON generated. See log."); }
                      catch(Exception e){ toast(e.getMessage()); }
                  });
                  saveBtn.setOnClickListener(v->saveJson());
                  copyBtn.setOnClickListener(v->copyAuth());
                  openTerraBtn.setOnClickListener(v->openTerraConfig());

                  TextView note=txt(
                      "Workflow: isi Charger ID + URL + AuthKey → Save JSON → import pre-configuration di TerraConfig → paste AuthKey saat diminta → Configure charger. " +
                      "AuthKey tidak dimasukkan ke JSON karena export ABB hanya menyimpan passwordSupport, bukan password plaintext.",12,false);
                  note.setPadding(0,dp(8),0,dp(14)); root.addView(note);

                  LinearLayout lh=new LinearLayout(this); lh.setGravity(Gravity.CENTER_VERTICAL);
                  TextView lt=txt("BLE / Provisioning Log",17,true);
                  Button c=btn("COPY LOG");
                  lh.addView(lt,new LinearLayout.LayoutParams(0,-2,1));
                  lh.addView(c,new LinearLayout.LayoutParams(dp(110),dp(46))); root.addView(lh);
                  log=txt("",11,false); log.setTypeface(Typeface.MONOSPACE); log.setTextIsSelectable(true);
                  log.setPadding(dp(8),dp(8),dp(8),dp(8)); root.addView(log,new LinearLayout.LayoutParams(-1,dp(520)));
                  c.setOnClickListener(v->{
                      ClipboardManager cm=(ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("ABB Terra log",log.getText()));
                      toast("Log copied");
                  });

                  setContentView(sv);
              }

              private JSONObject baseProfile() throws Exception {
                  JSONObject root=new JSONObject();
                  root.put("configuration_version",2);

                  JSONObject connections=new JSONObject();
                  JSONObject wifi=new JSONObject();
                  String w=wifiName.getText().toString().trim();
                  if(!w.isEmpty()) wifi.put("name",w);
                  connections.put("wifi",wifi);
                  root.put("connections",connections);

                  JSONObject cs=new JSONObject();
                  JSONObject ove=new JSONObject(); ove.put("enabled",false); cs.put("ove_r37",ove);
                  root.put("country_specific",cs);

                  JSONObject em=new JSONObject();
                  int amps=32;
                  try { amps=Integer.parseInt(maxCurrent.getText().toString().trim()); } catch(Exception ignored){}
                  em.put("charger_amperage",amps);
                  em.put("electrical_grid_network_type","tt_tn");
                  em.put("max_current",amps);
                  em.put("phase_connection_order","L1");
                  root.put("energy_management",em);

                  root.put("external_cards_enabled",false);
                  root.put("free_vending_enabled",false);
                  root.put("input_output",new JSONObject());

                  JSONObject loc=new JSONObject();
                  loc.put("address","");
                  JSONObject coord=new JSONObject(); coord.put("latitude",-5.0); coord.put("longitude",120.0);
                  loc.put("coordinates",coord); loc.put("country_code","ID"); loc.put("isPublic",false); loc.put("region_code","");
                  root.put("location",loc);

                  JSONObject ocpp=new JSONObject();
                  ocpp.put("charger_identity",chargerId.getText().toString().trim());

                  JSONObject server=new JSONObject();
                  server.put("certificate","");
                  server.put("certificateNumber","0");
                  server.put("id","");
                  server.put("name","");
                  server.put("passwordSupport",requirePassword.isChecked()?1:0);
                  server.put("protocol_type","OCPP");
                  server.put("protocol_version","ocpp1.6j");
                  String scheme=(String)schemeSpinner.getSelectedItem();
                  server.put("server_type",scheme);
                  server.put("type","custom");
                  String u=url.getText().toString().trim();
                  if(u.startsWith("ws://")) u=u.substring(5);
                  if(u.startsWith("wss://")) u=u.substring(6);
                  server.put("url",scheme+u);
                  ocpp.put("server",server);
                  root.put("ocpp",ocpp);

                  JSONObject protocol=new JSONObject();
                  protocol.put("charger_protocol","bc");
                  protocol.put("15118_duty_cycle_mode",0);
                  root.put("protocol",protocol);

                  JSONObject schedule=new JSONObject();
                  schedule.put("editable",true);
                  schedule.put("plan",new org.json.JSONArray());
                  schedule.put("randomized_delay",0);
                  schedule.put("randomized_delay_mode",2);
                  root.put("schedule",schedule);
                  return root;
              }

              private String makeJson() throws Exception {
                  String id=chargerId.getText().toString().trim();
                  String u=url.getText().toString().trim();
                  if(id.isEmpty()) throw new Exception("Charger ID wajib diisi.");
                  if(u.isEmpty()) throw new Exception("OCPP URL wajib diisi.");
                  if(requirePassword.isChecked() && authKey.getText().toString().isEmpty())
                      throw new Exception("AuthKey/password wajib diisi jika password diaktifkan.");
                  return baseProfile().toString();
              }

              private void saveJson() {
                  try {
                      pendingJson=makeJson();
                      Intent i=new Intent(Intent.ACTION_CREATE_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      i.setType("application/json");
                      i.putExtra(Intent.EXTRA_TITLE,"ABB-Terra-Custom-OCPP.json");
                      startActivityForResult(i,REQ_SAVE_JSON);
                  } catch(Exception e){ toast(e.getMessage()); }
              }

              @Override protected void onActivityResult(int req,int res,Intent data) {
                  super.onActivityResult(req,res,data);
                  if(req==REQ_SAVE_JSON && res==RESULT_OK && data!=null && data.getData()!=null) {
                      try(OutputStream os=getContentResolver().openOutputStream(data.getData())) {
                          os.write(pendingJson.getBytes(StandardCharsets.UTF_8));
                          os.flush();
                          append("Saved ABB pre-configuration JSON: "+data.getData());
                          toast("JSON saved. Import it from TerraConfig Pre-configuration.");
                      } catch(Exception e){ append("Save JSON error: "+e); toast("Save failed: "+e.getMessage()); }
                  }
              }

              private void copyAuth() {
                  String k=authKey.getText().toString();
                  if(k.isEmpty()){ toast("AuthKey masih kosong"); return; }
                  ClipboardManager cm=(ClipboardManager)getSystemService(CLIPBOARD_SERVICE);
                  cm.setPrimaryClip(ClipData.newPlainText("ABB Terra AuthKey",k));
                  toast("AuthKey copied");
              }

              private void openTerraConfig() {
                  Intent launch=getPackageManager().getLaunchIntentForPackage("com.abbemobility.terraconfig");
                  if(launch==null){ toast("TerraConfig tidak ditemukan di HP."); return; }
                  startActivity(launch);
              }

              private void startScan() {
                  if(adapter==null){ toast("Bluetooth tidak tersedia"); return; }
                  if(!permOk()){ requestPerms(); return; }
                  if(!adapter.isEnabled()){ toast("Aktifkan Bluetooth"); return; }
                  scanner=adapter.getBluetoothLeScanner();
                  if(scanner==null){ toast("BLE scanner tidak tersedia"); return; }
                  stopScan(); seen.clear(); deviceList.removeAllViews();
                  setStatus("Scanning BLE 20 detik...");
                  try { scanner.startScan(scanCb); append("BLE scan started"); handler.postDelayed(this::stopScan,20000); }
                  catch(Exception e){ append("startScan error="+e.getMessage()); }
              }

              private void stopScan() {
                  if(scanner!=null) try { scanner.stopScan(scanCb); } catch(Exception ignored){}
              }

              private void addDevice(BluetoothDevice d,String name,String addr,int rssi) {
                  if(!name.toUpperCase(Locale.US).startsWith("TACW")) return;
                  Button b=btn(name+"\n"+addr+"   RSSI "+rssi+" dBm");
                  b.setGravity(Gravity.START|Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams p=new LinearLayout.LayoutParams(-1,dp(68)); p.setMargins(0,0,0,dp(6));
                  deviceList.addView(b,p);
                  b.setOnClickListener(v->connect(d));
              }

              private void connect(BluetoothDevice d) {
                  stopScan(); disconnectGatt();
                  setStatus("Connecting "+safeName(d));
                  setLink("CONNECTING...");
                  append("Connecting "+safeName(d)+" "+safeAddr(d));
                  try {
                      gatt=Build.VERSION.SDK_INT>=23 ? d.connectGatt(this,false,cb,BluetoothDevice.TRANSPORT_LE)
                                                    : d.connectGatt(this,false,cb);
                  } catch(Exception e){ append("connectGatt error="+e.getMessage()); }
              }

              private void enableNotify(BluetoothGatt gg) {
                  try {
                      append("setCharacteristicNotification="+gg.setCharacteristicNotification(rx,true));
                      BluetoothGattDescriptor d=rx.getDescriptor(CCCD);
                      if(d==null){ append("CCCD missing"); return; }
                      if(Build.VERSION.SDK_INT>=33) append("writeDescriptor="+gg.writeDescriptor(d,BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE));
                      else { d.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE); append("writeDescriptor="+gg.writeDescriptor(d)); }
                  } catch(Exception e){ append("notify setup error="+e.getMessage()); }
              }

              private void readName(BluetoothGatt gg) {
                  if(deviceNameChar==null) return;
                  try { append("read DeviceName="+gg.readCharacteristic(deviceNameChar)); } catch(Exception ignored){}
              }

              private void verifyLink() {
                  if(gatt==null){ toast("Belum terhubung"); return; }
                  try { append("readRemoteRssi="+gatt.readRemoteRssi()); } catch(Exception ignored){}
                  handler.postDelayed(() -> readName(gatt),300);
              }

              private void disconnectGatt() {
                  BluetoothGatt gg=gatt; gatt=null; clearGattState();
                  if(gg!=null){ try{gg.disconnect();}catch(Exception ignored){} try{gg.close();}catch(Exception ignored){} }
              }

              private void clearGattState() {
                  notifyReady=false; tx=null; rx=null; deviceNameChar=null;
                  runOnUiThread(() -> { verifyBtn.setEnabled(gatt!=null); disconnectBtn.setEnabled(gatt!=null); });
              }

              private void requestPerms() {
                  if(Build.VERSION.SDK_INT>=31)
                      requestPermissions(new String[]{Manifest.permission.BLUETOOTH_SCAN,Manifest.permission.BLUETOOTH_CONNECT},REQ_PERMISSIONS);
                  else if(Build.VERSION.SDK_INT>=23)
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION},REQ_PERMISSIONS);
              }

              private boolean permOk() {
                  if(Build.VERSION.SDK_INT>=31)
                      return checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN)==PackageManager.PERMISSION_GRANTED &&
                             checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)==PackageManager.PERMISSION_GRANTED;
                  return Build.VERSION.SDK_INT<23 || checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)==PackageManager.PERMISSION_GRANTED;
              }

              private void setStatus(String s) {
                  runOnUiThread(() -> {
                      status.setText(s);
                      boolean c=gatt!=null;
                      verifyBtn.setEnabled(c); disconnectBtn.setEnabled(c);
                  });
              }
              private void setLink(String s){ runOnUiThread(() -> link.setText(s)); }

              private void append(String s) {
                  String l=new SimpleDateFormat("HH:mm:ss.SSS",Locale.US).format(new Date())+"  "+s+"\n";
                  runOnUiThread(() -> { if(log!=null) log.append(l); });
              }

              private String safeName(BluetoothDevice d){ try{return d==null?null:d.getName();}catch(Exception e){return null;} }
              private String safeAddr(BluetoothDevice d){ try{return d==null?null:d.getAddress();}catch(Exception e){return null;} }
              private String state(int s){
                  if(s==BluetoothProfile.STATE_CONNECTED)return "CONNECTED";
                  if(s==BluetoothProfile.STATE_CONNECTING)return "CONNECTING";
                  if(s==BluetoothProfile.STATE_DISCONNECTED)return "DISCONNECTED";
                  if(s==BluetoothProfile.STATE_DISCONNECTING)return "DISCONNECTING";
                  return String.valueOf(s);
              }
              private String hex(byte[] b){ if(b==null)return "<null>"; StringBuilder s=new StringBuilder(); for(byte x:b)s.append(String.format(Locale.US,"%02X",x)); return s.toString(); }

              private TextView label(String s){ TextView t=txt(s,13,true); t.setPadding(0,dp(8),0,0); return t; }
              private TextView txt(String s,float sz,boolean bold){ TextView t=new TextView(this); t.setText(s); t.setTextSize(sz); if(bold)t.setTypeface(Typeface.DEFAULT,Typeface.BOLD); return t; }
              private Button btn(String s){ Button b=new Button(this); b.setText(s); b.setAllCaps(false); return b; }
              private EditText input(String h){ EditText e=new EditText(this); e.setHint(h); e.setSingleLine(true); e.setPadding(dp(10),dp(6),dp(10),dp(6)); return e; }
              private int dp(int v){ return Math.round(v*getResources().getDisplayMetrics().density); }
              private void toast(String s){ Toast.makeText(this,s,Toast.LENGTH_LONG).show(); }

              @Override protected void onDestroy(){ super.onDestroy(); stopScan(); disconnectGatt(); }
          }
          EOF

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/ABB-Terra-Provisioner-FINAL.apk
          cd artifact
          sha256sum ABB-Terra-Provisioner-FINAL.apk | tee ABB-Terra-Provisioner-FINAL.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABB-Terra-Provisioner-FINAL
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
