              private final ScanCallback scanCallback = new ScanCallback() {
                  @Override public void onScanResult(int callbackType, ScanResult result) {
                      BluetoothDevice d = result.getDevice();
                      String addr = safeAddress(d);
                      if (addr == null || seen.contains(addr)) return;
                      String name = safeName(d);
                      if (name == null || !name.toUpperCase(Locale.US).startsWith("TACW")) return;

                      seen.add(addr);
                      byte[] raw = result.getScanRecord() == null ? null : result.getScanRecord().getBytes();
                      String fw = firmwareFromScanRecord(raw);
                      firmwareByAddress.put(addr, fw);
                      appendLog("SCAN " + name + " RSSI=" + result.getRssi()
                              + (fw.isEmpty() ? "" : " fw=" + fw));

                      if (autoReconnectEnabled
                              && !autoReconnectDeviceNumber.isEmpty()
                              && autoReconnectDeviceNumber.equals(name)) {
                          appendLog("AUTO-RECONNECT target found: " + name);
                          autoReconnectEnabled=false;
                          runOnUiThread(() -> {
                              deviceNumber=name;
                              deviceAddress=addr;
                              firmwareVersion=fw;
                              selectedDevice.setText(name+" • auto reconnect");
                              collapseDeviceList();
                              connect(d);
                          });
                          return;
                      }

                      runOnUiThread(() -> addDevice(d, name, addr, result.getRssi(), fw));
                  }

                  @Override public void onScanFailed(int errorCode) {
                      failStatus("BLE scan failed", "Code " + errorCode);
                  }
              };

              private final BluetoothGattCallback gattCallback = new BluetoothGattCallback() {
                  @Override public void onConnectionStateChange(BluetoothGatt gg, int status, int newState) {
                      appendLog("GATT state status=" + status + " state=" + newState);
                      if (status == BluetoothGatt.GATT_SUCCESS && newState == BluetoothProfile.STATE_CONNECTED) {
                          gatt = gg;
                          progress("Bluetooth", true, "GATT connected");
                          setStatus("Bluetooth connected", "Opening Terra configuration channel...");
                          try { gg.requestConnectionPriority(BluetoothGatt.CONNECTION_PRIORITY_HIGH); } catch(Exception ignored) {}
                          try { gg.requestMtu(247); } catch(Exception ignored) {}
                          main.postDelayed(() -> {
                              try { gg.discoverServices(); }
                              catch(Exception e) { failStatus("Service discovery failed", safeError(e)); }
                          }, 250);
                      } else if (newState == BluetoothProfile.STATE_DISCONNECTED) {
                          boolean rebootFlow=awaitingExpectedReboot;
                          String target=deviceNumber;

                          clearSession();
                          authInProgress=false;
                          readInProgress=false;
                          progress("Bluetooth", false, rebootFlow ? "Charger rebooting..." : "Disconnected");
                          progress("Secure session", false, "Not authenticated");

                          if (rebootFlow && target!=null && !target.isEmpty()) {
                              awaitingExpectedReboot=false;
                              autoReconnectDeviceNumber=target;
                              autoReconnectEnabled=true;
                              setStatus("CHARGER REBOOTING","Waiting for "+target+" to return...");
                              appendLog("Expected reboot detected. Auto reconnect armed for "+target);
                              // FW 2.1.0 advertises again before its FFF0 service is always ready.
                              // Give the charger more time to finish the network/BLE restart.
                              main.postDelayed(() -> startScan(),8000);
                          } else {
                              setStatus("Disconnected", "Scan and select charger.");
                          }
                          updateButtons();
                      }
                  }

                  @Override public void onMtuChanged(BluetoothGatt gg, int newMtu, int status) {
                      if (status == BluetoothGatt.GATT_SUCCESS) mtu = newMtu;
                      appendLog("MTU=" + newMtu + " status=" + status);
                  }

                  @Override public void onServicesDiscovered(BluetoothGatt gg, int status) {
                      BluetoothGattService service = gg.getService(FFF0);
                      if (service == null) {
                          appendLog("FFF0 missing after reconnect; charger may still be booting.");
                          if (autoReconnectDeviceNumber!=null && !autoReconnectDeviceNumber.isEmpty()) {
                              String target=autoReconnectDeviceNumber;
                              try { gg.disconnect(); } catch(Exception ignored) {}
                              autoReconnectDeviceNumber=target;
                              autoReconnectEnabled=true;
                              setStatus("CHARGER STILL BOOTING","FFF0 not ready; retrying automatically...");
                              main.postDelayed(() -> startScan(),5000);
                          } else {
                              failStatus("Terra BLE service not found", "FFF0 missing");
                          }
                          return;
                      }
                      tx = service.getCharacteristic(FFF3);
                      rx = service.getCharacteristic(FFF4);
                      if (tx == null || rx == null) { failStatus("Terra BLE channel incomplete", "FFF3/FFF4 missing"); return; }

                      try {
                          boolean ok = gg.setCharacteristicNotification(rx, true);
                          appendLog("FFF4 local notify=" + ok);
                          BluetoothGattDescriptor d = rx.getDescriptor(CCCD);
                          if (d == null) { failStatus("Notification unavailable", "FFF4 CCCD missing"); return; }

                          if (Build.VERSION.SDK_INT >= 33) {
                              int r = gg.writeDescriptor(d, BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);
                              appendLog("CCCD write result=" + r);
                          } else {
                              d.setValue(BluetoothGattDescriptor.ENABLE_NOTIFICATION_VALUE);
                              appendLog("CCCD write=" + gg.writeDescriptor(d));
                          }
                      } catch(Exception e) {
                          failStatus("FFF4 notification failed", safeError(e));
                      }
                  }

                  @Override public void onDescriptorWrite(BluetoothGatt gg, BluetoothGattDescriptor descriptor, int status) {
                      if (CCCD.equals(descriptor.getUuid()) && status == BluetoothGatt.GATT_SUCCESS) {
                          transportReady = true;
                          progress("Bluetooth", true, "FFF3 / FFF4 ready");
                          setStatus("Charger connected", deviceNumber
                                  + (firmwareVersion.isEmpty() ? "" : " • FW " + firmwareVersion)
                                  + " • enter PIN");
                          updateButtons();

                          if (chargerPin.getText().toString().trim().length() == 8
                                  && hasSavedAuthorization()
                                  && !authenticated
                                  && !authInProgress) {
                              main.postDelayed(this::autoAuthenticate, 400);
                          }
                      }
                  }

                  private void autoAuthenticate() {
                      if (!authenticated && !authInProgress && transportReady) authenticateCharger();
                  }

                  @Override public void onCharacteristicWrite(BluetoothGatt gg, BluetoothGattCharacteristic characteristic, int status) {
                      txBusy = false;
                      if (status != BluetoothGatt.GATT_SUCCESS) {
                          txChunks.clear();
                          failStatus("BLE write failed", "GATT status " + status);
                          return;
                      }
                      sendNextChunk();
                  }

                  @Override public void onCharacteristicChanged(BluetoothGatt gg, BluetoothGattCharacteristic characteristic) {
                      onRx(characteristic.getValue());
                  }
              };

              @Override protected void onCreate(Bundle savedInstanceState) {
