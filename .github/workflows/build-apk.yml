      - name: Build APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          set -e
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/ABB-Terra-Direct-Secure-3.2.apk
          cd artifact
          sha256sum ABB-Terra-Direct-Secure-3.2.apk | tee ABB-Terra-Direct-Secure-3.2.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABB-Terra-Direct-Secure-3.2
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
