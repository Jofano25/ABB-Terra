              private void disconnectGattOnly() {
                  BluetoothGatt gg=gatt;
                  gatt=null;
                  if (gg!=null) {
                      try { gg.disconnect(); } catch(Exception ignored) {}
                      try { gg.close(); } catch(Exception ignored) {}
                  }
              }

              private void clearSession() {
                  transportReady=false;
                  authenticated=false;
                  authInProgress=false;
                  readInProgress=false;
                  encryptedMode=false;
                  internetReady=false;
                  expectedNetworkMode=0;
                  lastTcpIpSummary="";
                  tx=null;rx=null;
                  encryptionKey=null;
                  cipherInfo=null;
                  sessionToken=new byte[8];
                  clientNonce=null;
                  waitingCmd=-1;
                  waitingCallback=null;
                  if (responseTimeout!=null) main.removeCallbacks(responseTimeout);
                  txChunks.clear();
                  rxBuffer.reset();
              }

              private String http(String method,String endpoint,String contentType,String body,String bearer) throws Exception {
                  HttpURLConnection c=(HttpURLConnection)new URL(endpoint).openConnection();
                  c.setConnectTimeout(15000);
                  c.setReadTimeout(20000);
                  c.setRequestMethod(method);
                  c.setRequestProperty("Accept","application/json");
                  c.setRequestProperty("X-APP-VERSION","3.5.0");
                  if (bearer!=null && !bearer.isEmpty()) c.setRequestProperty("Authorization","Bearer "+bearer);

                  if (body!=null) {
                      c.setDoOutput(true);
                      c.setRequestProperty("Content-Type",contentType==null?"application/json":contentType);
                      try(OutputStream os=c.getOutputStream()) {
                          os.write(body.getBytes(StandardCharsets.UTF_8));
                      }
                  }

                  int code=c.getResponseCode();
                  InputStream in=code>=200&&code<300?c.getInputStream():c.getErrorStream();
                  String text=readAll(in);
                  if (code<200 || code>=300) throw new HttpError(code,"HTTP "+code+" "+compact(text));
                  return text;
              }

              private SecretKey getOrCreateKey() throws Exception {
                  KeyStore ks=KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (ks.containsAlias(KEY_ALIAS)) {
                      return ((KeyStore.SecretKeyEntry)ks.getEntry(KEY_ALIAS,null)).getSecretKey();
                  }

                  KeyGenerator kg=KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES,"AndroidKeyStore");
                  kg.init(new KeyGenParameterSpec.Builder(KEY_ALIAS,
                          KeyProperties.PURPOSE_ENCRYPT|KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .build());
                  return kg.generateKey();
              }

              private void writeSecure(String name,String plain) throws Exception {
                  if (plain==null) plain="";
                  SecretKey key=getOrCreateKey();
                  Cipher c=Cipher.getInstance("AES/GCM/NoPadding");
                  c.init(Cipher.ENCRYPT_MODE,key);
                  byte[] iv=c.getIV();
                  byte[] encrypted=c.doFinal(plain.getBytes(StandardCharsets.UTF_8));
                  prefs.edit().putString(name,Base64.encodeToString(concat(iv,encrypted),Base64.NO_WRAP)).apply();
              }

              private String readSecure(String name) {
                  try {
                      String saved=prefs.getString(name,"");
                      if (saved==null || saved.isEmpty()) return "";
                      byte[] all=Base64.decode(saved,Base64.NO_WRAP);
                      if (all.length<13) return "";

                      byte[] iv=Arrays.copyOfRange(all,0,12);
                      byte[] encrypted=Arrays.copyOfRange(all,12,all.length);
                      Cipher c=Cipher.getInstance("AES/GCM/NoPadding");
                      c.init(Cipher.DECRYPT_MODE,getOrCreateKey(),new GCMParameterSpec(128,iv));
                      return new String(c.doFinal(encrypted),StandardCharsets.UTF_8);
                  } catch(Exception e) { return ""; }
              }

              private void deleteKey() throws Exception {
                  KeyStore ks=KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (ks.containsAlias(KEY_ALIAS)) ks.deleteEntry(KEY_ALIAS);
              }

              private static String firmwareFromScanRecord(byte[] record) {
                  try {
                      if (record==null) return "";
                      int pos=0;
                      while(pos<record.length) {
                          int len=record[pos]&0xff;
                          if (len==0) break;
                          if (pos+len>=record.length) break;
                          int type=record[pos+1]&0xff;
                          if (type==0xFF) {
                              int dataLen=len-1;
                              int start=pos+2;
                              if (dataLen>=5 && (record[start]&0xff)==0xFE) {
                                  int b3=record[start+3]&0xff;
                                  int b4=record[start+4]&0xff;
                                  if (b3==0x56) b3=0;
                                  if (b4==0x56) b4=0;
                                  int fw=b3|(b4<<8);
                                  String s=String.valueOf(fw);
                                  while(s.length()<3) s=s+"0";
                                  return s.substring(0,1)+"."+s.substring(1,2)+"."+s.substring(2);
                              }
                          }
                          pos+=len+1;
                      }
                  } catch(Exception ignored) {}
                  return "";
              }

              private void requestPerms() {
                  if (Build.VERSION.SDK_INT>=31)
                      requestPermissions(new String[]{Manifest.permission.BLUETOOTH_SCAN,Manifest.permission.BLUETOOTH_CONNECT},REQ_PERMS);
                  else if (Build.VERSION.SDK_INT>=23)
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION},REQ_PERMS);
              }

              private boolean permOk() {
                  if (Build.VERSION.SDK_INT>=31)
                      return checkSelfPermission(Manifest.permission.BLUETOOTH_SCAN)==PackageManager.PERMISSION_GRANTED
                              && checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)==PackageManager.PERMISSION_GRANTED;
                  return Build.VERSION.SDK_INT<23
                          || checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)==PackageManager.PERMISSION_GRANTED;
              }

