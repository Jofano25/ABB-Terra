              private void appendLog(String s) {
                  // Never log ABB password, charger PIN, AuthKey, bearer token, cipher key or info.
                  final String line=new SimpleDateFormat("HH:mm:ss.SSS",Locale.US).format(new Date())+"  "+s+"\n";
                  runOnUiThread(() -> { if(logText!=null)logText.append(line); });
              }

              private static byte[] concat(byte[]... arr) {
                  int total=0;
                  for(byte[] x:arr) if(x!=null) total+=x.length;
                  byte[] out=new byte[total];
                  int pos=0;
                  for(byte[] x:arr) {
                      if(x==null) continue;
                      System.arraycopy(x,0,out,pos,x.length);
                      pos+=x.length;
                  }
                  return out;
              }
              private static byte[] leShort(int v){return new byte[]{(byte)(v&255),(byte)((v>>8)&255)};}
              private static byte[] leInt(int v){return new byte[]{(byte)v,(byte)(v>>8),(byte)(v>>16),(byte)(v>>24)};}
              private static byte[] unhex(String s) {
                  s=s.replaceAll("[^0-9A-Fa-f]","");
                  if((s.length()&1)==1)s="0"+s;
                  byte[] b=new byte[s.length()/2];
                  for(int i=0;i<b.length;i++)b[i]=(byte)Integer.parseInt(s.substring(i*2,i*2+2),16);
                  return b;
              }
              private static String hex(byte[] b) {
                  if(b==null)return "";
                  StringBuilder s=new StringBuilder();
                  for(byte x:b)s.append(String.format(Locale.US,"%02X",x));
                  return s.toString();
              }
              private static boolean isAllZero(byte[] b){if(b==null)return true;for(byte x:b)if(x!=0)return false;return true;}
              private static String normalizeFw(String s){
                  if(s==null)return "";
                  s=s.trim();
                  java.util.regex.Matcher m=java.util.regex.Pattern.compile("(\\d+\\.\\d+\\.\\d+)").matcher(s);
                  return m.find()?m.group(1):s;
              }
              private static String safeError(Exception e){return e==null?"Unknown error":(e.getMessage()==null?e.getClass().getSimpleName():e.getMessage());}
              private int dp(int v){return Math.round(v*getResources().getDisplayMetrics().density);}
              private void toast(String s){runOnUiThread(() -> Toast.makeText(this,s,Toast.LENGTH_LONG).show());}

              @Override protected void onDestroy(){super.onDestroy();disconnect();}
          }
          EOF

      - name: Build APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          set -e
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/ABB-Terra-PIN-Direct-Provisioner.apk
          cd artifact
          sha256sum ABB-Terra-PIN-Direct-Provisioner.apk | tee ABB-Terra-PIN-Direct-Provisioner.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABB-Terra-PIN-Direct-Provisioner
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
