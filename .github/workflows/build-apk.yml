                  getWindow().setStatusBarColor(Color.rgb(6,16,28));
                  BluetoothManager bm = (BluetoothManager)getSystemService(BLUETOOTH_SERVICE);
                  adapter = bm == null ? null : bm.getAdapter();
                  requestPerms();

                  // EMOS security policy: ABB installer login is valid only for the
                  // current app process. After the app is closed/killed, the next
                  // launch always asks for login again. Charger profiles remain saved.
                  if (appSessionAuthorized && hasSavedAuthorization()) {
                      buildUi();
                      appendLog("EMOS 5.4 started");
                      appendLog("Installer session active for this app session.");
                  } else {
                      clearAuthorizationTokensOnly();
                      showLoginScreen();
                  }
              }

