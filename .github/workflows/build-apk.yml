      - name: Build APK
        shell: bash
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        shell: bash
        run: |
          set -e
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/EMOS-4.9.apk
          cd artifact
          sha256sum EMOS-4.9.apk | tee EMOS-4.9.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EMOS-4.9
          path: artifact/*
          if-no-files-found: error
          retention-days: 30
